<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S Loop</title>
<script>
// صفحه‌ی پیدا نشد → برگرد به صفحه‌ی اصلیِ همین سایت (زیرپوشه‌ی GitHub Pages را هم حفظ می‌کند)
(function(){var p=location.pathname.split('/').filter(Boolean),base='/';
 if(/github\.io$/.test(location.hostname)&&p.length)base='/'+p[0]+'/';
 location.replace(base+(location.search||''));})();
</script></head>
<body style="font-family:Tahoma,sans-serif;text-align:center;padding:40px;background:#d1d5db">
<h2>در حال بازگشت به S Loop…</h2><p><a href="./">اگر منتقل نشدی اینجا بزن</a></p>
</body></html>

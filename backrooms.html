<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Backrooms</title>
<style>*{margin:0;box-sizing:border-box}body{background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
a{position:fixed;top:8px;left:8px;background:#0008;color:#fff;padding:6px 12px;border-radius:10px;text-decoration:none;z-index:5}#h{position:fixed;top:10px;left:0;right:0;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none;font-weight:700}
#js{position:fixed;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff5}#kn{position:absolute;width:50px;height:50px;border-radius:50%;background:#fff7;left:35px;top:35px}
#m{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000c;text-align:center;padding:20px}#m button{padding:12px 26px;border:0;border-radius:12px;background:#d8c84a;font-weight:800;font-size:1rem}</style></head><body>
<a href="index.html">←</a><div id="h"></div><canvas id="c"></canvas><div id="js"><div id="kn"></div></div><div id="m"><div id="mt"></div><button id="mb"></button></div>
<script>
function slRec(id,s,low){try{s=+s;if(!(s>0))return;const o=JSON.parse(localStorage.getItem('sl-lb-mine')||'{}'),c=o[id];if(!c||(low?s<c.s:s>c.s)){o[id]={s};localStorage.setItem('sl-lb-mine',JSON.stringify(o))}}catch(e){}}
const lg=localStorage.getItem('sl-lang')==='en'?'en':'fa',t=(e,f)=>lg==='en'?e:f;
const cv=document.getElementById('c'),x=cv.getContext('2d'),RW=220,RH=130;cv.width=RW;cv.height=RH;
const hud=document.getElementById('h'),M=document.getElementById('m'),mt=document.getElementById('mt'),mb=document.getElementById('mb');
let map,S,px,py,pa,ex,ey,ent,lvl=1,run=0,keys={},jx=0,jy=0,zbuf=new Float32Array(RW),stam=100,AC,hum;
function gen(){S=7+lvl*2;S|=1;map=[];for(let i=0;i<S;i++){map.push(new Array(S).fill(1))}
 const st=[[1,1]];map[1][1]=0;while(st.length){const[a,b]=st[st.length-1],n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const u=a+dx,v=b+dy;return u>0&&v>0&&u<S-1&&v<S-1&&map[v][u]})
  if(!n.length){st.pop();continue}const[dx,dy]=n[Math.random()*n.length|0];map[b+dy/2][a+dx/2]=0;map[b+dy][a+dx]=0;st.push([a+dx,b+dy])}
 for(let k=0;k<S*S/10;k++){const a=1+Math.random()*(S-2)|0,b=1+Math.random()*(S-2)|0;map[b][a]=0}
 map[S-2][S-2]=2;px=1.5;py=1.5;pa=.8;ex=S-2.5;ey=S-2.5;ent=lvl>=1;stam=100}
function solid(a,b){const v=(map[b|0]||[])[a|0];return v!==0&&v!==2}
function ray(a){let dx=Math.cos(a),dy=Math.sin(a),mx=px|0,my=py|0,ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),sx=dx<0?-1:1,sy=dy<0?-1:1,sdx=(dx<0?px-mx:mx+1-px)*ddx,sdy=(dy<0?py-my:my+1-py)*ddy,side=0,hit=0,e=0;
 while(!hit&&e++<60){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}if(map[my]===undefined||map[my][mx]===undefined||map[my][mx]===1)hit=1;else if(map[my][mx]===2)hit=2}
 const d=side?sdy-ddy:sdx-ddx;return{d:Math.max(d,.05),side,hit}}
function render(ts){const fl=.85+.15*Math.sin(ts/90)*(Math.random()<.03?3:1);
 x.fillStyle='#b9a64a';x.fillRect(0,0,RW,RH/2);x.fillStyle='#6b5d22';x.fillRect(0,RH/2,RW,RH/2);
 const fov=1.05;for(let i=0;i<RW;i++){const a=pa-fov/2+fov*i/RW,r=ray(a),d=r.d*Math.cos(a-pa);zbuf[i]=d;const h=RH/d,sh=Math.max(0,1-d/8)*fl*(r.side?.8:1);
  if(r.hit===2){x.fillStyle=`rgb(${60*sh|0},${255*sh|0},${90*sh|0})`}else{const st=(Math.sin(a*0+i*0)+0);x.fillStyle=`rgb(${215*sh|0},${195*sh|0},${70*sh|0})`}
  x.fillRect(i,(RH-h)/2,1,h);
  // ceiling light panels
  }
 const g=x.createRadialGradient(RW/2,RH/2,RH*.3,RW/2,RH/2,RW*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#000b');x.fillStyle=g;x.fillRect(0,0,RW,RH);
 if(ent){const dx=ex-px,dy=ey-py,dist=Math.hypot(dx,dy);let a=Math.atan2(dy,dx)-pa;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;
  if(Math.abs(a)<fov/2+.2){const sx=(.5+a/fov)*RW,hh=RH/dist*1.1,w=hh*.4;for(let i=Math.max(0,sx-w/2|0);i<Math.min(RW,sx+w/2);i++){if(zbuf[i]>dist){x.fillStyle=`rgba(5,0,0,${Math.min(1,1.3-dist/9)})`;x.fillRect(i,(RH-hh)/2,1,hh);}}
   if(dist<9){x.fillStyle='#f22';x.fillRect(sx-w*.2,(RH-hh)/2+hh*.15,w*.1+1,2);x.fillRect(sx+w*.1,(RH-hh)/2+hh*.15,w*.1+1,2)}}}}
function upd(dt){const sp=(keys.ShiftLeft&&stam>0?3.2:1.9)*dt,turn=2.2*dt;
 if(keys.ArrowLeft)pa-=turn;if(keys.ArrowRight)pa+=turn;
 let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx;
 const mx=(Math.cos(pa)*f-Math.sin(pa)*s)*sp,my=(Math.sin(pa)*f+Math.cos(pa)*s)*sp;
 if(!solid(px+mx+Math.sign(mx)*.2,py))px+=mx;if(!solid(px,py+my+Math.sign(my)*.2))py+=my;
 if(keys.ShiftLeft&&(f||s))stam=Math.max(0,stam-30*dt);else stam=Math.min(100,stam+15*dt);
 if(ent){const dx=px-ex,dy=py-ey,d=Math.hypot(dx,dy),sp2=(.9+lvl*.12)*dt;const nx=ex+dx/d*sp2,ny=ey+dy/d*sp2;if(!solid(nx+.2*Math.sign(dx),ey))ex=nx;if(!solid(ex,ny+.2*Math.sign(dy)))ey=ny;
  if(hum)hum.gain.value=Math.min(.35,.02+.5/(d*d));if(d<.5)end(0)}
 if(map[py|0][px|0]===2)end(1);
 hud.textContent=t('Level ','مرحله ')+lvl+' · '+t('Find the green exit','خروج سبز را پیدا کن')+' · '+(ent?t('It is hunting you…','موجود دنبالته…'):'')}
function end(win){run=0;if(hum)hum.gain.value=0;M.style.display='flex';if(win)slRec('backrooms',lvl);if(win){mt.textContent=t('You noclipped out… Level '+lvl+' done.','از اتاق فرار کردی… مرحله '+lvl+' تمام شد.');lvl++;mb.textContent=t('Next level','مرحله بعد')}else{mt.textContent=t('It caught you.','گرفتتت.');mb.textContent=t('Try again','دوباره');lvl=1}}
function start(){M.style.display='none';gen();run=1;try{if(!AC){AC=new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),o2=AC.createOscillator();hum=AC.createGain();hum.gain.value=.03;o.frequency.value=60;o2.frequency.value=120;o.type='sawtooth';const f=AC.createGain();f.gain.value=.25;o.connect(hum);o2.connect(f);f.connect(hum);hum.connect(AC.destination);o.start();o2.start()}AC.resume()}catch(e){}}
mb.onclick=start;mt.textContent=t('BACKROOMS — find the exit before it finds you.\nWASD / joystick to move, drag to look, Shift to sprint.','BACKROOMS — قبل از اینکه موجود پیدات کنه خروج رو پیدا کن.\nWASD یا جوی‌استیک برای حرکت، کشیدن برای چرخش، Shift برای دویدن.');mt.style.whiteSpace='pre-line';mb.textContent=t('Enter','ورود');
addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
const js=document.getElementById('js'),kn=document.getElementById('kn');let jid=null;
js.addEventListener('touchstart',e=>{jid=e.changedTouches[0].identifier;jm(e.changedTouches[0]);e.preventDefault()});js.addEventListener('touchmove',e=>{for(const q of e.changedTouches)if(q.identifier===jid)jm(q);e.preventDefault()});js.addEventListener('touchend',()=>{jid=null;jx=jy=0;kn.style.left=kn.style.top='35px'});
function jm(q){const r=js.getBoundingClientRect();let a=q.clientX-r.left-60,b=q.clientY-r.top-60;const d=Math.hypot(a,b),m=45;if(d>m){a*=m/d;b*=m/d}kn.style.left=35+a+'px';kn.style.top=35+b+'px';jx=a/m;jy=b/m}
let ld=null;cv.addEventListener('touchstart',e=>{ld=e.touches[e.touches.length-1].clientX});cv.addEventListener('touchmove',e=>{if(ld!==null){const q=e.touches[e.touches.length-1];pa+=(q.clientX-ld)*.006;ld=q.clientX}});cv.addEventListener('touchend',()=>ld=null);
cv.addEventListener('mousemove',e=>{if(e.buttons)pa+=e.movementX*.005});
let lt=0;function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;if(run){upd(dt);}if(map)render(ts);requestAnimationFrame(loop)}
gen();requestAnimationFrame(loop);
</script></body></html>

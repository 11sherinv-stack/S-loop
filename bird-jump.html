<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#81d4fa">
<title>Bird Jump | S Loop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b3e5fc;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#mode{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:999;height:38px;min-width:38px;padding:0 12px;border-radius:19px;border:0;background:rgba(0,0,0,.55);color:#fff;font:600 13px Tahoma,sans-serif;cursor:pointer;line-height:1}
#mode:focus-visible{outline:3px solid #ffeb3b;outline-offset:2px}
#tt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font:14px Tahoma,sans-serif;padding:9px 16px;border-radius:18px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:88vw}
#tt.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mode" type="button" aria-label="حالت کنترل"></button>
<div id="tt"></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=400,H=640,sc=1,ox=0,dpr=1;
var GV=(function(m){return m?Math.min(1,+m[1]/100):.8})(location.hash.match(/v(\d+)/));
var ac=null;function A(){try{if(!ac){var X=window.AudioContext||window.webkitAudioContext;ac=new X()}if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,f2,d,ty,v){var c=A();if(!c)return;var t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(GV*(v||.2),t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}

/* ---------- پرنده‌ی Happy Bird ---------- */
var BS=.19,BW=Math.round(300*BS),BH=Math.round(423*BS),FEET=187*BS;
function drawHappy(cx,cy,t,flapAmp,rot,sx,sy){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(BS*sx,BS*sy);ctx.lineJoin='round';ctx.lineCap='round';
  [-60,60].forEach(function(lx){ctx.beginPath();ctx.moveTo(lx,55);ctx.lineTo(lx,140);ctx.moveTo(lx,140);ctx.lineTo(lx-28,172);ctx.moveTo(lx,140);ctx.lineTo(lx,180);ctx.moveTo(lx,140);ctx.lineTo(lx+28,172);ctx.strokeStyle='#e8742a';ctx.lineWidth=14;ctx.stroke()});
  ctx.strokeStyle='#2a1f3d';ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(-85,-50);ctx.lineTo(-85,-160);ctx.arc(-15,-160,70,Math.PI,0);ctx.lineTo(55,-50);ctx.closePath();ctx.fillStyle='#ffd23f';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,135,67,0,0,7);ctx.fillStyle='#4f9be8';ctx.fill();ctx.stroke();
  var f=Math.sin(t*22)*flapAmp;ctx.beginPath();ctx.moveTo(-92,-12);ctx.quadraticCurveTo(0,14+f,92,-12);ctx.lineWidth=10;ctx.stroke();
  ctx.fillStyle='#2a1f3d';[-37,7].forEach(function(ex){ctx.beginPath();ctx.arc(ex,-160,10,0,7);ctx.fill()});
  ctx.beginPath();ctx.moveTo(-34,-128);ctx.lineTo(-15,-98);ctx.lineTo(4,-128);ctx.closePath();ctx.fillStyle='#ff8a3d';ctx.fill();ctx.lineWidth=8;ctx.stroke();
  ctx.restore();
}

/* ---------- وضعیت بازی ---------- */
var P,plats,score=0,best=0,state='menu',tx,keys={},clouds=[],topY,t0=0,at=0;
try{best=+localStorage.getItem('sl-birdjump-best')||0}catch(e){}

/* ---------- کنترل با کج‌کردن گوشی ---------- */
var modePref='tilt';try{modePref=localStorage.getItem('sl-birdjump-mode')==='touch'?'touch':'tilt'}catch(e){}
var sensorOn=false,gotSensor=false,sensorVal=0,neutral=0,tiltAmt=0,asked=false,denied=false;
var needPerm=!!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function');
function scrAngle(){var a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);return((a%360)+360)%360}
function onOri(e){
  if(e.gamma==null&&e.beta==null)return;
  var a=scrAngle(),v;
  if(a===0)v=e.gamma;else if(a===90)v=e.beta;else if(a===270)v=-e.beta;else v=-e.gamma;
  if(v==null||isNaN(v))return;
  sensorVal=v;
  if(!gotSensor){gotSensor=true;neutral=v;updMode()}
}
function startSensor(){if(sensorOn)return;sensorOn=true;addEventListener('deviceorientation',onOri,true)}
function ensureTilt(cb){
  if(sensorOn||asked||!needPerm){if(!needPerm)startSensor();cb();return}
  asked=true;
  try{
    DeviceOrientationEvent.requestPermission().then(function(r){
      if(r==='granted')startSensor();else{denied=true;modePref='touch';say('اجازه‌ی حسگر داده نشد؛ حالت لمسی فعال شد');updMode()}
      cb();
    }).catch(function(){denied=true;modePref='touch';updMode();cb()});
  }catch(e){cb()}
}
if(!needPerm)startSensor();
var tt=document.getElementById('tt'),ttT=0;
function say(m){tt.textContent=m;tt.className='on';clearTimeout(ttT);ttT=setTimeout(function(){tt.className=''},2600)}
var mb=document.getElementById('mode');
function tiltActive(){return modePref==='tilt'&&sensorOn&&gotSensor}
function tiltHint(){return modePref==='tilt'&&(gotSensor||(needPerm&&!denied))}
function updMode(){mb.textContent=tiltHint()?'📱 کج‌کردن':'👆 لمس'}
mb.addEventListener('click',function(e){
  e.stopPropagation();
  modePref=modePref==='tilt'?'touch':'tilt';
  try{localStorage.setItem('sl-birdjump-mode',modePref)}catch(_){}
  if(modePref==='tilt'){ensureTilt(function(){
    if(!gotSensor)say('حسگر حرکت پیدا نشد؛ با لمس یا کلید جهت‌دار بازی کن');
    else{neutral=sensorVal;say('گوشی را به چپ و راست کج کن')}
    updMode()});
  }else say('انگشتت را به چپ و راست بکش');
  updMode();
});
mb.addEventListener('pointerdown',function(e){e.stopPropagation()});
updMode();

/* ---------- ابعاد ---------- */
function fit(){
  dpr=Math.min(devicePixelRatio||1,2);var w=innerWidth,h=innerHeight;
  sc=Math.min(w/W,h/560);ox=(w-W*sc)/2;H=h/sc;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,ox*dpr,0);
}
function rnd(a,b){return a+Math.random()*(b-a)}
function mkPlat(y,diff){
  var r=Math.random(),type='n';
  if(diff>0.1){if(r<.14+diff*.1)type='m';else if(r<.26+diff*.14)type='b'}
  var p={x:rnd(8,W-72),y:y,w:64,h:14,type:type,dx:rnd(.8,1.8)*(Math.random()<.5?-1:1),broken:false,fall:0,spring:false};
  if(type==='n'&&Math.random()<.07)p.spring=true;
  return p;
}
function reset(){
  fit();plats=[];score=0;topY=H-40;
  P={x:W/2-BW/2,y:H-120,vy:-11,vx:0,sq:0};tx=P.x;
  if(gotSensor)neutral=sensorVal;
  plats.push({x:W/2-40,y:H-60,w:80,h:14,type:'n',dx:0,broken:false,fall:0,spring:false});
  while(topY>-60){topY-=rnd(50,80);plats.push(mkPlat(topY,0))}
  clouds=[];for(var i=0;i<6;i++)clouds.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.6,1.4)});
  state='play';
  if(tiltActive())say('گوشی را به چپ و راست کج کن');
}
function diff(){return Math.min(1,score/6000)}

function update(dt){
  at+=dt/60;
  if(state!=='play')return;
  // کنترل
  if(tiltActive()){
    var d=sensorVal-neutral;
    if(d>180)d-=360;if(d<-180)d+=360;
    var dead=2,m=Math.max(0,Math.abs(d)-dead),k=Math.min(1,m/20);
    tiltAmt=(d<0?-1:1)*Math.pow(k,1.15);
    var target=tiltAmt*8.2;
    P.vx+=(target-P.vx)*Math.min(1,.3*dt);
  }else{
    tiltAmt=0;
    if(keys.ArrowLeft||keys.a)tx-=6*dt;
    if(keys.ArrowRight||keys.d)tx+=6*dt;
    P.vx=(tx-P.x)*.28;
  }
  P.x+=P.vx*Math.min(1,dt);
  if(P.x<-BW/2){P.x+=W;tx+=W}
  if(P.x>W-BW/2){P.x-=W;tx-=W}
  P.vy+=.42*dt;P.y+=P.vy*dt;P.sq=Math.max(0,P.sq-dt*.05);
  // برخورد
  if(P.vy>0){
    for(var i=0;i<plats.length;i++){var p=plats[i];if(p.broken)continue;
      var feet=P.y+BH,prev=feet-P.vy*dt;
      if(prev<=p.y+4&&feet>=p.y&&P.x+BW*.78>p.x&&P.x+BW*.22<p.x+p.w){
        if(p.type==='b'){p.broken=true;tone(200,80,.2,'square',.1);continue}
        P.vy=p.spring?-19:-11.2;P.sq=1;P.y=p.y-BH;tone(p.spring?500:340,p.spring?1000:560,.12,'triangle',.18);break}
    }
  }
  // دوربین
  var lim=H*.42;
  if(P.y<lim){var s=lim-P.y;P.y=lim;score+=s;plats.forEach(function(p){p.y+=s});topY+=s;clouds.forEach(function(c){c.y+=s*.3;if(c.y>H+40){c.y=-40;c.x=rnd(0,W)}})}
  plats.forEach(function(p){if(p.type==='m'){p.x+=p.dx*dt;if(p.x<4||p.x+p.w>W-4)p.dx=-p.dx}if(p.broken){p.fall+=dt*8;p.y+=p.fall*dt}});
  plats=plats.filter(function(p){return p.y<H+60});
  while(topY>-60){var g=Math.min(135,rnd(48,70)+diff()*70);topY-=g;plats.push(mkPlat(topY,diff()))}
  if(P.y>H+40){
    state='over';t0=performance.now();var sc2=Math.floor(score/10);
    if(sc2>best){best=sc2;try{localStorage.setItem('sl-birdjump-best',String(best))}catch(e){}}
    tone(400,60,.7,'sawtooth',.25);
  }
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function bird(bx,by,vy,vx,sq){ // bx: مرکز افقی ، by: پای پرنده
  var up=vy<0,amp=up?30:8,rot=Math.max(-.35,Math.min(.35,vx*.04));
  var sy=1+sq*.14*(up?1:0),sx=1-sq*.1;
  drawHappy(bx,by-FEET*sy,at,amp,rot,sx,sy);
}
function draw(){
  var bx=-ox/sc-2,bw=W+2*ox/sc+4;
  var g=ctx.createLinearGradient(0,0,0,H);var k=Math.min(1,score/9000);g.addColorStop(0,k>.5?'#1a237e':'#4fc3f7');g.addColorStop(1,'#e1f5fe');ctx.fillStyle=g;ctx.fillRect(bx,0,bw,H);
  // خطوط دفتر
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;var off=(score*.5)%32;for(var y=-32+off;y<H;y+=32){ctx.beginPath();ctx.moveTo(bx,y);ctx.lineTo(bx+bw,y);ctx.stroke()}
  clouds.forEach(function(c){ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(c.x,c.y,18*c.s,0,7);ctx.arc(c.x+16*c.s,c.y+4,14*c.s,0,7);ctx.arc(c.x-16*c.s,c.y+5,13*c.s,0,7);ctx.fill()});
  // سکوها
  plats&&plats.forEach(function(p){
    var col=p.type==='m'?'#42a5f5':p.type==='b'?'#a1887f':'#66bb6a',dk=p.type==='m'?'#1565c0':p.type==='b'?'#5d4037':'#2e7d32';
    ctx.globalAlpha=p.broken?Math.max(0,1-p.fall/20):1;
    ctx.fillStyle=dk;rr(p.x,p.y+3,p.w,p.h,7);ctx.fillStyle=col;rr(p.x,p.y,p.w,p.h-2,7);
    if(p.type==='b'){ctx.strokeStyle=dk;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+18,p.y);ctx.lineTo(p.x+26,p.y+10);ctx.moveTo(p.x+42,p.y);ctx.lineTo(p.x+36,p.y+10);ctx.stroke()}
    if(p.spring){ctx.strokeStyle='#e53935';ctx.lineWidth=3;ctx.beginPath();var sx=p.x+p.w/2;ctx.moveTo(sx-8,p.y);ctx.lineTo(sx+8,p.y-4);ctx.lineTo(sx-8,p.y-8);ctx.lineTo(sx+8,p.y-12);ctx.stroke();ctx.fillStyle='#e53935';ctx.fillRect(sx-9,p.y-15,18,4)}
    ctx.globalAlpha=1});
  // پرنده (اگر از لبه رد شد، نسخه‌ی آن‌طرف هم کشیده می‌شود)
  if(P){
    bird(P.x+BW/2,P.y+BH,P.vy,P.vx,P.sq);
    if(P.x<0)bird(P.x+BW/2+W,P.y+BH,P.vy,P.vx,P.sq);
    if(P.x+BW>W)bird(P.x+BW/2-W,P.y+BH,P.vy,P.vx,P.sq);
  }
  // امتیاز
  ctx.fillStyle='#1a237e';ctx.font='bold 26px Tahoma,sans-serif';ctx.textAlign='left';ctx.fillText(Math.floor(score/10),56,34);
  ctx.font='13px Tahoma,sans-serif';ctx.fillText('بهترین: '+best,56,54);
  // نشانگر کج‌شدن
  if(state==='play'&&tiltActive()){
    var cx=W/2,cy=H-18;ctx.fillStyle='rgba(0,0,0,.18)';rr(cx-60,cy-3,120,6,3);
    ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(cx+tiltAmt*57,cy,7,0,7);ctx.fill();
  }
  if(state==='menu'||state==='over'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(bx,H/2-120,bw,236);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 32px Tahoma,sans-serif';
    ctx.fillText(state==='menu'?'پرنده‌ی جهنده':'افتادی!',W/2,H/2-66);ctx.font='19px Tahoma,sans-serif';
    if(state==='over')ctx.fillText('امتیاز: '+Math.floor(score/10)+' · بهترین: '+best,W/2,H/2-20);
    else if(tiltHint()){ctx.fillText('گوشی را به چپ و راست کج کن',W/2,H/2-20);ctx.fillText('پرنده خودش می‌پرد؛ روی سکوها فرود بیا!',W/2,H/2+8)}
    else{ctx.fillText('انگشتت را به چپ و راست بکش',W/2,H/2-20);ctx.fillText('پرنده خودش می‌پرد؛ روی سکوها فرود بیا!',W/2,H/2+8)}
    ctx.fillStyle='#ffeb3b';ctx.font='bold 21px Tahoma,sans-serif';ctx.fillText('برای شروع لمس کن',W/2,H/2+70);
    drawHappy(W/2,H/2-175+Math.sin(at*5)*5,at,20,0,1.15,1.15);
  }
}
var last=0;
function loop(ts){var dt=Math.min(2.2,(ts-last)/16.667||1);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function pt(e){tx=(e.clientX-ox)/sc-BW/2}
function tryStart(){
  if(state==='menu'||(state==='over'&&performance.now()-t0>600)){A();ensureTilt(function(){reset()})}
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();A();pt(e)});
cv.addEventListener('click',tryStart);
cv.addEventListener('pointermove',function(e){if(state==='play'&&(e.buttons||e.pointerType==='mouse'))pt(e)});
addEventListener('keydown',function(e){keys[e.key]=true;if(state!=='play'&&(e.key===' '||e.key==='Enter')){e.preventDefault();tryStart()}});
addEventListener('keyup',function(e){keys[e.key]=false});
addEventListener('resize',fit);
fit();P=null;plats=[];clouds=[];for(var i=0;i<6;i++)clouds.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.6,1.4)});
window.__bj={st:function(){return state},plats:function(){return plats},P:function(){return P},setTx:function(v){tx=v},score:function(){return score},tilt:function(v){gotSensor=true;sensorOn=true;sensorVal=v},mode:function(){return tiltActive()}};
requestAnimationFrame(loop);
})();
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

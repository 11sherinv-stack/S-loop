<script>

const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
/* ---------- بلوک‌ها ---------- */

const BL={1:['چمن',[96,168,58],.9,'s',0,2],2:['خاک',[139,92,52],.75,'s',0,2],3:['سنگ',[132,132,134],7,'p',1,16],4:['چوب',[110,76,40],3,'a',0,4],5:['برگ',[56,140,46],.3,'',0,5],6:['تخته',[190,142,76],3,'a',0,6],7:['آجر',[170,72,60],8,'p',1,7],8:['شن',[226,210,140],.75,'s',0,8],9:['آب',[40,110,200],0,'',0,0],10:['شیشه',[200,230,240],.45,'',0,0],11:['زغال‌سنگ',[70,70,72],7,'p',1,'coal'],12:['سنگ آهن',[190,150,120],12,'p',2,12],13:['سنگ طلا',[235,200,60],12,'p',3,13],14:['الماس',[90,220,230],14,'p',3,'diamond'],15:['برف',[240,245,250],.3,'s',0,15],16:['سنگ‌فرش',[110,110,112],7,'p',1,16],17:['پشم',[210,60,60],1.2,'',0,17],18:['سنگ پایه',[40,40,44],1e9,'',9,0]};

const SPEED=[1,2,4,6,8];
const ITEMN={stick:'چوب‌دستی',coal:'زغال',diamond:'الماس',meat:'گوشت خام',cooked:'گوشت پخته',iron:'شمش آهن',gold:'شمش طلا'};
/* ---------- نویز و ساخت دنیا ---------- */
function h2(a,b,s){let h=Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(s,1442695041);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(a,b,s){const ai=Math.floor(a),bi=Math.floor(b),af=a-ai,bf=b-bi,u=af*af*(3-2*af),v=bf*bf*(3-2*bf);const p=h2(ai,bi,s),q=h2(ai+1,bi,s),r=h2(ai,bi+1,s),t=h2(ai+1,bi+1,s);return p+(q-p)*u+(r-p)*v+(p-q-r+t)*u*v}
function fbm(a,b,s){return vn(a,b,s)*.55+vn(a*2,b*2,s+1)*.28+vn(a*4,b*4,s+2)*.17}
function h3(a,b,c,s){return h2(a+Math.imul(c,7919),b,s)}
function vn3(a,b,c,s){const ai=Math.floor(a),bi=Math.floor(b),ci=Math.floor(c),af=a-ai,bf=b-bi,cf=c-ci;let v=0;for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++){v+=h3(ai+i,bi+j,ci+k,s)*(i?af:1-af)*(j?bf:1-bf)*(k?cf:1-cf)}return v}
const idx=(a,b,c)=>(b*SZ+c)*SX+a;
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
let hmap=new Int16Array(SX*SZ),seed=7;
function genWorld(){
  world.fill(0);const R=rng(seed*31+5);
  for(let z=0;z<SZ;z++)for(let xx=0;xx<SX;xx++){
    const e=Math.min(xx,SX-1-xx,z,SZ-1-z);let hh=6+fbm(xx*.03,z*.03,seed)*30;
    hh+=(fbm(xx*.08,z*.08,seed+9)-.5)*4;
    if(e<12)hh-=(12-e)*1.6;
    hh=Math.max(3,Math.min(SY-6,Math.floor(hh)));hmap[z*SX+xx]=hh;
    const snow=hh>=27;
    for(let y=0;y<hh;y++){
      let b=3;
      if(y===hh-1)b=snow?15:(hh<=SEA+1?8:1);else if(y>=hh-3)b=(hh<=SEA+1)?8:2;
      world[idx(xx,y,z)]=b;
    }
    for(let y=hh;y<=SEA;y++)world[idx(xx,y,z)]=9;
    world[idx(xx,0,z)]=18;
  }
  for(let z=1;z<SZ-1;z++)for(let xx=1;xx<SX-1;xx++){const hh=hmap[z*SX+xx];
    for(let y=2;y<hh-3;y++){
      if(vn3(xx*.075,y*.11,z*.075,seed+3)>.74){world[idx(xx,y,z)]=0;continue}
      if(world[idx(xx,y,z)]!==3)continue;const r=R();
      if(r<.02)world[idx(xx,y,z)]=11;else if(y<20&&r<.032)world[idx(xx,y,z)]=12;else if(y<11&&r<.0386)world[idx(xx,y,z)]=13;else if(y<8&&r<.0415)world[idx(xx,y,z)]=14;
    }}
  for(let t=0;t<260;t++){
    const tx=4+Math.floor(R()*(SX-8)),tz=4+Math.floor(R()*(SZ-8)),h=hmap[tz*SX+tx];
    if(world[idx(tx,h-1,tz)]!==1)continue;
    const th=4+Math.floor(R()*2);for(let y=h;y<h+th;y++)world[idx(tx,y,tz)]=4;
    for(let dy=th-2;dy<=th+1;dy++){const r=dy>=th?1:2;for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dz)>r+1)continue;const a=tx+dx,c=tz+dz,yy=h+dy;if(yy<SY&&!world[idx(a,yy,c)])world[idx(a,yy,c)]=5}}
  }
}
function get(a,b,c){if(a<0||a>=SX||c<0||c>=SZ||b<0)return 18;if(b>=SY)return 0;return world[idx(a,b,c)]}
const solidAt=(a,b,c)=>{const v=get(a,b,c);return v!==0&&v!==9};
/* ---------- بازیکن و حالت ---------- */
let px=0,py=0,pz=0,vx=0,vy=0,vz=0,yaw=0,pitch=-.15,ground=false,fly=false,hp=20,air=10,fallY=0,hurtT=0,creative=false,tm=.12,hurtCool=0;
let inv={},tools={p:0,a:0,s:0,w:0},sel=0,mods={};
const keys={},joy={x:0,y:0};let jumpHeld=false,downHeld=false,breakHeld=false;
function spawnPoint(){let bx=SX>>1,bz=SZ>>1,bd=1e9;for(let z=10;z<SZ-10;z++)for(let xx=10;xx<SX-10;xx++){const h=hmap[z*SX+xx];if(h>SEA+1&&h<24&&world[idx(xx,h-1,z)]===1){const d=Math.hypot(xx-SX/2,z-SZ/2);if(d<bd){bd=d;bx=xx;bz=z}}}return[bx+.5,hmap[bz*SX+bx]+.01,bz+.5]}
function spawn(){[px,py,pz]=spawnPoint();vx=vy=vz=0;fallY=py}
function boxHits(a,b,c,hw=.3,hh=1.8){
  for(let i=Math.floor(a-hw);i<=Math.floor(a+hw-1e-6);i++)for(let j=Math.floor(b);j<=Math.floor(b+hh-1e-6);j++)for(let k=Math.floor(c-hw);k<=Math.floor(c+hw-1e-6);k++)if(solidAt(i,j,k))return true;
  return false;
}
const inWater=(a,b,c)=>get(Math.floor(a),Math.floor(b),Math.floor(c))===9;
function physics(dt){
  const fx=Math.sin(yaw),fz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let f=-joy.y+(keys.w?1:0)-(keys.s?1:0),s=joy.x+(keys.d?1:0)-(keys.a?1:0);const L=Math.hypot(f,s);if(L>1){f/=L;s/=L}

  px=Math.max(.4,Math.min(SX-.4,px));pz=Math.max(.4,Math.min(SZ-.4,pz));

function damage(d){if(creative||d<=0)return;hp-=d;hurtT=.4;$('dmg').style.opacity=.9;setTimeout(()=>$('dmg').style.opacity=0,200);beep(110,.15,'sawtooth',.08);if(hp<=0){hp=20;air=10;spawn();say('مردی! دوباره در نقطه‌ی شروع هستی')}}
/* ---------- پرتو ---------- */
let H_x,H_y,H_z,H_f,H_t,H_s,W_sum=0;
function ray(ox,oy,oz,dx,dy,dz,maxT,tint){
  let a=Math.floor(ox),b=Math.floor(oy),c=Math.floor(oz);
  const sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1;
  const tdx=dx!==0?Math.abs(1/dx):1e30,tdy=dy!==0?Math.abs(1/dy):1e30,tdz=dz!==0?Math.abs(1/dz):1e30;

  let inW=false,w0=0;W_sum=0;

  for(let n=0;n<100;n++){
    let f,t;
    if(tmx<tmy&&tmx<tmz){a+=sx;t=tmx;tmx+=tdx;f=0}else if(tmy<tmz){b+=sy;t=tmy;tmy+=tdy;f=1}else{c+=sz;t=tmz;tmz+=tdz;f=2}
    if(t>maxT){if(inW)W_sum+=maxT-w0;return 0}
    if(a<0||a>=SX||c<0||c>=SZ||b<0||b>=SY){if(inW)W_sum+=t-w0;return 0}
    const bl=world[(b*SZ+c)*SX+a];
    if(bl===9){if(tint&&!inW){inW=true;w0=t}continue}
    if(bl===0){if(inW){W_sum+=t-w0;inW=false}continue}
    if(inW){W_sum+=t-w0;inW=false}

function hit3(a,b,c){let h=(Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(c,1013904223))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)&255}
let RW,RH,asp,img,buf,depth;
function fit(){asp=innerWidth/innerHeight;RH=Math.round(Math.sqrt(15500/asp));RW=Math.round(RH*asp);cv.width=RW;cv.height=RH;img=x.createImageData(RW,RH);buf=new Uint32Array(img.data.buffer);depth=new Float32Array(RW*RH)}
let tcx=-1,tcy=-1,tcz=-1,dayL=1;
const COL=[0,0,0];
function shade(bl,fa_,hx,hy,hz,t){
  let u,v;if(fa_===0){u=hz;v=hy}else if(fa_===1){u=hx;v=hz}else{u=hx;v=hy}
  u-=Math.floor(u);v-=Math.floor(v);const tu=(u*8)|0,tv=(v*8)|0;
  const c=BL[bl][1];let r=c[0],g=c[1],b=c[2];
  const nz=hit3(H_x*8+tu,H_y*8+tv,H_z*8+fa_);let m=.92+(nz&15)/100;
  const top=fa_===1&&H_s<0;

  else if(bl===6){if(tv===0||tv===4)m*=.78}
  else if(bl===7){const off=((tv>>2)&1)?4:0;if((tv&3)===3||((tu+off)&7)===0)m*=.72}
  else if(bl===4){if(fa_===1){const dxr=u-.5,dzr=v-.5,rr=Math.sqrt(dxr*dxr+dzr*dzr);m*=(((rr*10)|0)&1)?.9:1.05;r=170;g=130;b=76}else m*=(tu&1)?.85:1}
  else if(bl===5){m=.7+(nz&63)/110}
  else if(bl>=11&&bl<=14){if((nz&7)>=2){r=132;g=132;b=134;m=.84+(nz&31)/100}else m=1.15}
  else if(bl===10){m=(tu===0||tu===7||tv===0||tv===7)?1.05:.8}
  const fsh=fa_===1?(H_s<0?1:.55):fa_===0?.82:.68;m*=fsh*(.3+.7*dayL);

<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bowling</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1a1226;color:#fff;font-family:Tahoma,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center}
a.back{align-self:flex-start;color:#ffd84a;text-decoration:none;padding:5px 12px;font-size:14px}
#sb{display:flex;direction:ltr;gap:2px;width:min(100vw,430px);padding:0 4px}
.fm{flex:1;background:#2c2140;border:1px solid #5a4880;border-radius:4px;font-size:10px;text-align:center;min-width:0}
.fm.cur{border-color:#ffd84a;background:#3d2d5c}
.fm .m{display:flex;justify-content:center;gap:2px;height:16px;line-height:16px;font-size:11px}
.fm .m span{min-width:11px;border-left:1px solid #5a4880}
.fm .s{height:16px;line-height:16px;font-weight:700;font-size:12px;color:#ffd84a}
#wrap{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:360/520;touch-action:none}
#ctl{width:min(100vw,430px);padding:4px 10px 8px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end;font-size:11px;direction:ltr}
#ctl label{display:flex;flex-direction:column;gap:2px;text-align:center}
#ctl input{width:100%}
#roll{height:46px;padding:0 16px;border-radius:12px;border:0;background:#e8423a;color:#fff;font-weight:800;font-size:15px}
#top2{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:430px}#onl{margin:0 10px;padding:5px 12px;border:1px solid #ffd84a;border-radius:14px;background:transparent;color:#ffd84a;font-size:12px}#st{width:min(100vw,430px);text-align:center;font-size:12px;min-height:16px;color:#ffd84a}.nm{font-size:10px;text-align:left;direction:ltr;padding:0 6px;opacity:.8}
#msg{position:absolute;inset:0;margin:auto;height:fit-content;width:84%;text-align:center;background:#000c;padding:16px;border-radius:12px;font-size:17px;line-height:1.8;display:none}
#msg button{margin-top:8px;padding:10px 24px;border:0;border-radius:10px;background:#ffd84a;font-weight:800;font-size:15px}
</style></head><body>
<div id="top2"><a class="back" href="index.html">← S loop</a><button id="onl">🌐 Online 1v1</button></div>
<div id="st"></div><div id="sb"></div>
<div id="wrap"><canvas id="c" width="360" height="520"></canvas><div id="msg"></div></div>
<div id="ctl"><label>Position<input type="range" id="pos" min="0" max="100" value="50"></label><label>Angle<input type="range" id="ang" min="-100" max="100" value="0"></label><label>Hook<input type="range" id="spin" min="-100" max="100" value="0"></label><button id="roll">ROLL 🎳</button></div>
<script src="slnet.js"></script>
<script>
if(self!==top){const b=document.querySelector('.back');if(b)b.style.display='none'}
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
const LX0=70,LX1=290,FOUL=455,BR=12.5;
const Q=new URLSearchParams(location.search),ROOM=Q.get('room'),HOST=Q.get('host')==='1';let ON=false,orolls=[],iAgain=0,oAgain=0,lastSay='';
let rolls=[],fr=0,bi=0,pins=[],ball=null,state='aim',settle=0,banner='',bannerT=0,best=+localStorage.bowlBest||0,fl=null,t=0,prev=10;
let ac;function beep(f,d,v){try{ac=ac||new AudioContext();const o=ac.createOscillator(),k=ac.createGain();o.type='triangle';o.frequency.value=f;k.gain.value=v||.05;o.connect(k);k.connect(ac.destination);o.start();k.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function newPins(){pins=[];let k=0;for(let r=0;r<4;r++)for(let i=0;i<=r;i++)pins.push({x:180+(i-r/2)*28,y:95+r*24,vx:0,vy:0,r:6.5,m:1,down:0,dt:0,id:k++,ang:0})}
function calc(R){const f=[];let i=0,tot=0;
 for(let n=0;n<10;n++){const a=R[i];if(a===undefined)break;
  if(n<9){if(a===10){const b=R[i+1],c=R[i+2];f.push({m:['X'],s:(b!==undefined&&c!==undefined)?(tot+=10+b+c):null});i++}
   else{const b=R[i+1];if(b===undefined){f.push({m:[a],s:null});break}if(a+b===10){const c=R[i+2];f.push({m:[a,'/'],s:c!==undefined?(tot+=10+c):null})}else f.push({m:[a,b],s:(tot+=a+b)});i+=2}}
  else{const b=R[i+1],c=R[i+2],m=[a===10?'X':a];
   if(b!==undefined)m.push(a===10?(b===10?'X':b):(a+b===10?'/':b));
   if(c!==undefined)m.push(a===10?(b===10?(c===10?'X':c):(b+c===10?'/':c)):(c===10?'X':c));
   const need=(a===10||(b!==undefined&&a+b===10))?3:2,have=[a,b,c].filter(v=>v!==undefined).length;
   f.push({m,s:have>=need?(tot+=a+(b||0)+(c||0)):null})}}
 return{f,tot}}
function rowHTML(R,cur){const{f}=calc(R);let h='';
 for(let n=0;n<10;n++){const x=f[n],c=n===cur;
  h+='<div class="fm'+(c?' cur':'')+'"><div class="m">'+(x?x.m.map(v=>'<span>'+(v===0?'-':v)+'</span>').join(''):'<span>&nbsp;</span>')+'</div><div class="s">'+(x&&x.s!==null?x.s:'&nbsp;')+'</div></div>'}return h}
function renderSB(){const{tot}=calc(rolls);let h=rowHTML(rolls,state==='over'?-1:fr);
 if(ON){const myT=total2(rolls),opT=total2(orolls);$('sb').style.flexWrap='wrap';
  h='<div class="nm" style="width:100%">'+esc(SLNet.name)+' — '+myT+'</div>'+h+'<div class="nm" style="width:100%">'+esc(SLNet.peerName||'…')+' — '+opT+'</div>'+rowHTML(orolls,-1)}
 $('sb').innerHTML=h;return tot}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function total2(R){const{f}=calc(R);let t2=0;f.forEach(x=>{if(x.s!==null)t2=x.s});return t2}
function framesDone(R){let i=0,d=0;for(let n=0;n<9;n++){const a=R[i];if(a===undefined)return d;if(a===10){d++;i++}else if(R[i+1]!==undefined){d++;i+=2}else return d}
 const a=R[i],b=R[i+1],c=R[i+2];if(a===undefined)return d;const need=(a===10||(b!==undefined&&a+b===10))?3:2,have=[a,b,c].filter(v=>v!==undefined).length;return have>=need?10:d}
function total(){const{f}=calc(rolls);let t2=0;f.forEach(x=>{if(x.s!==null)t2=x.s});return t2}
function reset(){rolls=[];orolls=[];iAgain=0;oAgain=0;fr=0;bi=0;newPins();ball=null;state='aim';$('msg').style.display='none';renderSB()}
function say(s){banner=s;bannerT=80}
function afterRoll(n){rolls.push(n);const first=bi===0;
 if(fr<9){if(first&&n===10){say('STRIKE!');fr++;bi=0;newPins()}else if(first)bi=1;else{if(!pins.length)say('SPARE!');fr++;bi=0;newPins()}}
 else{if(bi===0){if(n===10){say('STRIKE!');newPins()}bi=1}
  else if(bi===1){const a=rolls[rolls.length-2];if(a===10){if(n===10)newPins();bi=2}else if(a+n===10){say('SPARE!');newPins();bi=2}else bi=3}
  else bi=3}
 prev=pins.length;if(ON)SLNet.send({k:'r',n});const tot=renderSB();
 if(ON&&fr===9&&bi===3){state='over';checkEnd();return}
 if(fr===9&&bi===3){state='over';const sc=total();best=Math.max(best,sc);localStorage.bowlBest=best;
  $('msg').innerHTML='پایان بازی 🎳<br>امتیاز: <b>'+sc+'</b> • رکورد: '+best+'<br><button id="again">Play again</button>';$('msg').style.display='block';$('again').onclick=reset}
 else state='aim';status()}
function myTurn(){if(!ON)return true;if(!SLNet.peer||SLNet.state!=='online')return false;const dm=framesDone(rolls),dop=framesDone(orolls);if(dm>=10)return false;return HOST?dm===dop:dop>dm}
function status(){if(!ON)return;const e=$('st');if(SLNet.state!=='online'){e.textContent='⚠ قطع شدی — در حال اتصال دوباره…';return}if(!SLNet.peer){e.textContent='منتظر حریف…';return}
 if(SLNet.alive()>15000){e.textContent='⚠ ارتباط با '+SLNet.peerName+' قطع شده';return}
 e.textContent=state==='over'?'':myTurn()?'🟢 نوبت توست':'⏳ نوبت '+SLNet.peerName;$('roll').style.opacity=myTurn()?1:.45}
function checkEnd(){renderSB();if(framesDone(rolls)<10||framesDone(orolls)<10){$('st').textContent='⏳ منتظر پایان بازی '+SLNet.peerName;return}
 const a=total2(rolls),b=total2(orolls),w=a>b?'🏆 تو بردی!':a<b?'😔 '+SLNet.peerName+' برد':'🤝 مساوی';best=Math.max(best,a);localStorage.bowlBest=best;
 $('msg').innerHTML=w+'<br>'+a+' — '+b+'<br><button id="again">Rematch</button>';$('msg').style.display='block';$('again').onclick=()=>{iAgain=1;SLNet.send({k:'again'});$('again').textContent='منتظر حریف…';if(oAgain)rematch()}}
function rematch(){reset();status()}
function onMsg(o){if(o.k==='r'){orolls.push(o.n);const f=calc(orolls).f,last=orolls.length;if(o.n===10&&(f.length&&f[f.length-1].m[0]==='X'))say(SLNet.peerName+': STRIKE!');renderSB();if(state==='over')checkEnd();status()}
 else if(o.k==='again'){oAgain=1;if(iAgain)rematch();else if($('again'))$('again').textContent='Rematch (حریف آماده است)'}}
function launch(ang,spd){if(state!=='aim'||!myTurn())return;const x=95+$('pos').value/100*170;ball={x,y:440,vx:Math.sin(ang)*spd,vy:-Math.cos(ang)*spd,r:BR,m:5.5,spin:+$('spin').value/100,gut:0,rot:0};state='roll';prev=pins.length;beep(160,.25,.06)}
function col(a,b,e){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=a.r+b.r;if(d>=mn||d===0)return 0;const nx=dx/d,ny=dy/d,ov=mn-d,tm=a.m+b.m;
 a.x-=nx*ov*b.m/tm;a.y-=ny*ov*b.m/tm;b.x+=nx*ov*a.m/tm;b.y+=ny*ov*a.m/tm;
 const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const j=-(1+e)*vn/(1/a.m+1/b.m);a.vx-=j*nx/a.m;a.vy-=j*ny/a.m;b.vx+=j*nx/b.m;b.vy+=j*ny/b.m;return -vn}return 0}
function step(){t++;
 if(state==='roll'&&ball){const b=ball;if(!b.gut&&b.y<430)b.vx+=b.spin*.014;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vy*.05;
  if(!b.gut&&(b.x<LX0+4||b.x>LX1-4)){b.gut=1;b.vx=0;b.x=b.x<180?57:303}
  if(b.gut){b.x=b.x<180?57:303}
  if(!b.gut)for(const p of pins){if(p.down>0&&p.dt>0&&0)continue;const imp=col(b,p,.55);if(imp>0){if(imp>.6&&!p.down){p.down=1;p.dt=0}beep(300+Math.random()*300,.06,.04)}}
  if(b.y<42||Math.hypot(b.vx,b.vy)<.6){ball=null;state='settle';settle=0}}
 for(const p of pins){p.x+=p.vx;p.y+=p.vy;p.vx*=.972;p.vy*=.972;p.ang+=Math.hypot(p.vx,p.vy)*.15;if(p.down)p.dt++;
  if(p.y<40){p.y=40;p.vy=Math.abs(p.vy)*.3;p.down=1}
  if(p.x<LX0+6||p.x>LX1-6){p.down=1;p.vx*=.8}}
 for(let i=0;i<pins.length;i++)for(let j=i+1;j<pins.length;j++){const a=pins[i],b=pins[j];const imp=col(a,b,.75);if(imp>.8){a.down=a.down||1;b.down=b.down||1}}
 if(state==='settle'){settle++;const mv=pins.some(p=>Math.hypot(p.vx,p.vy)>.18);
  if((!mv&&settle>20)||settle>260){pins.forEach(p=>{if(p.x<LX0+2||p.x>LX1-2||p.y<=40.5)p.down=1});
   const n=prev-pins.filter(p=>!p.down).length;pins=pins.filter(p=>!p.down);pins.forEach(p=>{p.vx=p.vy=0});afterRoll(n)}}
 if(bannerT>0)bannerT--}
function draw(){
 g.fillStyle='#120b1c';g.fillRect(0,0,360,520);
 // گاتر و خط
 g.fillStyle='#0b0713';g.fillRect(44,40,26,440);g.fillRect(290,40,26,440);g.fillStyle='#2a2036';g.fillRect(48,40,18,440);g.fillRect(294,40,18,440);
 const gr=g.createLinearGradient(LX0,0,LX1,0);gr.addColorStop(0,'#c98d4c');gr.addColorStop(.5,'#e3ae6a');gr.addColorStop(1,'#c98d4c');g.fillStyle=gr;g.fillRect(LX0,40,LX1-LX0,440);
 g.strokeStyle='#0002';g.lineWidth=1;for(let x=LX0+22;x<LX1;x+=22){g.beginPath();g.moveTo(x,40);g.lineTo(x,480);g.stroke()}
 g.fillStyle='#0003';for(let i=-3;i<=3;i++){const x=180+i*28,y=330-Math.abs(i)*12;g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+14);g.lineTo(x+5,y+14);g.fill()}
 g.fillStyle='#3a2a1a';g.fillRect(LX0,FOUL,LX1-LX0,4);g.fillStyle='#0b0713';g.fillRect(40,12,280,30);
 g.fillStyle='#fff3';g.font='11px sans-serif';g.textAlign='center';g.fillText('PIT',180,31);
 // پین‌ها
 for(const p of pins){g.save();g.translate(p.x,p.y);
  if(p.down){g.globalAlpha=Math.max(.35,1-p.dt/70);g.rotate(Math.atan2(p.vy,p.vx)||p.ang);g.fillStyle='#f6f6f6';g.beginPath();g.ellipse(0,0,10,5,0,0,7);g.fill();g.fillStyle='#d33';g.fillRect(-1,-5,3,10)}
  else{const rg=g.createRadialGradient(-2,-2,1,0,0,8);rg.addColorStop(0,'#fff');rg.addColorStop(1,'#cfcfcf');g.fillStyle=rg;g.beginPath();g.arc(0,0,p.r,0,7);g.fill();g.strokeStyle='#d33';g.lineWidth=2;g.beginPath();g.arc(0,0,3.6,0,7);g.stroke()}
  g.restore()}
 // خط هدف
 if(state==='aim'){const x=95+$('pos').value/100*170,a=$('ang').value/100*.26;g.strokeStyle='#fff7';g.setLineDash([5,5]);g.beginPath();g.moveTo(x,440);g.lineTo(x+Math.sin(a)*330,440-Math.cos(a)*330);g.stroke();g.setLineDash([]);drawBall(x,440,0)}
 if(ball)drawBall(ball.x,ball.y,ball.rot);
 if(fl&&state==='aim'){g.strokeStyle='#ffd84a';g.lineWidth=3;g.beginPath();g.moveTo(fl.x0,fl.y0);g.lineTo(fl.x1,fl.y1);g.stroke()}
 if(bannerT>0){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,200,360,70);g.fillStyle='#ffd84a';g.font='bold '+(34+(80-bannerT<8?(8-(80-bannerT)):0))+'px sans-serif';g.textAlign='center';g.fillText(banner,180,248)}
 g.fillStyle='#fff9';g.font='12px sans-serif';g.textAlign='left';g.fillText(state==='aim'?(bi===0?'Ball 1':'Ball '+(bi+1)):'',8,500)}
function drawBall(x,y,rot){const rg=g.createRadialGradient(x-4,y-4,2,x,y,BR);rg.addColorStop(0,'#6fa0ff');rg.addColorStop(.5,'#1d3fae');rg.addColorStop(1,'#0b1850');g.fillStyle=rg;g.beginPath();g.arc(x,y,BR,0,7);g.fill();
 g.fillStyle='#050b2a';for(const [a,r] of [[0,5],[.5,7],[-.5,7]]){g.beginPath();g.arc(x+Math.cos(rot+a-1.2)*r,y+Math.sin(rot+a-1.2)*r,1.8,0,7);g.fill()}}
$('roll').onclick=()=>launch($('ang').value/100*.26,9);
addEventListener('keydown',e=>{const p=$('pos');if(e.key==='ArrowLeft'){p.value=+p.value-4}if(e.key==='ArrowRight'){p.value=+p.value+4}if(e.key===' '||e.key==='Enter'){e.preventDefault();$('roll').click()}});
cv.addEventListener('pointerdown',e=>{if(state!=='aim')return;const r=cv.getBoundingClientRect();fl={x0:(e.clientX-r.left)*360/r.width,y0:(e.clientY-r.top)*520/r.height,t0:performance.now()};fl.x1=fl.x0;fl.y1=fl.y0});
cv.addEventListener('pointermove',e=>{if(!fl)return;const r=cv.getBoundingClientRect();fl.x1=(e.clientX-r.left)*360/r.width;fl.y1=(e.clientY-r.top)*520/r.height});
addEventListener('pointerup',()=>{if(!fl)return;const dx=fl.x1-fl.x0,dy=fl.y1-fl.y0,dt=Math.max(40,performance.now()-fl.t0);fl=null;
 if(dy<-30){const ang=Math.max(-.3,Math.min(.3,Math.atan2(dx,-dy)));const sp=Math.max(6,Math.min(11.5,Math.hypot(dx,dy)/dt*14));launch(ang,sp)}});
$('onl').onclick=()=>SLNet.menu('bowling.html','Bowling');
if(ROOM&&/^[A-HJ-NP-Z2-9]{6}$/.test(ROOM)){ON=true;$('onl').style.display='none';reset();
 SLNet.open(ROOM,{host:HOST,state:()=>status(),peer:n=>{SLNet.hide();$('st').textContent='';$('onl').style.display='none';reset();say(n+' وارد شد!');status()},msg:onMsg});SLNet.wait('bowling.html','Bowling');setInterval(status,1000)}
reset();(function loop(){step();draw();requestAnimationFrame(loop)})();
</script></body></html>

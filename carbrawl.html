<div class="pad" id="pr2" style="display:none"><button id="b2l" aria-label="چپ ۲">◀</button><button id="b2r" aria-label="راست ۲">▶</button></div>
<div class="pad" id="pl"><button id="bl" aria-label="چپ">◀</button><button id="br" aria-label="راست">▶</button></div>
<div class="ov" id="ov"><h2 id="oh">🚗 Car Brawl</h2><p id="op">با ماشینت به ماشین حریف بکوب!<br>ضربه‌ی محکم به سر راننده یا فرسودن بدنه‌ی ماشین، حریف را از بازی بیرون می‌کند. اگر ماشینت وارونه ماند هم می‌بازی.<br>◀ ▶ حرکت (در هوا: چرخاندن ماشین) · اول به ۳ برد، برنده است.<br><small>رایانه — بازیکن ۱: A / D · بازیکن ۲ (حالت دو نفره): کلیدهای جهت‌دار</small></p><div class="row" id="mm"><button data-m="1" class="sel">👤 تک‌نفره</button><button data-m="2">👥 دو نفره</button></div><div class="maps" id="maps"></div><button id="ob">شروع</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const GV=(m=>m?Math.min(1,+m[1]/100):.8)(location.hash.match(/v(\d+)/));
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let au;function beep(f,d=.06,ty='square',v=.05){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state==='suspended')au.resume();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*GV;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const GRAV=1300,I=2600,DRIVE=330,MAXV=560,WALL0=30,WALL1=1970;
const MAPS=[
 {n:'دشت',p:[[0,430],[800,430],[950,380],[1050,380],[1200,430],[2000,430]]},
 {n:'رمپ‌ها',p:[[0,430],[250,430],[420,350],[560,350],[640,430],[1360,430],[1440,350],[1580,350],[1750,430],[2000,430]]},
 {n:'موج‌ها',p:[[0,420],[300,440],[600,400],[900,440],[1100,440],[1400,400],[1700,440],[2000,420]]},
 {n:'دره',p:[[0,380],[500,380],[700,470],[1000,520],[1300,470],[1500,380],[2000,380]]},
 {n:'تپه‌ی بزرگ',p:[[0,450],[500,450],[850,300],[1150,300],[1500,450],[2000,450]]},
 {n:'کوهستان',p:[[0,430],[250,340],[450,420],[700,300],[900,400],[1100,400],[1300,300],[1550,420],[1750,340],[2000,430]]},
 {n:'پله‌ها',p:[[0,470],[350,470],[400,420],[700,420],[750,370],[1000,370],[1250,370],[1300,420],[1600,420],[1650,470],[2000,470]]},
 {n:'حوضچه',p:[[0,360],[300,360],[500,470],[1500,470],[1700,360],[2000,360]]}
];
const ARENAS=MAPS.map(m=>m.p);
let mode=1,mapSel=-1;
const WR=[{lx:-30,ly:14,r:13,t:'w'},{lx:30,ly:14,r:13,t:'w'},{lx:-36,ly:0,r:9,t:'c'},{lx:-18,ly:-2,r:9,t:'c'},{lx:0,ly:-4,r:9,t:'c'},{lx:18,ly:-2,r:9,t:'c'},{lx:36,ly:0,r:9,t:'c'},{lx:-4,ly:-14,r:9,t:'c'},{lx:-2,ly:-27,r:8,t:'h'}];
let G,cars,round=0,sc=[0,0],state='menu',tm=0,msg='',msgT=0,koT=0,parts=[],shake=0;
const btn={l:false,r:false},btn2={l:false,r:false};
function mk(x0,col,human,dir){return{x:x0,y:350,a:0,vx:0,vy:0,w:0,hp:100,ko:false,col,human,dir,wr:0,gr:0,upT:0,input:0,stuck:0,aiT:0,mode:'ram',why:''}}
function newRound(){
  const mi=mapSel>=0?mapSel:Math.floor(Math.random()*MAPS.length);G=MAPS[mi].p;
  cars=[mk(520,'#1e88e5',true,1),mk(1480,'#e53935',mode===2,-1)];
  cars.forEach(c=>{c.y=groundAt(c.x).y-75});
  koT=0;parts=[];state='fight';
  msg='دور '+fa(round+1)+' · '+MAPS[mi].n;msgT=1.8;
}
function groundAt(px){for(let i=0;i<G.length-1;i++){const a=G[i],b=G[i+1];if(px>=a[0]&&px<=b[0]){const s=(b[1]-a[1])/(b[0]-a[0]),l=Math.hypot(s,1);return{y:a[1]+s*(px-a[0]),nx:s/l,ny:-1/l,a}}}return{y:G[G.length-1][1],nx:0,ny:-1,a:G[0]}}
function cp(c,k){const q=WR[k],ca=Math.cos(c.a),sa=Math.sin(c.a);return[c.x+q.lx*ca-q.ly*sa,c.y+q.lx*sa+q.ly*ca]}
const cross=(ax,ay,bx,by)=>ax*by-ay*bx;
function imp(c,rx,ry,jx,jy){c.vx+=jx;c.vy+=jy;c.w+=cross(rx,ry,jx,jy)/I}
function ko(c,why){if(c.ko)return;c.ko=true;c.why=why;shake=12;beep(100,.5,'sawtooth',.12);for(let i=0;i<16;i++)parts.push({x:c.x,y:c.y-20,vx:(Math.random()-.5)*400,vy:-Math.random()*400,l:.8,c:['#ffd54f','#ff8a3d','#fff'][i%3]})}
function stepCar(c,dt){
  c.gr=0;
  const dirIn=c.input;
  for(let k=0;k<WR.length;k++){
    const q=WR[k],[px,py]=cp(c,k),rx=px-c.x,ry=py-c.y;
    // زمین
    const g=groundAt(px);let nx=g.nx,ny=g.ny;
    let sd=(px-g.a[0])*nx+(py-g.a[1])*ny;
    if(sd<q.r){
      const pen=q.r-sd;c.x+=nx*pen*.8;c.y+=ny*pen*.8;
      const prx=px-nx*q.r-c.x,pry=py-ny*q.r-c.y;
      const vx=c.vx-c.w*pry,vy=c.vy+c.w*prx,vn=vx*nx+vy*ny;
      if(vn<0){
        const e=q.t==='w'?.15:.2,den=1+Math.pow(cross(prx,pry,nx,ny),2)/I,j=-(1+e)*vn/den;
        imp(c,prx,pry,j*nx,j*ny);
        if(q.t==='h'&&j>170&&!c.ko)ko(c,'سر');
        else if(q.t!=='w'&&j>260)c.hp-=(j-200)*.05;
        // اصطکاک
        const tx=-ny,ty=nx,vt=vx*tx+vy*ty,mu=q.t==='w'?.02:.7,den2=1+Math.pow(cross(prx,pry,tx,ty),2)/I;
        let jt=-vt/den2;const lim=mu*j;jt=Math.max(-lim,Math.min(lim,jt));imp(c,prx,pry,jt*tx,jt*ty);
      }
      if(q.t==='w'){
        c.gr++;
        if(!c.ko&&dirIn!==0&&(Math.abs(c.vx)<MAXV||Math.sign(c.vx)!==dirIn)){const tx=-ny,ty=nx;imp(c,prx,pry,tx*DRIVE*dt*dirIn,ty*DRIVE*dt*dirIn)}
        if(dirIn===0)c.vx*=1-.6*dt;
      }
    }
  }
  // دیوار
  const W0=WALL0,W1=WALL1;
  if(c.x<W0){c.x=W0;if(c.vx<0)c.vx*=-.3}if(c.x>W1){c.x=W1;if(c.vx>0)c.vx*=-.3}
  // هوا
  if(c.gr===0){c.w+=dirIn*9*dt}
  else c.w*=1-2.2*dt;
  c.w=Math.max(-9,Math.min(9,c.w));c.w*=1-.15*dt;
  c.vy+=GRAV*dt;c.vx*=1-.02*dt;
  c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.w*dt;
  if(c.a>Math.PI)c.a-=2*Math.PI;if(c.a<-Math.PI)c.a+=2*Math.PI;
  c.wr+=c.vx*dt/13;
  // وارونه ماندن
  if(Math.cos(c.a)<-.2&&c.gr===0&&Math.hypot(c.vx,c.vy)<120){c.upT+=dt;if(c.upT>2.2&&!c.ko)ko(c,'وارونه')}else c.upT=Math.max(0,c.upT-dt);
  if(c.hp<=0&&!c.ko)ko(c,'بدنه');
  if(c.y>900){ko(c,'سقوط')}
}
function carVsCar(A,B){
  for(let i=0;i<WR.length;i++)for(let k=0;k<WR.length;k++){
    const qa=WR[i],qb=WR[k],[ax,ay]=cp(A,i),[bx,by]=cp(B,k);let dx=bx-ax,dy=by-ay;const d=Math.hypot(dx,dy),rs=qa.r+qb.r;
    if(d<rs&&d>1e-6){
      const nx=dx/d,ny=dy/d,pen=rs-d;A.x-=nx*pen*.5;A.y-=ny*pen*.5;B.x+=nx*pen*.5;B.y+=ny*pen*.5;
      const cxp=ax+nx*qa.r,cyp=ay+ny*qa.r,rax=cxp-A.x,ray=cyp-A.y,rbx=cxp-B.x,rby=cyp-B.y;
      const vax=A.vx-A.w*ray,vay=A.vy+A.w*rax,vbx=B.vx-B.w*rby,vby=B.vy+B.w*rbx,vn=(vbx-vax)*nx+(vby-vay)*ny;
      if(vn<0){
        const den=2+Math.pow(cross(rax,ray,nx,ny),2)/I+Math.pow(cross(rbx,rby,nx,ny),2)/I,j=-(1.35)*vn/den;
        imp(A,rax,ray,-j*nx,-j*ny);imp(B,rbx,rby,j*nx,j*ny);
        if(j>40)beep(120+Math.min(300,j),.06,'square',.06);
        shake=Math.max(shake,Math.min(8,j/40));
        const hit=(car,q,jj)=>{if(q.t==='h'&&jj>150&&!car.ko)ko(car,'ضربه به سر');else if(q.t!=='w')car.hp-=jj*.06};
        hit(A,qa,j);hit(B,qb,j);
      }
    }
  }
}
function ai(c,o,dt){
  if(c.ko){c.input=0;return}
  const dx=o.x-c.x,dir=Math.sign(dx)||1;
  if(c.gr===0){c.input=Math.abs(c.a)>.15?-Math.sign(c.a):0;return}
  if(Math.cos(c.a)<.25){c.input=Math.sin(tm*3)>0?1:-1;return}
  c.aiT-=dt;if(c.aiT<=0){c.aiT=.7+Math.random()*1.2;c.mode=Math.random()<.22?'back':'ram'}
  c.input=c.mode==='back'?-dir:dir;
  if(Math.abs(c.vx)<25)c.stuck+=dt;else c.stuck=0;if(c.stuck>1){c.input=-c.input;if(c.stuck>1.8)c.stuck=0}
}
const keys={};
function update(dt){
  tm+=dt;if(state!=='fight')return;
  const sub=6,d=dt/sub;
  for(let s=0;s<sub;s++){
    const[a,b]=cars;
    a.input=a.ko?0:((btn.r||keys.d||(mode===1&&keys.ArrowRight))?1:0)-((btn.l||keys.a||(mode===1&&keys.ArrowLeft))?1:0);
    if(mode===2)b.input=b.ko?0:((btn2.r||keys.ArrowRight)?1:0)-((btn2.l||keys.ArrowLeft)?1:0);else ai(b,a,d);
    stepCar(a,d);stepCar(b,d);
    carVsCar(a,b);
  }
  parts.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt});parts=parts.filter(p=>p.l>0);
  shake=Math.max(0,shake-30*dt);msgT=Math.max(0,msgT-dt);
  const[a,b]=cars;
  if((a.ko||b.ko)&&koT===0){koT=1;msg=(a.ko&&b.ko)?'مساوی!':mode===2?((b.ko?'آبی':'قرمز')+' برد! ('+(b.ko?b.why:a.why)+')'):b.ko?'ضربه‌ی فنی! ('+b.why+')':'باختی ('+a.why+')';msgT=2;if(!(a.ko&&b.ko)){if(b.ko)sc[0]++;else sc[1]++}}
  if(koT>0){koT+=dt;if(koT>2.6)endRound()}
}
function endRound(){
  if(sc[0]>=3||sc[1]>=3){state='over';show(mode===2?(sc[0]>=3?'🏆 آبی برنده شد!':'🏆 قرمز برنده شد!'):(sc[0]>=3?'🏆 برنده شدی!':'باختی'),fa(sc[0])+' — '+fa(sc[1]),'دوباره');return}
  round++;newRound();
}
function show(h,p,b){$('oh').textContent=h;$('op').innerHTML=p;$('ob').textContent=b;$('mm').style.display='flex';$('maps').style.display='flex';$('ov').style.display='flex'}
function drawCar(c){
  x.save();x.translate(c.x,c.y);x.rotate(c.a);if(c.dir<0)x.scale(-1,1);if(c.ko)x.globalAlpha=.8;
  const col=c.col;
  // بدنه
  x.fillStyle=col;x.beginPath();x.roundRect?x.roundRect(-42,-9,84,26,8):x.rect(-42,-9,84,26);x.fill();
  x.fillStyle='rgba(0,0,0,.25)';x.fillRect(-42,8,84,6);
  x.fillStyle=col;x.beginPath();x.moveTo(-26,-9);x.lineTo(-16,-24);x.lineTo(14,-24);x.lineTo(26,-9);x.closePath();x.fill();
  x.fillStyle='#bfe6ff';x.beginPath();x.moveTo(-20,-10);x.lineTo(-13,-21);x.lineTo(11,-21);x.lineTo(19,-10);x.closePath();x.fill();
  x.fillStyle='#ffe082';x.fillRect(36,-4,6,6);x.fillStyle='#ff5252';x.fillRect(-42,-4,5,6);
  // راننده
  x.fillStyle=c.ko?'#ccc':'#f6c28b';x.beginPath();x.arc(-2,-27,8,0,7);x.fill();x.fillStyle='#222';if(c.ko){x.font='bold 9px Tahoma';x.textAlign='center';x.fillText('✕ ✕',-2,-25)}else{x.fillRect(1,-30,2,3);x.fillRect(-5,-30,2,3)}
  // چرخ‌ها
  [-30,30].forEach(lx=>{x.save();x.translate(lx,14);x.fillStyle='#222';x.beginPath();x.arc(0,0,13,0,7);x.fill();x.rotate(c.wr*(c.dir<0?-1:1));x.fillStyle='#aaa';x.beginPath();x.arc(0,0,6,0,7);x.fill();x.fillStyle='#555';x.fillRect(-1,-6,2,12);x.restore()});
  x.restore();
}
function draw(){
  const W=innerWidth,H=innerHeight;x.setTransform(1,0,0,1,0,0);
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5aa9ec');g.addColorStop(1,'#d8efff');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(!cars)return;
  const[a,b]=cars,mx=(a.x+b.x)/2,dx=Math.abs(a.x-b.x);
  const z=Math.max(.38,Math.min(1.1,W/(dx+380)));
  const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
  const my=Math.max(280,Math.min(560,(a.y+b.y)/2+40));x.setTransform(z,0,0,z,W/2-mx*z+sx,H*.6-my*z+sy);
  // پس‌زمینه کوه
  x.fillStyle='rgba(90,130,170,.35)';for(let i=0;i<9;i++){const bx=i*260-100;x.beginPath();x.moveTo(bx,430);x.lineTo(bx+130,250+(i%3)*30);x.lineTo(bx+260,430);x.fill()}
  // زمین
  x.fillStyle='#6b8f3a';x.beginPath();x.moveTo(G[0][0]-600,1400);G.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(G[G.length-1][0]+600,G[G.length-1][1]);x.lineTo(G[G.length-1][0]+600,1400);x.closePath();x.fill();
  x.strokeStyle='#8bb552';x.lineWidth=6;x.beginPath();G.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
  // دیوارها
  x.fillStyle='#8d6e63';x.fillRect(WALL0-24,60,24,700);x.fillRect(WALL1,60,24,700);
  cars.forEach(drawCar);
  parts.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)});
  x.setTransform(1,0,0,1,0,0);
  // HUD
  x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,0,W,38);x.font='bold 15px Tahoma,sans-serif';x.textBaseline='middle';x.fillStyle='#fff';x.textAlign='center';x.fillText(fa(sc[0])+'  —  '+fa(sc[1]),W/2,19);
  const bar=(xx,hp,col,al)=>{x.fillStyle='rgba(255,255,255,.25)';x.fillRect(xx,12,Math.min(150,W*.3),12);x.fillStyle=col;x.fillRect(xx,12,Math.min(150,W*.3)*Math.max(0,hp)/100,12)};
  bar(100,a.hp,'#42a5f5');bar(W-100-Math.min(150,W*.3),b.hp,'#ef5350');
  if(msgT>0){x.globalAlpha=Math.min(1,msgT);x.textAlign='center';x.font='bold 26px Tahoma,sans-serif';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.strokeText(msg,W/2,H*.3);x.fillText(msg,W/2,H*.3);x.globalAlpha=1}
}
function hold(id,k){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();btn[k]=true;b.classList.add('dn');try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{btn[k]=false;b.classList.remove('dn')}))}
hold('bl','l');hold('br','r');
function hold2(id,k){const b=$(id);b.classList.add('p2');b.addEventListener('pointerdown',e=>{e.preventDefault();btn2[k]=true;b.classList.add('dn');try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{btn2[k]=false;b.classList.remove('dn')}))}
hold2('b2l','l');hold2('b2r','r');
function mapUI(){const box=$('maps');box.innerHTML='';
  const mk=(label,i)=>{const b=document.createElement('button');b.dataset.i=i;if(i===mapSel)b.className='sel';
    if(i>=0){const c=document.createElement('canvas');c.width=84;c.height=40;const g=c.getContext('2d');g.fillStyle='#6b8f3a';g.beginPath();g.moveTo(0,40);MAPS[i].p.forEach(q=>g.lineTo(q[0]/2000*84,(q[1]-250)/330*40));g.lineTo(84,40);g.fill();b.appendChild(c)}
    else{const d=document.createElement('div');d.style.cssText='width:84px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.4rem';d.textContent='🎲';b.appendChild(d)}
    const l=document.createElement('div');l.textContent=label;b.appendChild(l);b.onclick=()=>{mapSel=i;mapUI()};box.appendChild(b)};
  mk('تصادفی',-1);MAPS.forEach((m,i)=>mk(m.n,i))}
$('mm').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;[...$('mm').children].forEach(c=>c.classList.toggle('sel',c===b));$('pr2').style.display=mode===2?'flex':'none'};
mapUI();
addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true});addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
$('ob').onclick=()=>{$('ov').style.display='none';$('mm').style.display='none';$('maps').style.display='none';round=0;sc=[0,0];newRound()};

<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>

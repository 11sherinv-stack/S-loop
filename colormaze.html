<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Color Maze</title>
<style>body{margin:0;background:#16202a;color:#fff;font:15px system-ui;text-align:center;touch-action:none}canvas{background:#0e151c;border-radius:12px;max-width:96vw}button,a{background:#2d6a9f;color:#fff;border:0;border-radius:10px;padding:9px 14px;margin:3px;text-decoration:none;display:inline-block;font:inherit}</style>
<p><a href="index.html" onclick="if(parent!==window){parent.postMessage('sl-close','*');return false}">← S loop</a> <b>Color Maze</b> <span id=inf></span></p>
<p>کلید رنگی را بردار تا در همان رنگ باز شود؛ به ⭐ برس</p>
<canvas id=c width=340 height=340></canvas>
<p><button onclick=mv(0)>▲</button></p><p><button onclick=mv(3)>◀</button><button onclick=mv(2)>▼</button><button onclick=mv(1)>▶</button></p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),D=[[0,-1],[1,0],[0,1],[-1,0]],K=['#e74c3c','#3498db','#2ecc71'];
let lv=1,n,o,p,ex,dr,ky,hv,st;
const nb=(i,d)=>i+D[d][0]+D[d][1]*n;
function bfs(a,bl){const pv={[a]:-1},q=[a];for(let h=0;h<q.length;h++)for(let d=0;d<4;d++){const i=q[h];if(!o[i][d])continue;const j=nb(i,d);if(j in pv||bl.includes(j))continue;pv[j]=i;q.push(j)}return{pv,q}}
function gen(){n=5+lv;o=Array.from({length:n*n},()=>[0,0,0,0]);const s=new Set([0]),t=[0];
while(t.length){const i=t[t.length-1],X=i%n,Y=i/n|0,f=[0,1,2,3].filter(d=>{const a=X+D[d][0],b=Y+D[d][1];return a>=0&&b>=0&&a<n&&b<n&&!s.has(b*n+a)});if(!f.length){t.pop();continue}const d=f[Math.random()*f.length|0],j=nb(i,d);o[i][d]=1;o[j][(d+2)%4]=1;s.add(j);t.push(j)}
const{pv,q}=bfs(0,[]);ex=q[q.length-1];const pa=[];for(let i=ex;i>0;i=pv[i])pa.unshift(i);
const k=Math.min(3,Math.ceil(lv/2));dr=[];for(let j=0;j<k;j++)dr.push(pa[Math.max(1,Math.min(pa.length-2,Math.floor(pa.length*(j+1)/(k+1))))]);
ky=[];dr.forEach((_,j)=>{const r=bfs(0,dr.slice(j)).q.filter(i=>i&&!dr.includes(i)&&!ky.includes(i)&&i!=ex);const f=r.slice(-Math.ceil(r.length/3));ky.push(f[Math.random()*f.length|0])});
p=0;hv=[];st=0;draw()}
function mv(d){if(!o[p][d])return;const j=nb(p,d),di=dr.indexOf(j);if(di>=0&&!hv.includes(di))return;p=j;st++;const ki=ky.indexOf(j);if(ki>=0&&!hv.includes(ki))hv.push(ki);draw();if(j==ex){lv++;setTimeout(gen,400)}}
function draw(){const s=340/n,cc=i=>[i%n*s+s/2,(i/n|0)*s+s/2];x.clearRect(0,0,340,340);x.strokeStyle='#8fb4d6';x.lineWidth=3;x.lineCap='round';x.beginPath();
for(let i=0;i<n*n;i++){const X=i%n*s,Y=(i/n|0)*s;if(!o[i][0]){x.moveTo(X,Y);x.lineTo(X+s,Y)}if(!o[i][3]){x.moveTo(X,Y);x.lineTo(X,Y+s)}if(i%n==n-1){x.moveTo(X+s,Y);x.lineTo(X+s,Y+s)}if(i>=n*n-n){x.moveTo(X,Y+s);x.lineTo(X+s,Y+s)}}x.stroke();
x.textAlign='center';x.textBaseline='middle';x.font=s*.6+'px serif';let[a,b]=cc(ex);x.fillText('⭐',a,b);
dr.forEach((i,j)=>{[a,b]=cc(i);x.globalAlpha=hv.includes(j)?.2:1;x.fillStyle=K[j];x.fillRect(a-s*.38,b-s*.38,s*.76,s*.76)});x.globalAlpha=1;
ky.forEach((i,j)=>{if(hv.includes(j))return;[a,b]=cc(i);x.fillStyle=K[j];x.beginPath();x.arc(a,b,s*.3,0,7);x.fill();x.fillText('🔑',a,b)});
[a,b]=cc(p);x.fillStyle='#fff';x.beginPath();x.arc(a,b,s*.25,0,7);x.fill();inf.textContent='Level '+lv+' · Moves '+st}
let sx,sy;c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};c.onpointerup=e=>{const a=e.clientX-sx,b=e.clientY-sy;if(Math.max(Math.abs(a),Math.abs(b))<20)return;mv(Math.abs(a)>Math.abs(b)?(a>0?1:3):(b>0?2:0))};
addEventListener('keydown',e=>{const d=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key);if(d>=0){e.preventDefault();mv(d)}});
gen();
</script>

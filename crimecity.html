const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=470,$=i=>document.getElementById(i);
const NB=22,BLK=214,RW=64,WORLD=NB*BLK+RW,DIR=[[1,0],[0,1],[-1,0],[0,-1]],TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.random()*n|0,hash=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};

const VT={civ:{n:'Sedan',w:17,l:36,mx:125,acc:1.4,hp:100,tr:2.4},sport:{n:'Sports Car',w:17,l:36,mx:330,acc:1.9,hp:130,tr:2.8,cost:2500},taxi:{n:'Taxi',w:17,l:36,mx:145,acc:1.5,hp:110,tr:2.5},truck:{n:'Truck',w:22,l:52,mx:150,acc:1,hp:260,tr:1.6,mass:3,cost:1500},bus:{n:'Bus',w:24,l:68,mx:110,acc:.9,hp:320,tr:1.3,mass:3.5},moto:{n:'Motorbike',w:9,l:26,mx:300,acc:2.4,hp:55,tr:3.6,mass:.5,cost:800},cop:{n:'Police Car',w:17,l:36,mx:290,acc:1.8,hp:160,tr:2.6},swat:{n:'SWAT Van',w:22,l:48,mx:230,acc:1.4,hp:340,tr:2,mass:3},tank:{n:'Tank',w:30,l:58,mx:90,acc:1,hp:900,tr:1.1,mass:9,gun:1},heli:{n:'Helicopter',w:22,l:50,mx:290,acc:1.6,hp:220,tr:3,fly:1,cost:9000}};
const rad_=q=>q.fly?0:q.k==='moto'?8:q.k==='tank'?25:q.k==='bus'?22:q.k==='truck'||q.k==='swat'?19:15;
function migrate(s){const base={cash:300,own:[1,0,1,0,0,0,0,0,0,0],ammo:[0,0,60,0,0,0,0,0,0,0],kills:0,missions:0,zones:[0,0,0],up:{engine:0,armor:0,nitro:0},rob:-9999,kz:[0,0,0],thefts:0};if(!s)return base;if(s.own&&s.own.length===4){const o=base.own.slice(),a=base.ammo.slice();o[0]=s.own[0];o[2]=s.own[1];o[4]=s.own[2];o[5]=s.own[3];a[2]=s.ammo[1];a[4]=s.ammo[2];a[5]=s.ammo[3];s.own=o;s.ammo=a}return Object.assign(base,s)}
let S;try{S=migrate(JSON.parse(localStorage.getItem('cc-save')))}catch(e){S=migrate(null)}
const ZONES=[{b:[2,6,5,9],col:'#a855f7',n:'Violet Kings'},{b:[9,8,12,11],col:'#f97316',n:'Orange Cartel'},{b:[15,6,18,9],col:'#ef4444',n:'Red Wolves'}];
let P,peds,cars,cops,bul,pick,expl,decals,parts,mis,mk,heat,unseen,gt,shk,dead,deadT,msg,msgT,rad=0,keys={},joy=null,aim=null,fireOn,brake,nitOn,au,fireCd,rain=0,rainT,flash=0,eng=null,paused=false,mapPos=0,tw=0;
function snd(f,d,ty='square',v=.05,sl){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(sl,au.currentTime+d);g.gain.value=v;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
function engine(on,sp){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(on&&!eng){const o=au.createOscillator(),g=au.createGain();o.type='sawtooth';g.gain.value=.012;o.connect(g);g.connect(au.destination);o.start();eng={o,g}}if(!on&&eng){eng.o.stop();eng=null}if(eng)eng.o.frequency.value=45+Math.min(300,Math.abs(sp))*.5}catch(e){}}
function say(t,d=2.6){msg=t;msgT=d}
const zrect=z=>({x0:z.b[0]*BLK+RW,y0:z.b[1]*BLK+RW,x1:z.b[2]*BLK+RW+150,y1:z.b[3]*BLK+RW+150});
const zoneAt=(px,py)=>ZONES.findIndex(z=>{const r=zrect(z);return px>r.x0&&px<r.x1&&py>r.y0&&py<r.y1});
function init(){P={x:4*BLK+32,y:3*BLK+32,a:0,hp:100,ar:0,veh:null,w:S.own[2]?2:0,nit:1};peds=[];cars=[];cops=[];bul=[];pick=[];expl=[];decals=[];parts=[];mis=null;heat=0;unseen=0;gt=9*60;shk=0;dead=false;rainT=rnd(120,300);
  for(let i=0;i<30;i++)spawnCar();for(let i=0;i<34;i++)spawnPed(true);
  const sp=makeVeh(P.x+40,P.y,0,'sport');sp.ai='parked';cars.push(sp);
  const pad=makeVeh(18*BLK+RW+75,3*BLK+RW+75,0,'heli');pad.ai='parked';pad.fly=1;cars.push(pad);const tk=makeVeh(19*BLK+RW+75,18*BLK+RW+158,0,'tank');tk.ai='parked';cars.push(tk);
  newMarkers();for(let i=0;i<14;i++)pick.push(rpick())}
const rpick=()=>({x:rnd(100,WORLD-100),y:BLK*ri(NB+1)+32+rnd(-20,20),t:['hp','ar','ammo','ammo','cash'][ri(5)],v:ri(60)+20});
/* ---------- world ---------- */
function blockAt(px,py){const bx=Math.floor(px/BLK),by=Math.floor(py/BLK),lx=px-bx*BLK,ly=py-by*BLK;if(lx<RW||ly<RW)return null;return{i:bx,j:by,lx:lx-RW,ly:ly-RW,t:btype(bx,by)}}
const inBld=(px,py)=>{const b=blockAt(px,py);return b&&solidT(b.t)&&b.lx>14&&b.lx<136&&b.ly>14&&b.ly<136};
function pushOut(e,r){let hit=false;const bx=Math.floor(e.x/BLK),by=Math.floor(e.y/BLK);
  for(let i=bx-1;i<=bx+1;i++)for(let j=by-1;j<=by+1;j++){const t=btype(i,j);if(!solidT(t))continue;const x0=i*BLK+RW+14,y0=j*BLK+RW+14,x1=x0+122,y1=y0+122,cx=Math.max(x0,Math.min(e.x,x1)),cy=Math.max(y0,Math.min(e.y,y1)),dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);
    if(d<r){hit=true;if(d>.001){e.x+=dx/d*(r-d);e.y+=dy/d*(r-d)}else{const m=Math.min(e.x-x0,x1-e.x,e.y-y0,y1-e.y);if(m===e.x-x0)e.x=x0-r;else if(m===x1-e.x)e.x=x1+r;else if(m===e.y-y0)e.y=y0-r;else e.y=y1+r}}}
  e.x=Math.max(r,Math.min(WORLD-r,e.x));e.y=Math.max(r,Math.min(WORLD-r,e.y));return hit}
const laneOff=d=>[12,-12,-12,12][d];
const KCOL={taxi:'#facc15',cop:'#f1f5f9',swat:'#1f2937',bus:'#2563eb',tank:'#4d5d33',heli:'#374151'};
function makeVeh(px,py,d,k){const T=VT[k],cols=['#dc2626','#2563eb','#eab308','#16a34a','#9333ea','#f97316','#e5e7eb','#111827'];
  const hp=T.hp+(k!=='cop'&&k!=='swat'?0:0);return{x:px,y:py,a:d*Math.PI/2,v:0,vx:0,vy:0,d,k,hp,hpMax:hp,col:KCOL[k]||cols[ri(8)],ai:k==='cop'||k==='swat'?'cop':'traffic',mx:T.mx*(k==='civ'||k==='taxi'||k==='truck'||k==='bus'?rnd(.7,1):1),w:T.w,l:T.l,cd:0,fly:T.fly||0,ta:0,wreck:false,tt:0}}
function spawnCar(){const k=ri(100);const kind=k<58?'civ':k<70?'taxi':k<78?'truck':k<83?'bus':k<92?'moto':'sport';
  for(let t=0;t<30;t++){const d=ri(4),kk=ri(NB+1),rc=kk*BLK+32,al=rnd(60,WORLD-60);const px=d%2===0?al:rc+laneOff(d),py=d%2===0?rc+laneOff(d):al;
    const dist=P?Math.hypot(px-P.x,py-P.y):9999;if(P&&cars.length>8&&(dist<420||dist>1100))continue;if(cars.some(q=>Math.hypot(q.x-px,q.y-py)<70))continue;cars.push(makeVeh(px,py,d,kind));return}}
function spawnPed(any,gz){for(let t=0;t<40;t++){let px,py;if(gz!==undefined){const r=zrect(ZONES[gz]);px=rnd(r.x0,r.x1);py=rnd(r.y0,r.y1)}else{px=rnd(40,WORLD-40);py=rnd(40,WORLD-40)}
  const d=P?Math.hypot(px-P.x,py-P.y):9999;if(!any&&(d<300||d>850))continue;if(inBld(px,py))continue;
  const p={x:px,y:py,a:rnd(0,TAU),s:rnd(25,50),hp:30,col:'hsl('+ri(360)+',55%,50%)',fl:0,t:rnd(1,4),cd:rnd(0,1)};if(gz!==undefined){p.gz=gz;p.hostile=1;p.hp=55;p.col=ZONES[gz].col;p.wp=ri(2)}peds.push(p);return}}
function newMarkers(){mk=[];const types=['courier','hit','race','taxi','destroy','gangwar'];types.sort(()=>Math.random()-.5).slice(0,4).forEach(t=>{for(let k=0;k<40;k++){const i=ri(NB),j=ri(NB),b=btype(i,j);if(b==='bld'||b==='park'){mk.push({t,x:i*BLK+RW+75,y:j*BLK+RW+150-8});break}}})}
const MC={courier:'#facc15',hit:'#ef4444',race:'#22c55e',taxi:'#fde047',destroy:'#f97316',gangwar:'#a855f7'},MI={courier:'🚚',hit:'☠️',race:'🏁',taxi:'🚕',destroy:'💥',gangwar:'⚔️'};
/* ---------- draw ---------- */
const nightA=()=>{const h=(gt/60)%24;return(h>=21||h<5?.62:h>=19?.3:h>=5&&h<7?.28:0)+rain*.12};
function drawWorld(cx,cy,sc){const x0=Math.max(0,Math.floor((cx-W/2/sc)/BLK)-1),x1=Math.min(NB,Math.ceil((cx+W/2/sc)/BLK)),y0=Math.max(0,Math.floor((cy-H/2/sc)/BLK)-1),y1=Math.min(NB,Math.ceil((cy+H/2/sc)/BLK));
  x.fillStyle=rain?'#2f333a':'#3b3f46';x.fillRect(cx-W/sc,cy-H/sc,W*2/sc,H*2/sc);const night=nightA()>.3;
  for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){const t=btype(i,j),bx=i*BLK+RW,by=j*BLK+RW;if(t==='x')continue;
    x.fillStyle='#8a8d93';x.fillRect(bx,by,150,150);
    if(t==='park'){x.fillStyle='#3f8f4a';x.fillRect(bx+6,by+6,138,138);x.fillStyle='#2e6e38';for(let k=0;k<7;k++){x.beginPath();x.arc(bx+20+hash(i+k,j)*110,by+20+hash(j+k,i)*110,9+hash(k,i+j)*5,0,TAU);x.fill()}}
    else{const h=hash(i*3,j*5),col=SPC[t]||'hsl('+(h*40+190)+',12%,'+(32+h*22)+'%)';
      x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx+20,by+20,122,122);x.fillStyle=col;x.fillRect(bx+14,by+14,122,122);x.fillStyle='rgba(255,255,255,.12)';x.fillRect(bx+14,by+14,122,6);
      for(let a=0;a<4;a++)for(let b=0;b<4;b++){x.fillStyle=night&&hash(i*9+a,j*7+b)>.4?'#fde68a':'rgba(0,0,0,.28)';x.fillRect(bx+26+a*26,by+28+b*24,16,12)}
      if(t==='pad'){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(bx+75,by+75,34,0,TAU);x.stroke();x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('H',bx+75,by+88)}
      if(t!=='bld'&&t!=='pad'){x.font='34px serif';x.textAlign='center';x.fillStyle='#000';x.fillText(SPI[t],bx+75,by+85)}
      if(t!=='bld'){const mx=bx+75,my=by+144;x.fillStyle=night?'#ffeb3b':'#f59e0b';x.beginPath();x.arc(mx,my,10,0,TAU);x.fill();x.strokeStyle='#000';x.lineWidth=1;x.stroke()}}}
  ZONES.forEach((z,i)=>{const r=zrect(z);x.fillStyle=S.zones[i]?'rgba(34,197,94,.14)':z.col+'30';x.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0)});
  x.strokeStyle='#f5d142';x.lineWidth=2;x.setLineDash([14,14]);const a0=Math.max(0,Math.floor((cx-W/sc)/BLK)),a1=Math.min(NB,Math.ceil((cx+W/sc)/BLK)),b0=Math.max(0,Math.floor((cy-H/sc)/BLK)),b1=Math.min(NB,Math.ceil((cy+H/sc)/BLK));
  for(let k=b0;k<=b1;k++){const rc=k*BLK+32;x.beginPath();x.moveTo(cx-W/sc,rc);x.lineTo(cx+W/sc,rc);x.stroke()}for(let k=a0;k<=a1;k++){const rc=k*BLK+32;x.beginPath();x.moveTo(rc,cy-H/sc);x.lineTo(rc,cy+H/sc);x.stroke()}x.setLineDash([])}
function drawVeh(q){x.save();x.translate(q.x,q.y);const w=q.w,l=q.l;
  if(q.fly){x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(10,12,l*.45,w*.45,q.a,0,TAU);x.fill();x.rotate(q.a);x.fillStyle=q.wreck?'#222':q.col;x.beginPath();x.ellipse(0,0,l*.38,w*.4,0,0,TAU);x.fill();x.fillRect(-l*.7,-2,l*.4,4);x.fillStyle='#7dd3fc';x.beginPath();x.ellipse(l*.14,0,l*.14,w*.28,0,0,TAU);x.fill();
    if(!q.wreck){x.save();x.rotate(performance.now()/40);x.fillStyle='rgba(30,30,30,.7)';x.fillRect(-l*.62,-2,l*1.24,4);x.fillRect(-2,-l*.62,4,l*1.24);x.restore()}x.restore();return}
  x.rotate(q.a);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(-l/2+3,-w/2+3,l,w);
  if(q.wreck){x.fillStyle='#1f1f1f';x.fillRect(-l/2,-w/2,l,w);x.fillStyle='#f97316';x.globalAlpha=.55;x.beginPath();x.arc(0,0,8+Math.random()*4,0,TAU);x.fill();x.restore();return}
  if(q.k==='tank'){x.fillStyle='#2f3a20';x.fillRect(-l/2,-w/2,l,8);x.fillRect(-l/2,w/2-8,l,8);x.fillStyle=q.col;x.fillRect(-l/2+3,-w/2+5,l-6,w-10);x.save();x.rotate(q.ta-q.a);x.fillStyle='#55663a';x.beginPath();x.arc(0,0,11,0,TAU);x.fill();x.fillRect(0,-3,l*.62,6);x.restore()}
  else if(q.k==='moto'){x.fillStyle='#111';x.fillRect(-l/2,-2,l,4);x.fillStyle=q.col;x.fillRect(-4,-3,12,6);x.fillStyle='#1e293b';x.beginPath();x.arc(-1,0,5,0,TAU);x.fill();x.fillStyle='#f1c27d';x.beginPath();x.arc(1,0,3.5,0,TAU);x.fill()}
  else{x.fillStyle=q.col;x.beginPath();x.roundRect?x.roundRect(-l/2,-w/2,l,w,5):x.rect(-l/2,-w/2,l,w);x.fill();x.fillStyle='#0f172a';
    if(q.k==='bus'){for(let i=-3;i<=3;i++)x.fillRect(i*8-3,-w/2+2,6,w-4)}else if(q.k==='truck'){x.fillRect(l*.18,-w/2+2,l*.14,w-4);x.fillStyle='#78716c';x.fillRect(-l/2,-w/2+1,l*.62,w-2)}else{x.fillRect(l*.02,-w/2+2,l*.26,w-4);x.fillRect(-l*.34,-w/2+2,l*.12,w-4)}
    if(q.k==='cop'||q.k==='swat'){x.fillStyle='#111';x.fillRect(-l/2,-w/2+4,l*.35,w-8);const f=(performance.now()/150|0)%2;x.fillStyle=f?'#ef4444':'#3b82f6';x.fillRect(-4,-6,8,6);x.fillStyle=f?'#3b82f6':'#ef4444';x.fillRect(-4,1,8,6)}
    if(q.k==='taxi'){x.fillStyle='#111';x.fillRect(-3,-4,8,8)}
    x.fillStyle='#fde68a';x.fillRect(l/2-3,-w/2+1,3,4);x.fillRect(l/2-3,w/2-5,3,4);x.fillStyle='#b91c1c';x.fillRect(-l/2,-w/2+1,2,4);x.fillRect(-l/2,w/2-5,2,4)}
  x.restore();if(q.hp<q.hpMax*.35&&Math.random()<.4)parts.push({x:q.x,y:q.y,vx:rnd(-10,10),vy:rnd(-20,-5),l:1,c:q.hp<q.hpMax*.15?'rgba(255,120,0,.8)':'rgba(60,60,60,.6)',r:rnd(3,7)})}
function drawPed(p){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.beginPath();x.ellipse(0,0,5,7,0,0,TAU);x.fill();x.fillStyle='#f1c27d';x.beginPath();x.arc(1,0,4,0,TAU);x.fill();if(p.hostile){x.fillStyle='#111';x.fillRect(4,3,8,2)}x.restore()}
function drawPlayer(){x.save();x.translate(P.x,P.y);x.rotate(P.a);x.fillStyle='#1e293b';x.beginPath();x.ellipse(0,0,6,9,0,0,TAU);x.fill();x.fillStyle='#f1c27d';x.beginPath();x.arc(1,0,4.5,0,TAU);x.fill();x.fillStyle='#ef4444';x.fillRect(-3,-4,3,8);const wp=WP[P.w];if(!wp.mel){x.fillStyle='#111';x.fillRect(5,3,wp.rock?16:wp.n==='Sniper'?18:12,3)}else if(wp.n==='Bat'){x.fillStyle='#a16207';x.fillRect(4,3,16,3)}x.restore()}
/* ---------- logic ---------- */
const nearVeh=()=>{let b=null,bd=62;cars.forEach(q=>{if(q.wreck)return;const d=Math.hypot(q.x-P.x,q.y-P.y);if(d<bd){bd=d;b=q}});return b};

    if(pushOut(q,rad_(q))){q.v*=.4;q.a+=rnd(-.7,.7)}q.cd-=dt;if(stars()>=2&&d<240&&q.cd<=0){q.cd=q.k==='swat'?.45:.9;bul.push({o:'c',ty:'b',x:q.x,y:q.y,vx:Math.cos(ta+rnd(-.12,.12))*480,vy:Math.sin(ta+rnd(-.12,.12))*480,dmg:q.k==='swat'?7:5,life:.6})}return}
  const dd=DIR[q.d];let stop=false;cars.concat(P.veh?[]:[{x:P.x,y:P.y}]).forEach(o=>{if(!o||o===q||o.fly)return;const ox=o.x-q.x,oy=o.y-q.y,dist=Math.hypot(ox,oy);if(dist<54&&(ox*dd[0]+oy*dd[1])/(dist||1)>.7)stop=true});

  if(P.veh){const q=P.veh;x.textAlign='center';x.fillStyle='rgba(0,0,0,.45)';x.fillRect(W/2-70,H-26,140,18);x.fillStyle=q.hp<q.hpMax*.35?'#ef4444':'#fff';x.fillText(VT[q.k].n+' · '+Math.round(Math.abs(q.v)*.5)+' km/h · '+Math.max(0,Math.round(q.hp/q.hpMax*100))+'%',W/2,H-12);if(S.up.nitro>0){x.fillStyle='rgba(255,255,255,.2)';x.fillRect(W/2-40,H-34,80,5);x.fillStyle='#f59e0b';x.fillRect(W/2-40,H-34,80*P.nit,5)}}
  const zi=zoneAt(P.x,P.y);if(zi>=0){x.textAlign='center';x.fillStyle=S.zones[zi]?'#86efac':ZONES[zi].col;x.font='bold 11px system-ui';x.fillText(S.zones[zi]?'🏴 '+ZONES[zi].n+' (yours)':'⚠ '+ZONES[zi].n+' turf · '+S.kz[zi]+'/10',W/2,50)}
  if(mis){x.textAlign='center';x.fillStyle='rgba(0,0,0,.55)';x.fillRect(60,6,175,34);x.fillStyle='#fde047';x.font='11px system-ui';x.fillText(mis.txt.slice(0,36),147,20);x.fillText('⏱ '+Math.ceil(mis.tm)+'s'+(mis.t==='race'?' · CP '+mis.i+'/'+mis.cp.length:mis.t==='gangwar'?' · '+mis.k+'/'+mis.need:''),147,34)}
  if(msgT>0){x.textAlign='center';x.fillStyle='rgba(0,0,0,.65)';x.fillRect(20,H-70,320,26);x.fillStyle='#fff';x.font='13px system-ui';x.fillText(msg,W/2,H-52)}
  if(!P.veh&&!dead){const nm=nearVeh();let t='';if(mk.some(m=>Math.hypot(m.x-P.x,m.y-P.y)<26))t='🚪 Start mission';else{for(const s in SPECIAL){const[i,j]=s.split(',').map(Number);if(SPECIAL[s]!=='pad'&&SPECIAL[s]!=='army'&&Math.hypot(i*BLK+RW+75-P.x,j*BLK+RW+144-P.y)<28)t='🚪 Enter '+SPECIAL[s]}}if(!t&&nm)t='🚪 Enter '+VT[nm.k].n;if(t){x.textAlign='center';x.fillStyle='#fff';x.font='bold 13px system-ui';x.fillText(t,W/2,H/2+28)}}
  if(joy){x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.arc(joy.bx,joy.by,38,0,TAU);x.stroke();x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(joy.bx+joy.dx*30,joy.by+joy.dy*30,16,0,TAU);x.fill()}
  if(aim){x.strokeStyle='rgba(255,100,100,.4)';x.lineWidth=3;x.beginPath();x.arc(aim.bx,aim.by,34,0,TAU);x.stroke();x.fillStyle='rgba(255,100,100,.4)';x.beginPath();x.arc(aim.bx+aim.dx*28,aim.by+aim.dy*28,14,0,TAU);x.fill()}
  if(dead){x.fillStyle='rgba(120,0,0,'+Math.min(.7,deadT*.5)+')';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 40px system-ui';x.textAlign='center';x.fillText('WASTED',W/2,H/2)}}
/* ---------- pause menu ---------- */
function pauseMenu(tab='map'){paused=true;const o=$('ov');o.style.display='flex';
  const tabs='<div class=tabs>'+['map','stats','help'].map(t=>'<button class="'+(t===tab?'on':'')+'" data-t='+t+'>'+{map:'🗺 Map',stats:'📊 Stats',help:'❓ Help'}[t]+'</button>').join('')+'<button id=sv style="background:#15803d">💾 Save</button><button id=rs style="background:#7f1d1d">↺ Reset</button></div>';
  let body='';if(tab==='map')body='<canvas id=mc width=340 height=340 style="background:#10151d;border-radius:12px"></canvas>';
  else if(tab==='stats')body=[['💰 Cash','$'+S.cash],['☠️ Kills',S.kills],['✅ Missions',S.missions],['🚗 Vehicles stolen',S.thefts],['🏴 Turf owned',S.zones.filter(z=>z).length+'/3'],['⏱ Day',Math.floor(gt/1440)+1],['🔫 Weapons',S.own.filter(v=>v).length+'/10'],['⚙️ Upgrades','Engine '+S.up.engine+' · Armor '+S.up.armor+' · Nitro '+S.up.nitro]].map(r=>'<div class=row><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
  else body='<div class=row style="display:block;line-height:1.7">Left stick: move/drive · Right stick: aim &amp; fire<br>🔫 fire · 🚪 enter/exit/shops/missions · 🔁 next weapon · 🛑 brake<br>🔥 nitro (car, needs upgrade) / rocket (helicopter)<br>🚁 Helipad &amp; 🪖 Army base have a free helicopter and tank!<br>🏦 Bank = big cash, big heat · 🔧 Garage = vehicles &amp; upgrades<br>Capture gang turf: kill 10 members of a gang.</div>';
  o.innerHTML='<h3>Crime City</h3>'+tabs+'<div style="margin:8px 0">'+body+'</div><button id=cl style="background:#475569">▶ Resume</button>';
  o.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>pauseMenu(b.dataset.t));$('cl').onclick=closeOv;$('sv').onclick=()=>{localStorage.setItem('cc-save',JSON.stringify(S));say('Saved 💾',1.5)};$('rs').onclick=()=>{if(confirm('Delete all progress?')){localStorage.removeItem('cc-save');S=migrate(null);init();closeOv()}};
  if(tab==='map'){const m=$('mc').getContext('2d'),k=340/WORLD;m.fillStyle='#2b3342';for(let i=0;i<=NB;i++){m.fillRect(0,(i*BLK+32)*k-1.5,340,3);m.fillRect((i*BLK+32)*k-1.5,0,3,340)}
    ZONES.forEach((z,i)=>{const r=zrect(z);m.fillStyle=S.zones[i]?'rgba(34,197,94,.35)':z.col+'66';m.fillRect(r.x0*k,r.y0*k,(r.x1-r.x0)*k,(r.y1-r.y0)*k)});
    for(const s in SPECIAL){const[i,j]=s.split(',').map(Number);m.font='13px serif';m.textAlign='center';m.fillText(SPI[SPECIAL[s]],(i*BLK+RW+75)*k,(j*BLK+RW+75)*k+5)}
    mk.forEach(q=>{m.font='12px serif';m.fillText(MI[q.t],q.x*k,q.y*k+4)});if(mis){const g=mis.t==='courier'||mis.t==='taxi'&&mis.got?mis.goal:mis.t==='taxi'?mis.pick:mis.t==='race'?mis.cp[mis.i]:mis.t==='hit'?mis.target:mis.t==='destroy'?mis.car:null;if(g){m.strokeStyle='#fde047';m.lineWidth=2;m.beginPath();m.arc(g.x*k,g.y*k,7,0,TAU);m.stroke()}}
    m.fillStyle='#fff';m.beginPath();m.arc(P.x*k,P.y*k,5,0,TAU);m.fill();m.strokeStyle='#f00';m.stroke()}}
/* ---------- input ---------- */
function pos(e){const b=c.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
c.onpointerdown=e=>{if(paused)return;const[px,py]=pos(e);c.setPointerCapture(e.pointerId);if(px<W*.55&&!joy)joy={id:e.pointerId,bx:px,by:py,dx:0,dy:0};else if(px>=W*.55&&!aim)aim={id:e.pointerId,bx:px,by:py,dx:0,dy:0}};
c.onpointermove=e=>{const s=joy&&e.pointerId===joy.id?joy:aim&&e.pointerId===aim.id?aim:null;if(!s)return;const[px,py]=pos(e);let dx=px-s.bx,dy=py-s.by;const d=Math.hypot(dx,dy),R=s===joy?38:34;if(d>R){s.bx+=dx/d*(d-R);s.by+=dy/d*(d-R);dx=px-s.bx;dy=py-s.by}s.dx=dx/R;s.dy=dy/R};
c.onpointerup=c.onpointercancel=e=>{if(joy&&e.pointerId===joy.id)joy=null;if(aim&&e.pointerId===aim.id)aim=null};
const hold=(id,f)=>{const el=$(id);el.onpointerdown=e=>{e.preventDefault();f(1)};['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,()=>f(0)))};
hold('fire',v=>fireOn=v);hold('brk',v=>brake=v);hold('nit',v=>nitOn=v);$('act').onpointerdown=e=>{e.preventDefault();enterExit()};$('pse').onpointerdown=e=>{e.preventDefault();pauseMenu()};
function nextW(){let n=0;do{P.w=(P.w+1)%WP.length;n++}while((!S.own[P.w]||(WP[P.w].ammo&&S.ammo[P.w]<=0&&n<WP.length-1))&&n<30)}
$('wpn').onpointerdown=e=>{e.preventDefault();nextW();snd(500,.05)};
let radIv=0;$('rad').onpointerdown=e=>{e.preventDefault();rad=(rad+1)%4;$('rad').textContent=['📻','🎵1','🎵2','🎵3'][rad];clearInterval(radIv);if(rad){const sc=[[0,3,5,7,10,12],[0,2,4,7,9,12],[0,3,7,10,12,15]][rad-1],bpm=[120,150,90][rad-1];let k=0;radIv=setInterval(()=>{if(paused)return;if(k%4===0)snd(55+sc[(k/4|0)%3]*2,.2,'sine',.05);snd(220*Math.pow(2,sc[(k*3+(k>>2))%6]/12),.12,rad===2?'sawtooth':'triangle',.018);k++},60000/bpm/2)}};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='e'||e.key==='E')enterExit();if(e.key==='q'||e.key==='Q')nextW();if(e.key==='p'||e.key==='P')pauseMenu();if(e.key===' ')e.preventDefault();if(e.key==='n'||e.key==='N')nitOn=1});addEventListener('keyup',e=>{keys[e.key]=0;if(e.key==='n'||e.key==='N')nitOn=0});
setInterval(()=>{if(!dead)localStorage.setItem('cc-save',JSON.stringify(S))},20000);
init();say('Walk to a vehicle and tap 🚪 · yellow markers = missions!',4);
let last=0;(function f(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused)update(dt);render();requestAnimationFrame(f)})(0);
</script>

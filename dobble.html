<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d47a1">
<title>Dobble | S Loop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#1976d2,#0a2a5e 80%);color:#fff;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.top{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 8px 4px 52px;width:100%}
select,button{font:inherit;font-size:.85rem;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;padding:5px 10px}
select option{color:#111}button{cursor:pointer}
.sc{display:flex;gap:8px;justify-content:center;width:100%;padding:0 10px}
.chip{background:rgba(0,0,0,.3);border-radius:12px;padding:4px 14px;font-weight:700;text-align:center}
.chip b{font-size:1.3rem;margin-inline-start:6px}
#info{min-height:1.6em;margin:6px 8px 2px;text-align:center;color:#ffe082;font-weight:700;font-size:.95rem}
#area{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding-bottom:8px}
.card{position:relative;border-radius:50%;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 0 0 4px #e3f2fd;transition:transform .2s}
.card.shake{animation:sh .35s}
.card.in{animation:in .3s ease-out}
@keyframes in{from{transform:scale(.6) rotate(-30deg);opacity:0}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sy{position:absolute;display:grid;place-items:center;line-height:1;cursor:pointer;transform-origin:center}
.sy.ok{animation:ok .4s}
@keyframes ok{50%{transform:scale(1.4)}}
.lock{opacity:.5;pointer-events:none}
#end{position:fixed;inset:0;background:rgba(5,15,50,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#end.on{display:flex}
.dl{background:#fff;color:#0d2a5e;border-radius:22px;padding:22px;text-align:center;max-width:320px;width:100%}
.dl h2{margin:0 0 8px}.dl button{background:#1976d2;border:0;color:#fff;padding:10px 22px;margin-top:10px;font-size:1rem}
</style>
</head>
<body>
<div class="top">
  <select id="lvl" aria-label="سطح کامپیوتر"><option value="1">کامپیوتر: کند</option><option value="2" selected>کامپیوتر: متوسط</option><option value="3">کامپیوتر: تند</option></select>
  <button id="rst">بازی تازه</button>
</div>
<div class="sc"><div class="chip">شما<b id="a">0</b></div><div class="chip" id="rd">دور 1/15</div><div class="chip">کامپیوتر<b id="b">0</b></div></div>
<div id="info"></div>
<div id="area"><div class="card" id="c0"></div><div class="card" id="c1"></div></div>
<div id="end"><div class="dl"><h2 id="et"></h2><p id="ep"></p><button id="eb">بازی تازه</button></div></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var GV=(function(m){return m?Math.min(1,+m[1]/100):.8})(location.hash.match(/v(\d+)/));
var ac=null;function snd(f,d,ty,v){try{if(!ac){var X=window.AudioContext||window.webkitAudioContext;ac=new X()}if(ac.state==='suspended')ac.resume();var t=ac.currentTime,o=ac.createOscillator(),q=ac.createGain();o.type=ty||'sine';o.frequency.value=f;q.gain.setValueAtTime(GV*(v||.2),t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
var EM=['🍎','🍌','🍇','🍓','🍒','🍑','🍍','🥝','🍉','🍋','🥕','🌽','🍄','🌸','🌵','🌙','⭐','☀️','❄️','🔥','💧','⚡','🎈','🎁','🔔','🎵','🚗','✈️','🐶','🐱','🐸'];
var N=5,CARDS=[],ROUNDS=15;
(function(){ // صفحه‌ی تصویری مرتبه‌ی ۵: ۳۱ کارت، ۶ نماد
  var P=function(x,y){return N+1+x*N+y},L=[];
  for(var m=0;m<N;m++)for(var b=0;b<N;b++){var c=[m];for(var x=0;x<N;x++)c.push(P(x,(m*x+b)%N));L.push(c)}
  for(var a=0;a<N;a++){var v=[N];for(var y=0;y<N;y++)v.push(P(a,y));L.push(v)}
  var inf=[];for(var i=0;i<=N;i++)inf.push(i);L.push(inf);CARDS=L;
})();
var deck,pile,cur,sc,round,common,locked,cpuT,lvl,over;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function commonOf(a,b){for(var i=0;i<a.length;i++)if(b.indexOf(a[i])>-1)return a[i]}
function start(){lvl=+$('lvl').value;deck=shuffle(CARDS.slice());pile=deck.pop();cur=deck.pop();sc=[0,0];round=0;over=false;$('end').classList.remove('on');next(true)}
function size(){var a=$('area'),h=a.clientHeight,w=a.clientWidth;return Math.floor(Math.max(150,Math.min(w-16,(h-16)/2)))}
function drawCard(el,card,anim){
  var S=size(),syms=shuffle(card.slice()),pos=[],R=.31*S;
  el.style.width=el.style.height=S+'px';el.innerHTML='';
  var off=Math.random()*Math.PI*2;
  pos.push([0,0,.3]);for(var i=0;i<5;i++){var an=off+i*2*Math.PI/5;pos.push([Math.cos(an)*R,Math.sin(an)*R,.25])}
  syms.forEach(function(s,i){
    var p=pos[i],sz=S*p[2]*(.72+Math.random()*.34),d=document.createElement('div');d.className='sy';d.textContent=EM[s];d.dataset.s=s;
    d.style.width=d.style.height=sz+'px';d.style.fontSize=(sz*.86)+'px';
    d.style.left=(S/2+p[0]-sz/2)+'px';d.style.top=(S/2+p[1]-sz/2)+'px';
    d.style.transform='rotate('+Math.floor(Math.random()*360)+'deg)';
    d.addEventListener('pointerdown',function(e){e.preventDefault();pick(s,d,el)});
    el.appendChild(d);
  });
  if(anim){el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
}
function next(first){
  if(round>=ROUNDS){finish();return}
  round++;common=commonOf(pile,cur);locked=false;
  drawCard($('c0'),pile,!first);drawCard($('c1'),cur,true);
  $('rd').textContent='دور '+round+'/'+ROUNDS;$('a').textContent=sc[0];$('b').textContent=sc[1];
  $('info').textContent='نمادِ مشترکِ دو کارت را پیدا کن و لمس کن!';
  clearTimeout(cpuT);
  var base=[0,5200,3300,2000][lvl];cpuT=setTimeout(function(){if(locked||over)return;cpuWin()},base*(.75+Math.random()*.5));
}
function pick(s,d,el){
  if(locked||over)return;
  if(s===common){
    locked=true;clearTimeout(cpuT);sc[0]++;snd(880,.12);setTimeout(function(){snd(1175,.2)},90);
    document.querySelectorAll('.sy[data-s="'+s+'"]').forEach(function(x){x.classList.add('ok')});
    $('a').textContent=sc[0];$('info').textContent='آفرین! ✔️';
    advance();
  }else{
    snd(160,.25,'sawtooth',.18);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
    locked=true;$('info').textContent='نه! ۱ ثانیه صبر کن…';
    setTimeout(function(){if(!over){locked=false;$('info').textContent='دوباره امتحان کن!'}},1000);
  }
}
function cpuWin(){
  locked=true;sc[1]++;snd(260,.25,'triangle',.18);
  document.querySelectorAll('.sy[data-s="'+common+'"]').forEach(function(x){x.classList.add('ok');x.parentNode.style.boxShadow='0 0 0 4px #ff8a65'});
  $('b').textContent=sc[1];$('info').textContent='کامپیوتر زودتر پیدا کرد! 🤖';advance();
}
function advance(){
  setTimeout(function(){if(over)return;pile=cur;cur=deck.pop();if(!cur){finish();return}next(false)},950);
}
function finish(){
  over=true;clearTimeout(cpuT);var a=sc[0],b=sc[1];
  $('et').textContent=a>b?'بردی! 🎉':a<b?'کامپیوتر برد':'مساوی شد';
  $('ep').textContent='نتیجه: شما '+a+' — کامپیوتر '+b;
  $('end').classList.add('on');snd(a>=b?880:200,.4);
}
$('rst').onclick=start;$('lvl').onchange=start;$('eb').onclick=start;
addEventListener('resize',function(){if(!over){drawCard($('c0'),pile,false);drawCard($('c1'),cur,false)}});
start();
})();
</script>
<script>
/* S Loop — پخش موسیقی پس‌زمینه (فقط وقتی بازی مستقل باز شده؛ داخل index موسیقی از خود صفحه‌ی اصلی پخش می‌شود) */
(function(){
  if(window.top!==window) return;
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

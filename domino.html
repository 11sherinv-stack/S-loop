<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="دومینو — بازی با کامپیوتر، بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domino</title>
<style>
:root{--bg:#1d4d3a;--ink:#f3f7f1;--btn:#f5c542;--btnink:#2b1d00;--tile:#fbf6e6;--pip:#1c2230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 30%,#2b6b50,var(--bg));color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;--tw:26px}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:56px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none}
h1{margin:6px 0;font-size:1.1rem}
.top{display:flex;justify-content:space-between;align-items:center;width:min(96vw,520px);font-size:.88rem;gap:8px}
.top b{font-size:1.05rem}
.opp{display:flex;gap:3px;justify-content:center;min-height:34px;margin:6px 0;flex-wrap:wrap;max-width:96vw}
.back-t{width:18px;height:32px;border-radius:4px;background:linear-gradient(135deg,#b8893d,#7d5a1d);border:1px solid #4b3410}
.board{flex:1;width:min(96vw,520px);min-height:150px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;direction:ltr;padding:6px;background:rgba(0,0,0,.18);border-radius:14px;margin:4px 0}
.t{display:inline-flex;background:var(--tile);border-radius:5px;border:1px solid #8c8470;box-shadow:0 2px 3px rgba(0,0,0,.35);flex:none}
.t.h{width:calc(var(--tw)*2);height:var(--tw);flex-direction:row}
.t.v{width:var(--tw);height:calc(var(--tw)*2);flex-direction:column}
.half{flex:1;position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.t.h .half+.half{border-left:1px solid #8c8470}.t.v .half+.half{border-top:1px solid #8c8470}
.half i{width:62%;height:62%;border-radius:50%;background:var(--pip);align-self:center;justify-self:center;visibility:hidden}
.half i.on{visibility:visible}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw;margin:8px 0;--tw:36px}
.hand .t{cursor:pointer;transition:transform .12s}
.hand .t.ok{outline:3px solid var(--btn);transform:translateY(-6px)}
.hand .t.dim{opacity:.55}
.hand .t.sel{outline:3px solid #fff;transform:translateY(-10px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
button{font:inherit;border:0;background:var(--btn);color:var(--btnink);border-radius:10px;padding:9px 16px;cursor:pointer}
button.al{background:rgba(255,255,255,.14);color:#fff}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.t:focus-visible{outline:3px solid #fff;outline-offset:2px}
.msg{min-height:1.6em;text-align:center;font-size:.95rem}
.end{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50}
.end>div{background:#16392b;border-radius:18px;padding:22px;text-align:center;max-width:90vw;line-height:1.9;border:1px solid #fff3}
.end h2{margin:0 0 6px}
.mk{font-size:1.4rem;color:var(--btn);display:inline-block;min-width:1.5em}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; S loop</a>
<h1>🁣 Domino</h1>
<div class="top"><span>کامپیوتر: <b id="sc1">۰</b></span><span id="tgt"></span><span>تو: <b id="sc0">۰</b></span></div>
<div class="opp" id="opp" aria-label="مهره‌های کامپیوتر"></div>
<div class="board" id="board" aria-label="میز بازی"></div>
<div class="msg" id="msg" role="status"></div>
<div class="bar"><button id="L" class="al" hidden>◀ سر چپ <span class="mk" id="lv"></span></button><button id="Rr" class="al" hidden>سر راست <span class="mk" id="rv"></span> ▶</button><button id="dr">کشیدن از انبار (<span id="bn">۰</span>)</button><button id="ps" class="al">پاس</button></div>
<div class="hand" id="hand"></div>
<div class="end" id="end"><div><h2 id="eh"></h2><p id="ep"></p><button id="eb"></button></div></div>
<script>
const $=i=>document.getElementById(i),fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const GV=(m=>m?Math.min(1,+m[1]/100):.8)(location.hash.match(/v(\d+)/));
let au;function beep(f,d=.06,ty='triangle',v=.1){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state==='suspended')au.resume();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*GV;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const TARGET=100;
let hands,bone,chain,turn,score=[0,0],passes,sel=null,busy=false,gameOver=false,roundOver=false;
const sum=t=>t[0]+t[1];
function deck(){const d=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push([a,b]);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
const ends=()=>chain.length?[chain[0][0],chain[chain.length-1][1]]:null;
function canPlay(t){if(!chain.length)return{L:true,R:true,any:true};const[l,r]=ends();const L=t[0]===l||t[1]===l,R=t[0]===r||t[1]===r;return{L,R,any:L||R}}
function newRound(){
  const d=deck();hands=[d.splice(0,7),d.splice(0,7)];bone=d;chain=[];passes=0;sel=null;roundOver=false;busy=false;
  // شروع‌کننده: بزرگ‌ترین جفت یا بزرگ‌ترین مهره
  let best=-1,who=0,bi=0;
  for(let p=0;p<2;p++)hands[p].forEach((t,i)=>{const v=(t[0]===t[1]?100:0)+sum(t);if(v>best){best=v;who=p;bi=i}});
  turn=who;
  const t=hands[who].splice(bi,1)[0];chain.push(t);turn=1-who;
  say((who===0?'تو':'کامپیوتر')+' با '+fa(t[0])+'|'+fa(t[1])+' شروع کرد');
  render();if(turn===1)setTimeout(ai,800);
}
function put(p,t,side){
  const i=hands[p].indexOf(t);hands[p].splice(i,1);
  if(!chain.length){chain.push(t)}
  else{const[l,r]=ends();
    if(side==='L'){chain.unshift(t[1]===l?[t[0],t[1]]:[t[1],t[0]])}
    else{chain.push(t[0]===r?[t[0],t[1]]:[t[1],t[0]])}}
  passes=0;beep(380+sum(t)*18,.07);
}
function afterMove(p){
  if(!hands[p].length)return endRound(p,false);
  turn=1-p;render();
  if(turn===1)setTimeout(ai,850);else checkHuman();
}
function checkHuman(){ // اگر حرکتی ندارد و انبار خالی است خودکار پاس
  if(!hands[0].some(t=>canPlay(t).any)&&!bone.length){say('حرکتی نداری؛ پاس!');setTimeout(()=>doPass(0),900)}
}
function doPass(p){
  passes++;beep(150,.1,'sawtooth',.05);
  if(passes>=2)return endRound(null,true);
  turn=1-p;render();if(turn===1)setTimeout(ai,700);else checkHuman();
}
function ai(){
  if(roundOver||turn!==1)return;
  let moves=hands[1].filter(t=>canPlay(t).any);
  while(!moves.length&&bone.length){hands[1].push(bone.pop());moves=hands[1].filter(t=>canPlay(t).any);say('کامپیوتر از انبار کشید');}
  if(!moves.length){say('کامپیوتر پاس کرد');render();return doPass(1)}
  // انتخاب: جفت‌ها و مهره‌ی سنگین‌تر اول؛ ترجیح سمتی که مهره‌های بیشتری برای آن داریم
  const cnt=v=>hands[1].filter(t=>t[0]===v||t[1]===v).length;
  let best=null,bs=-1;
  moves.forEach(t=>{const c=canPlay(t);['L','R'].forEach(s=>{if(!c[s])return;
    let score=sum(t)+(t[0]===t[1]?4:0);
    if(chain.length){const[l,r]=ends();const open=s==='L'?(t[0]===l?t[1]:t[0]):(t[0]===r?t[1]:t[0]);score+=cnt(open)*1.5}
    if(score>bs){bs=score;best=[t,s]}})});
  put(1,best[0],best[1]);say('کامپیوتر '+fa(best[0][0])+'|'+fa(best[0][1])+' گذاشت');afterMove(1);
}
function endRound(winner,blocked){
  roundOver=true;render();
  const s0=hands[0].reduce((a,t)=>a+sum(t),0),s1=hands[1].reduce((a,t)=>a+sum(t),0);
  let txt,w=winner;
  if(blocked){if(s0===s1){w=null;txt='بازی بسته شد و مساوی شد (امتیازی نداد).'}else{w=s0<s1?0:1;const g=Math.abs(s1-s0);score[w]+=g;txt='بازی بسته شد. '+(w===0?'تو':'کامپیوتر')+' با مجموع کمتر برد و '+fa(g)+' امتیاز گرفت.'}}
  else{const g=winner===0?s1:s0;score[winner]+=g;txt=(winner===0?'تو':'کامپیوتر')+' همه‌ی مهره‌ها را گذاشت و '+fa(g)+' امتیاز گرفت.'}
  upd();
  const fin=score[0]>=TARGET||score[1]>=TARGET;
  setTimeout(()=>{
    $('eh').textContent=fin?(score[0]>=score[1]?'🏆 تو بردی!':'کامپیوتر برد'):(w===0?'این دست مال تو':w===1?'این دست مال کامپیوتر':'مساوی');
    $('ep').innerHTML=txt+'<br>امتیاز: تو '+fa(score[0])+' — کامپیوتر '+fa(score[1]);
    $('eb').textContent=fin?'بازی جدید':'دست بعدی';
    $('eb').onclick=()=>{$('end').style.display='none';if(fin)score=[0,0];newRound()};
    $('end').style.display='flex';beep(w===0||fin&&score[0]>=score[1]?700:200,.3);
  },900);
}
/* رابط */
function say(t){$('msg').textContent=t}
function half(n){return `<div class="half">${Array.from({length:9},(_,i)=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('')}</div>`}
function tileHTML(t,vert,extra=''){return `<div class="t ${vert?'v':'h'} ${extra}">${half(t[0])}${half(t[1])}</div>`}
function render(){
  upd();
  $('opp').innerHTML=hands[1].map(()=>'<div class="back-t"></div>').join('');
  // اندازه‌ی مهره‌ها روی میز به تعداد
  const w=Math.min(innerWidth,520)-30,n=Math.max(chain.length,1);
  let tw=16;for(let c=30;c>=16;c--){const rows=Math.ceil(n*2*c/w);if(rows*c*1.35<=210){tw=c;break}}
  document.body.style.setProperty('--tw',tw+'px');
  $('board').innerHTML=chain.map(t=>tileHTML(t,t[0]===t[1])).join('');
  const e=chain.length?ends():null;
  $('hand').innerHTML=hands[0].map((t,i)=>{const c=canPlay(t);const my=turn===0&&!roundOver;return `<div class="t v ${my&&c.any?'ok':my?'dim':''} ${sel===t?'sel':''}" data-i="${i}" role="button" tabindex="0" aria-label="مهره ${t[0]} ${t[1]}">${half(t[0])}${half(t[1])}</div>`}).join('');
  const my=turn===0&&!roundOver;
  const hasMove=hands[0].some(t=>canPlay(t).any);
  $('dr').disabled=!(my&&!hasMove&&bone.length);$('dr').hidden=false;
  $('ps').disabled=!(my&&!hasMove&&!bone.length);
  $('bn').textContent=fa(bone.length);
  const showSide=my&&sel;$('L').hidden=$('Rr').hidden=!showSide;
  if(showSide&&e){$('lv').textContent=fa(e[0]);$('rv').textContent=fa(e[1]);const c=canPlay(sel);$('L').disabled=!c.L;$('Rr').disabled=!c.R}
  if(my&&!roundOver&&!sel){if(!hasMove)say(bone.length?'مهره‌ی قابل‌بازی نداری؛ از انبار بکش':'پاس بده');else if(!$('msg').textContent.includes('کامپیوتر'))say('نوبت توست؛ یک مهره‌ی درخشان را بزن')}
}
function upd(){$('sc0').textContent=fa(score[0]);$('sc1').textContent=fa(score[1]);$('tgt').textContent='تا '+fa(TARGET)+' امتیاز'}
function humanPlay(t,side){
  put(0,t,side);sel=null;afterMove(0);
}
$('hand').addEventListener('click',e=>{
  const el=e.target.closest('.t');if(!el||turn!==0||roundOver)return;
  const t=hands[0][+el.dataset.i],c=canPlay(t);if(!c.any){say('این مهره جا ندارد');beep(120,.08,'sawtooth',.05);return}
  if(c.L&&c.R&&chain.length&&ends()[0]!==ends()[1]){sel=t;render();say('کدام سر؟');return}
  humanPlay(t,c.L?'L':'R');
});
$('hand').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
$('L').onclick=()=>{if(sel)humanPlay(sel,'L')};$('Rr').onclick=()=>{if(sel)humanPlay(sel,'R')};
$('dr').onclick=()=>{if(turn!==0||!bone.length)return;hands[0].push(bone.pop());beep(260,.06);render();checkHuman()};
$('ps').onclick=()=>{if(turn===0)doPass(0)};
newRound();
window.__dm={get chain(){return chain},get hands(){return hands},canPlay,put,deck};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="Flow Connect — نقطه‌های هم‌رنگ را با لوله وصل کن و کل صفحه را پر کن. بازی آنلاین رایگان از S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flow Connect</title>
<style>
:root{--bg:#10142a;--ink:#e8ecff;--card:#1d2347;--btn:#5b8cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:56px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none}
h1{margin:8px 0 2px;font-size:1.05rem}
.info{display:flex;gap:14px;font-size:.88rem;margin:2px 0}
.wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{touch-action:none;border-radius:12px}
.bar{display:flex;gap:8px;margin:8px 0 12px}
button{font:inherit;border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
.ov div{background:var(--card);padding:22px 28px;border-radius:16px;text-align:center;line-height:2;max-width:88vw}
.ov button{background:var(--btn);color:#fff;padding:10px 26px}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; S loop</a>
<h1>🔗 Flow Connect</h1>
<div class="info"><span>مرحله <b id="lv">۱</b></span><span>حرکت <b id="mv">۰</b></span><span>وصل‌شده <b id="cn">۰</b>/<b id="tt">۰</b></span><span>پر <b id="fl">۰</b>٪</span></div>
<div class="wrap"><canvas id="c"></canvas></div>
<div class="bar"><button id="rs">⟲ دوباره</button><button id="hn">💡 راهنما</button></div>
<div class="ov" id="ov"><div><h2 id="oh"></h2><p id="op"></p><button id="ob">ادامه</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const GV=(m=>m?Math.min(1,+m[1]/100):.8)(location.hash.match(/v(\d+)/));
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let au;function beep(f,d=.05,ty='triangle',v=.05){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state==='suspended')au.resume();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*GV;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const COL=['#ff5252','#42a5f5','#66bb6a','#ffd54f','#ab47bc','#ff9800','#26c6da','#ec407a','#8d6e63','#c0ca33'];
let N=5,CS=60,ends=[],paths=[],level=1,moves=0,drag=-1,sol=null,over=false,hintC=-1,hintT=0;
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
/* مسیر همیلتونی تصادفی با روش backbite → هر خانه پوشش داده می‌شود */
function hamPath(n,R){
  const P=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)P.push(r%2?[r,n-1-c]:[r,c]);
  const idx=(p,r,c)=>p.findIndex(q=>q[0]===r&&q[1]===c);
  let path=P;
  for(let it=0;it<n*n*30;it++){
    const head=R()<.5;if(!head)path=path.slice().reverse();
    const[r,c]=path[0],nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[r+a,c+b]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n);
    const q=nb[Math.floor(R()*nb.length)],k=idx(path,q[0],q[1]);
    if(k>=2){path=path.slice(0,k).reverse().concat(path.slice(k))}
    if(!head)path=path.slice().reverse();
  }
  return path;
}
function gen(){
  N=Math.min(9,5+Math.floor((level-1)/2));const R=rng(level*7919+Date.now()%1013),K=Math.min(N+(level>6?1:0),9);
  const ham=hamPath(N,R),L=ham.length;
  // برش به K قطعه‌ی حداقل ۳تایی
  let cuts=[];for(let tries=0;tries<500;tries++){cuts=[];const pool=[];for(let i=3;i<L-2;i++)pool.push(i);while(cuts.length<K-1&&pool.length){const p=pool.splice(Math.floor(R()*pool.length),1)[0];cuts.push(p)}cuts.sort((a,b)=>a-b);let ok=cuts.length===K-1;let prev=0;for(const c of cuts){if(c-prev<3){ok=false;break}prev=c}if(L-prev<3)ok=false;if(ok)break;if(tries===499)cuts=[]}
  if(!cuts.length){const seg=Math.floor(L/K);cuts=[];for(let i=1;i<K;i++)cuts.push(i*seg)}
  const bounds=[0,...cuts,L];ends=[];sol=[];
  for(let i=0;i<bounds.length-1;i++){const seg=ham.slice(bounds[i],bounds[i+1]);ends.push([seg[0],seg[seg.length-1]]);sol.push(seg)}
  paths=ends.map(()=>[]);moves=0;over=false;
}
function start(){gen();drag=-1;fit();upd()}
function fit(){const s=Math.min(innerWidth-16,innerHeight-190,560);CS=Math.floor(s/N);cv.width=CS*N;cv.height=CS*N}
function cellOwner(r,c){for(let i=0;i<paths.length;i++)if(paths[i].some(q=>q[0]===r&&q[1]===c))return i;return -1}
function endAt(r,c){for(let i=0;i<ends.length;i++)for(let e=0;e<2;e++)if(ends[i][e][0]===r&&ends[i][e][1]===c)return{i,e};return null}
function complete(i){const p=paths[i];if(p.length<2)return false;const a=ends[i][0],b=ends[i][1],f=p[0],l=p[p.length-1];return(f[0]===a[0]&&f[1]===a[1]&&l[0]===b[0]&&l[1]===b[1])||(f[0]===b[0]&&f[1]===b[1]&&l[0]===a[0]&&l[1]===a[1])}
function upd(){let cn=0,cov=0;paths.forEach((p,i)=>{if(complete(i))cn++;cov+=p.length});$('lv').textContent=fa(level);$('mv').textContent=fa(moves);$('cn').textContent=fa(cn);$('tt').textContent=fa(ends.length);$('fl').textContent=fa(Math.round(cov/(N*N)*100));return{cn,cov}}
function cellAt(e){const r=cv.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);return(c>=0&&rr>=0&&c<N&&rr<N)?[rr,c]:null}
function truncate(i,idx){paths[i]=paths[i].slice(0,idx)}
cv.addEventListener('pointerdown',e=>{if(over)return;e.preventDefault();const cl=cellAt(e);if(!cl)return;const[r,c]=cl,en=endAt(r,c);
  if(en){drag=en.i;paths[drag]=[[r,c]];moves++;beep(500,.04);try{cv.setPointerCapture(e.pointerId)}catch(_){}upd();return}
  const o=cellOwner(r,c);if(o>=0){const p=paths[o],k=p.findIndex(q=>q[0]===r&&q[1]===c);if(k===p.length-1||true){drag=o;truncate(o,k+1);moves++;try{cv.setPointerCapture(e.pointerId)}catch(_){}upd()}}});
cv.addEventListener('pointermove',e=>{if(drag<0||over)return;const cl=cellAt(e);if(!cl)return;const p=paths[drag],last=p[p.length-1];
  // خانه‌های بین (حرکت سریع): گام به گام به سمت هدف
  let guard=0;while((cl[0]!==last[0]||cl[1]!==last[1])&&guard++<6){const cur=paths[drag][paths[drag].length-1];
    const dr=Math.sign(cl[0]-cur[0]),dc=Math.sign(cl[1]-cur[1]);const nx=Math.abs(cl[0]-cur[0])>=Math.abs(cl[1]-cur[1])?[cur[0]+dr,cur[1]]:[cur[0],cur[1]+dc];
    if(!stepTo(nx))break;if(drag<0)break}
  upd()});
function stepTo(nx){
  const[r,c]=nx,p=paths[drag];const last=p[p.length-1];if(Math.abs(r-last[0])+Math.abs(c-last[1])!==1)return false;
  const own=p.findIndex(q=>q[0]===r&&q[1]===c);if(own>=0){truncate(drag,own+1);return true}
  const en=endAt(r,c);
  if(en&&en.i!==drag)return false; // سر رنگ دیگر
  if(complete(drag))return false; // قبلاً وصل شده؛ ادامه ندهد
  if(en&&en.i===drag){const f=p[0];if(f[0]===r&&f[1]===c)return false}
  // اگر خانه مال رنگ دیگری است، آن لوله از همین خانه قطع می‌شود
  const o=cellOwner(r,c);if(o>=0&&o!==drag){const k=paths[o].findIndex(q=>q[0]===r&&q[1]===c);truncate(o,k)}
  p.push([r,c]);beep(400+p.length*15,.03,'triangle',.03);
  if(complete(drag)){beep(800,.1);drag=-1;checkWin()}
  return true;
}
function release(){if(drag>=0){if(!complete(drag)){/* لوله‌ی ناقص می‌ماند */}drag=-1;upd();checkWin()}}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
function checkWin(){const u=upd();if(u.cn===ends.length&&u.cov===N*N&&!over){over=true;let best=0;try{best=+localStorage.getItem('sl-flow')||0;if(level>best)localStorage.setItem('sl-flow',level)}catch(e){}beep(950,.3);$('oh').textContent='🎉 همه وصل شد!';$('op').textContent='مرحله '+fa(level)+' با '+fa(moves)+' حرکت';$('ob').textContent='مرحله‌ی بعد';$('ob').onclick=()=>{$('ov').style.display='none';level++;start()};setTimeout(()=>$('ov').style.display='flex',350)}}
$('rs').onclick=()=>{paths=ends.map(()=>[]);moves=0;over=false;drag=-1;upd()};
$('hn').onclick=()=>{const i=paths.findIndex((p,k)=>!complete(k));if(i<0)return;paths[i]=sol[i].slice();
  // راهنما یک لوله را کامل می‌کند؛ لوله‌های دیگر که روی آن هستند قطع می‌شوند
  paths.forEach((q,k)=>{if(k!==i)paths[k]=q.filter(c=>!sol[i].some(s=>s[0]===c[0]&&s[1]===c[1]))});upd();checkWin()};
function draw(){
  x.fillStyle='#0a0d1f';x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=1;for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*CS,0);x.lineTo(i*CS,cv.height);x.moveTo(0,i*CS);x.lineTo(cv.width,i*CS);x.stroke()}
  paths.forEach((p,i)=>{if(p.length<1)return;x.strokeStyle=COL[i%COL.length];x.lineWidth=CS*.36;x.lineCap='round';x.lineJoin='round';x.globalAlpha=.92;x.beginPath();p.forEach((q,k)=>{const px=q[1]*CS+CS/2,py=q[0]*CS+CS/2;k?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.globalAlpha=1;
    if(complete(i)){x.fillStyle=COL[i%COL.length];x.globalAlpha=.18;p.forEach(q=>x.fillRect(q[1]*CS,q[0]*CS,CS,CS));x.globalAlpha=1}});
  ends.forEach((pr,i)=>pr.forEach(([r,c])=>{const px=c*CS+CS/2,py=r*CS+CS/2;x.fillStyle=COL[i%COL.length];x.beginPath();x.arc(px,py,CS*.3,0,7);x.fill();x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=2;x.stroke();
    if(hintT>0&&hintC===i){x.strokeStyle='#fff';x.beginPath();x.arc(px,py,CS*.42+Math.sin(performance.now()/100)*2,0,7);x.stroke()}}));
}
let last=0;function loop(ts){hintT-=(ts-last)/1000||0;last=ts;draw();requestAnimationFrame(loop)}
addEventListener('resize',fit);
start();requestAnimationFrame(loop);
window.__fc={get N(){return N},get ends(){return ends},get sol(){return sol},get paths(){return paths},start,set level(v){level=v},complete,checkWin,upd,get over(){return over},hamPath};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

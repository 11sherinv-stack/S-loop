<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f2a1c">
<title>Hanafuda Koi-Koi | S Loop</title>
<style>
:root{--gold:#e3c26e;--cream:#f7efd8;--felt:#143b27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0,#1f5a3a,#0c241a 75%);color:var(--cream);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;user-select:none;-webkit-user-select:none;padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px));touch-action:manipulation}
button{font:inherit;cursor:pointer}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 4px 4px 48px;flex-wrap:wrap}
.hdr h1{margin:0;font-size:1.02rem;color:var(--gold)}
.pill{background:rgba(0,0,0,.35);border:1px solid rgba(227,194,110,.35);border-radius:999px;padding:3px 10px;font-size:.8rem;white-space:nowrap}
.pill b{color:#fff}
.mini{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:3px 9px;font-size:.78rem}
.zone{background:rgba(0,0,0,.22);border:1px solid rgba(227,194,110,.18);border-radius:12px;padding:5px 6px;margin:5px auto;max-width:640px}
.zt{display:flex;justify-content:space-between;font-size:.72rem;color:#cdbf92;margin-bottom:3px}
.row{display:flex;direction:ltr;justify-content:center;flex-wrap:wrap;gap:3px;min-height:24px}
.hand{flex-wrap:nowrap}
.hand .cd{margin-left:calc(var(--hw) * -.16)}.hand .cd:first-child{margin-left:0}
.hand .cd{width:var(--hw);height:calc(var(--hw) * 1.6)}
.chand .cd{width:calc(var(--hw) * .6);height:calc(var(--hw) * .96);margin-left:calc(var(--hw) * -.2)}
.chand .cd:first-child{margin-left:0}
.fld .cd{width:var(--fw);height:calc(var(--fw) * 1.6)}
:root{--hw:clamp(38px,calc((100vw - 28px)/7),66px);--fw:clamp(38px,calc((100vw - 56px)/7.3),62px);--cw:clamp(22px,6.4vw,32px)}
.cap{display:flex;direction:ltr;flex-wrap:wrap;gap:2px 8px;min-height:30px}
.grp{display:flex;align-items:center}
.grp .cd{width:var(--cw);height:calc(var(--cw) * 1.6);margin-left:calc(var(--cw) * -.45)}
.grp .cd:first-child{margin-left:0}
.grp small{font-size:.58rem;color:#cdbf92;margin-right:4px;direction:rtl}
.cd{position:relative;display:block;padding:0;border:0;background:none;border-radius:6%;flex:none;transition:transform .15s,filter .15s}
.cd svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.cd.sel{transform:translateY(-12px)}
.cd.ok svg{filter:drop-shadow(0 0 5px #ffe27a) drop-shadow(0 0 2px #ffe27a)}
.cd.ok{animation:pl .8s infinite alternate}
@keyframes pl{to{transform:translateY(-3px)}}
.cd.dim{filter:brightness(.6)}
.cd.nw{animation:nw .35s ease-out}
@keyframes nw{from{transform:scale(.4) rotate(-12deg);opacity:.2}to{transform:none;opacity:1}}
.mid{display:flex;gap:8px;align-items:flex-start;direction:ltr}
.deck{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:calc(var(--fw) * 1.05)}
.deck .cd{width:var(--fw);height:calc(var(--fw) * 1.6)}
.deck small{font-size:.65rem;color:#cdbf92;direction:rtl}
.fld{flex:1}
#msg{min-height:2.4em;text-align:center;font-size:.9rem;color:#ffe9a8;padding:2px 6px}
.badge{display:inline-block;background:var(--gold);color:#2b2208;border-radius:6px;padding:0 6px;font-size:.7rem;margin-inline-start:4px}
.yk{font-size:.7rem;color:#ffe9a8}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:60;padding:14px;overflow:auto}
#ov.on{display:flex}
.dlg{background:#16301f;border:1px solid var(--gold);border-radius:18px;padding:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 18px 50px #000a;text-align:center}
.dlg h2{margin:0 0 6px;color:var(--gold);font-size:1.15rem}
.dlg p{margin:6px 0;line-height:1.8;font-size:.9rem}
.dlg .bt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dlg button{border:1px solid var(--gold);background:#23442f;color:#fff;border-radius:11px;padding:9px 14px}
.dlg button.pr{background:var(--gold);color:#2b2208;font-weight:700}
.yl{text-align:right;font-size:.82rem;margin:6px 0;padding:0;list-style:none}
.yl li{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);border-radius:8px;padding:5px 9px;margin:3px 0}
.yl li b{color:#ffe27a;white-space:nowrap}
.tbl{width:100%;font-size:.78rem;border-collapse:collapse;text-align:right}
.tbl td{padding:3px 5px;border-bottom:1px solid rgba(255,255,255,.1)}
.tbl td:last-child{color:#ffe27a;white-space:nowrap}
.big{font-size:1.6rem;color:#ffe27a;font-weight:800;margin:4px 0}
.fly{position:fixed;z-index:70;pointer-events:none;transition:left .45s ease,top .45s ease,transform .45s ease;}
</style>
</head>

 var ask=R.ask,selCard=R.sel?R.hand.p.filter(function(c){return c.id===R.sel})[0]:null;
 var hl=[]; // ورق‌های زمین که قابل انتخاب‌اند
 if(ask&&ask.type==='draw')hl=ask.data.opts.map(function(c){return c.id});
 else if(selCard)hl=matches(selCard.m).map(function(c){return c.id});
 var f=$('field');f.innerHTML='';
 R.field.forEach(function(c){
  var ok=hl.indexOf(c.id)>-1;
  f.appendChild(cardEl(c,(ok?'ok ':'')+(R.fresh[c.id]?'nw':''),ok?function(){fieldClick(c)}:null));
 });
 if(!R.field.length){var e=document.createElement('small');e.style.cssText='color:#8c9a8a;padding:10px';e.textContent='زمین خالی است';f.appendChild(e)}
 var dk=$('deck');dk.innerHTML='';if(R.deck.length)dk.appendChild(cardEl(null));$('dcnt').textContent=fa(R.deck.length)+' ورق';
 var dr=$('drawn');dr.innerHTML='';if(R.drawn){dr.appendChild(cardEl(R.drawn,'nw'));dr.firstChild.style.width='var(--fw)';dr.firstChild.style.height='calc(var(--fw) * 1.6)'}
 var h=$('hand');h.innerHTML='';
 var canPick=ask&&(ask.type==='hand'||ask.type==='target');
 R.hand.p.forEach(function(c){
  var cls=(R.sel===c.id?'sel ':'')+(canPick&&matches(c.m).length?'ok ':'')+(canPick?'':'dim');
  h.appendChild(cardEl(c,cls,function(){handClick(c)}));
 });
 R.fresh={};
}
function handClick(c){
 if(!R||!R.ask||R.done)return;
 var a=R.ask;if(a.type!=='hand'&&a.type!=='target')return;
 if(R.sel===c.id){R.sel=null;a.type='hand';render();return}
 var ms=matches(c.m);
 if(ms.length===2){R.sel=c.id;a.type='target';a.data={card:c,opts:ms};render();say('کدام ورق زمین را می‌خواهی؟ یکی از ورق‌های درخشان را لمس کن.');return}
 R.ask=null;a.res({c:c,t:ms[0]||null});
}
function fieldClick(t){
 if(!R||!R.ask)return;var a=R.ask;
 if(a.type==='target'){R.ask=null;a.res({c:a.data.card,t:t})}
 else if(a.type==='draw'){R.ask=null;a.res(t)}
}
$('rules').onclick=function(){rules(false)};
$('newb').onclick=function(){menu()};
menu();
})();
</script>
<script>
/* S Loop — پخش موسیقی پس‌زمینه (فقط وقتی بازی مستقل باز شده؛ داخل index موسیقی از خود صفحه‌ی اصلی پخش می‌شود) */
(function(){
  if(window.top!==window) return;
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>

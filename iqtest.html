<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="تست IQ — ۲۰ سؤال هوش و منطق با نتیجه‌ی تقریبی. بازی آنلاین رایگان از S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ Test</title>
<style>
:root{--bg:#eef0f6;--ink:#1c2230;--muted:#667085;--card:#fff;--line:#d5d9e4;--btn:#5b5bd6;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--ink:#e8ecf5;--muted:#9aa3b8;--card:#1f2330;--line:#343a4d;--btn:#8b8bff;--btnink:#101030}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:56px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none}
h1{margin:8px 0;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(94vw,460px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.q{font-size:1.15rem;line-height:2;margin:6px 0 12px;text-align:center;font-weight:600}
.q small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{font:inherit;font-size:1.05rem;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opts button:active{background:var(--btn);color:var(--btnink)}
.opts button.sel{outline:3px solid var(--btn)}
.opts button.ok{background:#2e7d3233;border-color:#2e7d32}.opts button.bad{background:#c6282833;border-color:#c62828}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--btn);width:0;transition:width .2s}
.go{font:inherit;border:0;background:var(--btn);color:var(--btnink);border-radius:12px;padding:12px 26px;cursor:pointer;margin-top:10px}
.go.al{background:var(--line);color:var(--ink)}
.res{text-align:center;line-height:2}.big{font-size:3.2rem;font-weight:800;color:var(--btn);line-height:1.2}
.rev{text-align:right;font-size:.88rem;margin-top:12px;line-height:1.9}.rev div{padding:6px 0;border-top:1px solid var(--line)}
.note{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.8}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; S loop</a>
<h1>🧠 تست IQ</h1>
<div class="card" id="box"></div>
<script>
const $=i=>document.getElementById(i),box=$('box');
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
/* [متن، [گزینه‌ها]، شاخص پاسخ درست، نوع، سختی(1-3)، توضیح] */
const Q=[
['۲، ۴، ۸، ۱۶، ؟',['۲۴','۳۰','۳۲','۳۴'],2,'عدد',1,'هر عدد دو برابر قبلی است.'],
['۳، ۶، ۹، ۱۲، ؟',['۱۴','۱۵','۱۶','۱۸'],1,'عدد',1,'هر بار ۳ تا اضافه می‌شود.'],
['۱، ۴، ۹، ۱۶، ۲۵، ؟',['۳۰','۳۴','۳۶','۴۰'],2,'عدد',1,'مربع اعداد ۱ تا ۵ و بعد ۶²=۳۶.'],
['۲، ۳، ۵، ۸، ۱۲، ؟',['۱۵','۱۶','۱۷','۱۸'],2,'عدد',2,'تفاضل‌ها ۱، ۲، ۳، ۴ و بعد ۵ است.'],
['۱، ۱، ۲، ۳، ۵، ۸، ؟',['۱۰','۱۱','۱۲','۱۳'],3,'عدد',2,'دنباله‌ی فیبوناچی؛ هر عدد مجموع دو عدد قبلی.'],
['۱۰۰، ۹۱، ۸۲، ۷۳، ؟',['۶۰','۶۲','۶۴','۶۶'],2,'عدد',1,'هر بار ۹ تا کم می‌شود.'],
['۲، ۶، ۱۲، ۲۰، ۳۰، ؟',['۳۶','۴۰','۴۲','۴۴'],2,'عدد',2,'تفاضل‌ها ۴، ۶، ۸، ۱۰ و بعد ۱۲.'],
['۱، ۳، ۷، ۱۵، ۳۱، ؟',['۴۵','۶۱','۶۳','۶۵'],2,'عدد',2,'هر عدد دو برابر قبلی به‌علاوه‌ی ۱ است.'],
['۸۱، ۲۷، ۹، ۳، ؟',['۰','۱','۲','۶'],1,'عدد',1,'هر عدد یک‌سوم قبلی است.'],
['۳، ۵، ۹، ۱۷، ۳۳، ؟',['۴۹','۵۷','۶۵','۶۹'],2,'عدد',3,'هر بار تفاضل دو برابر می‌شود: ۲، ۴، ۸، ۱۶، ۳۲.'],
['۲، ۵، ۱۰، ۱۷، ۲۶، ؟',['۳۵','۳۷','۳۹','۴۱'],1,'عدد',3,'اعداد به‌صورت n²+1 هستند: ۶²+۱=۳۷.'],
['۱، ۲، ۶، ۲۴، ۱۲۰، ؟',['۲۴۰','۴۸۰','۶۰۰','۷۲۰'],3,'عدد',3,'ضرب در ۱، ۲، ۳، ۴، ۵ و بعد ۶: ۱۲۰×۶=۷۲۰.'],
['ماهی : دریا = شتر : ؟',['کوه','جنگل','بیابان','دریاچه'],2,'کلامی',1,'ماهی در دریا و شتر در بیابان زندگی می‌کند.'],
['سرد : گرم = تاریک : ؟',['شب','روشن','سیاه','سایه'],1,'کلامی',1,'متضاد.'],
['قلب : خون = ریه : ؟',['هوا','آب','غذا','استخوان'],0,'کلامی',2,'قلب خون و ریه هوا را جابه‌جا می‌کند.'],
['ساعت : زمان = دماسنج : ؟',['گرما','دما','هوا','پزشک'],1,'کلامی',1,'ابزار اندازه‌گیری و کمیت آن.'],
['نویسنده : کتاب = نقاش : ؟',['قلم‌مو','رنگ','تابلو','موزه'],2,'کلامی',2,'سازنده و محصول.'],
['کدام متفاوت است؟ سیب، گلابی، هویج، موز',['سیب','گلابی','هویج','موز'],2,'کلامی',1,'هویج سبزی است و بقیه میوه.'],
['کدام متفاوت است؟ مربع، مثلث، دایره، مکعب',['مربع','مثلث','دایره','مکعب'],3,'کلامی',2,'مکعب سه‌بعدی است و بقیه دوبعدی.'],
['کدام متفاوت است؟ ۱۶، ۲۵، ۳۶، ۴۵',['۱۶','۲۵','۳۶','۴۵'],3,'عدد',2,'۴۵ مربع کامل نیست.'],
['کدام متفاوت است؟ آهن، مس، چوب، طلا',['آهن','مس','چوب','طلا'],2,'کلامی',1,'چوب فلز نیست.'],
['علی از رضا بلندتر و رضا از حسن بلندتر است. کدام کوتاه‌تر است؟',['علی','رضا','حسن','نمی‌شود فهمید'],2,'منطق',1,'ترتیب: علی > رضا > حسن.'],
['اگر ۵ ماشین در ۵ دقیقه ۵ پیچ بسازند، ۱۰۰ ماشین ۱۰۰ پیچ را در چند دقیقه می‌سازند؟',['۵','۲۰','۵۰','۱۰۰'],0,'منطق',3,'هر ماشین در ۵ دقیقه یک پیچ می‌سازد.'],
['اگر دیروز فردای پنج‌شنبه بود، امروز چه روزی است؟',['جمعه','شنبه','پنج‌شنبه','یکشنبه'],1,'منطق',2,'دیروز جمعه بوده پس امروز شنبه است.'],
['پدری ۳ برابر سن پسرش است و مجموع سن‌شان ۴۰ است. پسر چند ساله است؟',['۸','۱۰','۱۲','۱۵'],1,'منطق',2,'x + ۳x = ۴۰ ⇒ x = ۱۰.'],
['نصفِ یک‌چهارمِ عددی ۵ است. آن عدد کدام است؟',['۲۰','۳۰','۴۰','۵۰'],2,'منطق',2,'۵ × ۲ × ۴ = ۴۰.'],
['در مسابقه‌ی دو، نفر دوم را سبقت می‌گیری. حالا چندم هستی؟',['اول','دوم','سوم','چهارم'],1,'منطق',2,'جای او را می‌گیری، یعنی دوم.'],
['🔴🔵🔵🔴🔵🔵🔴 ؟',['🔴','🔵','🟢','🟡'],1,'الگو',1,'الگو: قرمز، دو آبی؛ تکرار می‌شود.'],
['⬆️➡️⬇️⬅️⬆️ ؟',['⬆️','➡️','⬇️','⬅️'],1,'الگو',1,'چرخش ساعت‌گرد.'],
['🟥🟦🟦🟥🟥🟥🟦🟦🟦 ؟',['🟥','🟦','🟩','⬛'],1,'الگو',3,'دسته‌ها یکی‌یکی بزرگ‌تر می‌شوند: ۱ قرمز، ۲ آبی، ۳ قرمز، ۴ آبی؛ تا اینجا ۳ آبی آمده پس یک آبی دیگر لازم است.'],
['اگر ۳ گربه ۳ موش را در ۳ دقیقه بگیرند، ۶ گربه ۶ موش را در چند دقیقه می‌گیرند؟',['۳','۶','۹','۱۲'],0,'منطق',3,'هر گربه در ۳ دقیقه یک موش می‌گیرد.'],
['کدام عدد ادامه‌ی دنباله است؟ ۷، ۱۰، ۱۴، ۱۹، ؟',['۲۳','۲۵','۲۷','۳۰'],1,'عدد',3,'تفاضل‌ها ۳، ۴، ۵ و بعد ۶: ۱۹+۶=۲۵.']
];
let qs,cur,ans,t0,tick,order;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  // ۲۰ سؤال با ترکیب سختی
  const by={1:[],2:[],3:[]};Q.forEach((q,i)=>by[q[4]].push(i));
  const pick=(l,n)=>shuffle(by[l]).slice(0,Math.min(n,by[l].length));
  qs=shuffle([...pick(1,7),...pick(2,8),...pick(3,5)]).slice(0,20);
  // ترتیب گزینه‌ها هم بُر می‌خورد
  order=qs.map(i=>{const o=shuffle([0,1,2,3]);return o});
  cur=0;ans=Array(qs.length).fill(null);t0=Date.now();render();
}
function render(){
  if(cur>=qs.length)return finish();
  const q=Q[qs[cur]],o=order[cur];
  box.innerHTML=`<div class="row"><span>سؤال ${fa(cur+1)} از ${fa(qs.length)}</span><span id="tt"></span></div><div class="bar"><i style="width:${cur/qs.length*100}%"></i></div>
  <div class="q">${q[0]}<small>${q[3]}</small></div><div class="opts">${o.map(k=>`<button data-k="${k}">${q[1][k]}</button>`).join('')}</div>`;
  box.querySelector('.opts').onclick=e=>{const b=e.target.closest('button');if(!b)return;ans[cur]=+b.dataset.k;b.classList.add('sel');setTimeout(()=>{cur++;render()},180)};
}
function finish(){
  let raw=0,w=0,tot=0;qs.forEach((qi,i)=>{const q=Q[qi];tot+=q[4];if(ans[i]===q[2]){raw++;w+=q[4]}});
  const f=w/tot,sec=Math.round((Date.now()-t0)/1000);
  const iq=Math.round(70+f*72);let lvl=iq>=130?'بسیار بالا 🌟':iq>=115?'بالاتر از میانگین':iq>=90?'میانگین':iq>=80?'کمی پایین‌تر از میانگین':'نیاز به تمرین بیشتر';
  let best=0;try{best=+localStorage.getItem('sl-iq-best')||0;if(iq>best){best=iq;localStorage.setItem('sl-iq-best',iq)}}catch(e){}
  box.innerHTML=`<div class="res"><div>نتیجه‌ی تقریبی</div><div class="big">${fa(iq)}</div><div>${lvl}</div><div>پاسخ درست: ${fa(raw)} از ${fa(qs.length)} · زمان: ${fa(Math.floor(sec/60))}:${fa(String(sec%60).padStart(2,'0'))}</div><div>بهترین نتیجه: ${fa(best)}</div>
  <button class="go" id="rt">دوباره</button> <button class="go al" id="rv">مرور پاسخ‌ها</button>
  <div class="note">این آزمون فقط برای سرگرمی است و جایگزین آزمون‌های رسمی روان‌سنجی نیست.</div></div>`;
  $('rt').onclick=start;$('rv').onclick=()=>review();
}
function review(){
  box.innerHTML='<div class="rev">'+qs.map((qi,i)=>{const q=Q[qi],ok=ans[i]===q[2];return `<div>${ok?'✅':'❌'} ${q[0]}<br><small>پاسخ درست: <b>${q[1][q[2]]}</b>${ok?'':' · پاسخ تو: '+(ans[i]==null?'—':q[1][ans[i]])}<br>${q[5]}</small></div>`}).join('')+'</div><div style="text-align:center"><button class="go" id="rt">دوباره</button></div>';
  $('rt').onclick=start;
}
start();
window.__iq={Q,start,get qs(){return qs},finish};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

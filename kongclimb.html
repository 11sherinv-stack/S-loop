<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kong Climb</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
html,body{margin:0;height:100%;background:#0b0b18;color:#fff;font-family:Tahoma,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center}
a.back{align-self:flex-start;color:#ffcf5a;text-decoration:none;padding:6px 12px;font-size:14px}
#hud{font-size:14px;display:flex;gap:16px}
canvas{height:min(calc(100vh - 210px),calc(100vw*540/448));aspect-ratio:448/540;background:#000;border:2px solid #333}
#pad{display:flex;justify-content:space-between;width:min(100vw,420px);padding:8px 12px;direction:ltr}
#pad .dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
button{border-radius:12px;border:2px solid #ffcf5a;background:#222;color:#fff;font-size:22px}
button:active{background:#555}#bj{width:90px;height:90px;border-radius:50%;background:#a22;align-self:center;font-size:18px}
#msg{position:absolute;top:36%;background:#000c;padding:14px 22px;border-radius:10px;text-align:center;font-size:20px}
</style></head><body>
<a class="back" href="index.html">← S loop</a>
<div id="hud"><span>امتیاز <b id="sc">0</b></span><span>مرحله <b id="lv">1</b></span><span>جان <b id="li">3</b></span></div>
<canvas id="c" width="448" height="540"></canvas>
<div id="pad"><div class="dp"><span></span><button id="bu">▲</button><span></span><button id="bl">◀</button><button id="bd">▼</button><button id="br">▶</button></div><button id="bj">پرش</button></div>
<div id="msg">رو به بالا برو و به نجات‌یافته برس!<br>از روی بشکه‌ها بپر<br><small>◀ ▶ ▲ ▼ و پرش (فاصله)</small><br><small>برای شروع لمس کن</small></div>
<script>
if(self!==top){const b=document.querySelector('.back');if(b)b.style.display='none'}
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=448;
const BASE=[470,395,320,245,170,95],SL=[-1,1,-1,1,-1,0],SLOPE=16;
const py=(k,x)=>BASE[k]+SL[k]*SLOPE*(x/W)+(SL[k]<0?SLOPE:0)*0; // رو به پایین سمت چپ (-1) → چپ پایین‌تر
function PY(k,x){return SL[k]<0?BASE[k]+SLOPE*(1-x/W):SL[k]>0?BASE[k]+SLOPE*(x/W):BASE[k]}
const LAD=[{k:0,x:340},{k:0,x:120},{k:1,x:100},{k:1,x:300},{k:2,x:340},{k:2,x:200},{k:3,x:90},{k:3,x:290},{k:4,x:200},{k:4,x:380}];
const K={l:0,r:0,u:0,d:0,j:0};const map={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',' ':'j'};
addEventListener('keydown',e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault();begin()}});
addEventListener('keyup',e=>{if(map[e.key])K[map[e.key]]=0});
function bind(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;begin()});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=0))}
bind('bl','l');bind('br','r');bind('bu','u');bind('bd','d');bind('bj','j');
let P,Bs,score,lives,level,run=false,thr,tick=0,flash=0;
function begin(){if(!run){score=0;lives=3;level=1;load();run=true;msg.style.display='none'}}
function load(){P={x:40,lv:0,y:PY(0,40),vy:0,air:false,lad:null,face:1};Bs=[];thr=50;hud()}
function hud(){sc.textContent=score;lv.textContent=level;li.textContent=lives}
function loseLife(){lives--;flash=40;hud();if(lives<=0){run=false;msg.innerHTML='پایان بازی — امتیاز '+score+'<br><small>برای شروع دوباره لمس کن</small>';msg.style.display='block'}else{P.x=40;P.lv=0;P.y=PY(0,40);P.vy=0;P.air=false;P.lad=null;Bs=[];thr=60}}
function ladderNear(k){return LAD.find(l=>l.k==k&&Math.abs(l.x-P.x)<12)}
function update(){
 if(!run)return;tick++;
 const sp=2;
 if(P.lad){ // روی نردبان
  const l=P.lad;if(K.u)P.y-=1.6;if(K.d)P.y+=1.6;P.x=l.x;
  if(P.y<=PY(l.k+1,l.x)){P.lv=l.k+1;P.y=PY(P.lv,P.x);P.lad=null}
  else if(P.y>=PY(l.k,l.x)){P.lv=l.k;P.y=PY(P.lv,P.x);P.lad=null}
 }else if(!P.air){
  const ax=K.r-K.l;if(ax){P.x+=ax*sp;P.face=ax}P.x=Math.max(10,Math.min(W-10,P.x));P.y=PY(P.lv,P.x);
  if(K.u){const l=ladderNear(P.lv);if(l){P.lad=l;P.x=l.x}}
  else if(K.d&&P.lv>0){const l=ladderNear(P.lv-1);if(l){P.lad={...l};P.x=l.x;P.lv=l.k;P.lad=l;P.y=PY(l.k+1,l.x)+2}}
  if(K.j){P.vy=-5.4;P.air=true;P.jx=P.x}
 }else{
  const ax=K.r-K.l;P.x+=ax*sp*1.1;P.x=Math.max(10,Math.min(W-10,P.x));P.vy+=.28;const oy=P.y;P.y+=P.vy;
  if(P.vy>0){const gy=PY(P.lv,P.x);if(oy<=gy+1&&P.y>=gy){P.y=gy;P.vy=0;P.air=false}}
 }
 // پرتاب بشکه
 if(--thr<=0){Bs.push({x:90,k:5,y:BASE[5],dir:1,fall:false,t:0,sc:false});thr=Math.max(45,110-level*10)}
 const bs=1.3+level*.15;
 for(const b of Bs){
  if(!b.fall){b.x+=b.dir*bs;b.y=PY(b.k,b.x);
   if(b.k>0){ if(b.dir>0&&b.x>(b.k==5?330:W-6)||b.dir<0&&b.x<6){b.fall=true;b.fx=b.x;b.dir=-b.dir}
    else{const l=LAD.find(l=>l.k==b.k-1&&Math.abs(l.x-b.x)<bs&&!b.l);if(l&&Math.random()<.25){b.fall=true;b.keep=true;b.l=1}else if(l)b.l=1}
    if(b.x%40<bs)b.l=0}
   else if(b.x<6)b.dead=true}
  else{b.y+=2.6;const gy=PY(b.k-1,b.x);if(b.y>=gy){b.y=gy;b.k--;b.fall=false;b.l=1;if(!b.keep)b.dir=SL[b.k]>0?1:-1;else b.dir=SL[b.k]>0?1:-1;b.keep=false}}
  // برخورد
  const dx=Math.abs(b.x-P.x),dy=(P.y-10)-(b.y-7);
  if(dx<11&&Math.abs(dy)<12&&!P.dead){loseLife();return}
  if(P.air&&!b.sc&&dx<14&&P.y<b.y-6&&P.y>b.y-40){b.sc=true;score+=100;hud()}
 }
 Bs=Bs.filter(b=>!b.dead);
 if(P.lv==5&&P.x>230&&P.x<290){score+=500+level*100;level++;hud();load()}
}
function draw(){
 g.fillStyle='#000';g.fillRect(0,0,W,540);
 for(let k=0;k<6;k++){g.strokeStyle='#d6402f';g.lineWidth=7;g.beginPath();g.moveTo(0,PY(k,0)+4);g.lineTo(k==5?340:W,PY(k,k==5?340:W)+4);g.stroke();
  g.strokeStyle='#ffb09a';g.lineWidth=1.5;g.beginPath();g.moveTo(0,PY(k,0)+1);g.lineTo(k==5?340:W,PY(k,k==5?340:W)+1);g.stroke()}
 g.strokeStyle='#59c3ff';g.lineWidth=3;
 for(const l of LAD){const y0=PY(l.k,l.x),y1=PY(l.k+1,l.x);g.beginPath();g.moveTo(l.x-6,y0);g.lineTo(l.x-6,y1);g.moveTo(l.x+6,y0);g.lineTo(l.x+6,y1);
  for(let y=y1+5;y<y0;y+=9){g.moveTo(l.x-6,y);g.lineTo(l.x+6,y)}g.stroke()}
 g.font='34px serif';g.textAlign='center';g.fillText('🦍',60,BASE[5]-4);g.fillText('👸',260,BASE[5]-4);
 g.font='11px sans-serif';g.fillStyle='#ff9ac1';g.fillText('کمک!',260,BASE[5]-42);
 g.font='26px serif';g.fillText('🛢️',16,BASE[0]+SLOPE-1);
 for(const b of Bs){g.save();g.translate(b.x,b.y-7);g.rotate(b.x/6);g.fillStyle='#b0651f';g.beginPath();g.arc(0,0,7,0,7);g.fill();g.strokeStyle='#4a2a08';g.lineWidth=2;g.beginPath();g.moveTo(-7,0);g.lineTo(7,0);g.stroke();g.restore()}
 // قهرمان
 if(!(flash>0&&flash%6<3)){g.save();g.translate(P.x,P.y);g.fillStyle='#e22';g.fillRect(-6,-22,12,12);g.fillStyle='#24c';g.fillRect(-6,-12,12,9);g.fillStyle='#f3c59a';g.fillRect(-4,-27,8,6);g.fillStyle='#e22';g.fillRect(-5,-29,10,3);
  g.fillStyle='#fff';g.fillRect(P.face>0?1:-3,-25,2,2);g.restore()}
 if(flash>0)flash--}
score=0;lives=3;level=1;load();
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script></body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#263238">
<title>Minesweeper | S Loop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,#37474f,#1c262b);color:#eceff1;font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
h1{margin:4px 0 8px;font-size:1.15rem;padding-left:46px}
.bar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
select,button{font:inherit;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:6px 10px}
select option{color:#111}button{cursor:pointer}
.stat{display:flex;justify-content:space-between;width:min(96vw,560px);margin-bottom:8px;gap:8px}
.chip{background:rgba(0,0,0,.35);border-radius:12px;padding:6px 12px;font-weight:700;min-width:84px;text-align:center;direction:ltr}
#face{font-size:1.3rem;padding:2px 12px}
#bd{display:grid;gap:2px;background:#10181c;padding:5px;border-radius:12px;box-shadow:0 10px 26px #0009;direction:ltr;touch-action:manipulation}
.c{aspect-ratio:1;border:0;border-radius:4px;padding:0;font-weight:800;display:grid;place-items:center;background:linear-gradient(145deg,#78909c,#607d8b);color:#fff;font-size:calc(var(--s)*.55);line-height:1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.c.o{background:#cfd8dc;box-shadow:none;cursor:default}
.c.m{background:#ef5350}
.c.x{background:#b71c1c}
.c.f::after{content:"🚩";font-size:calc(var(--s)*.5)}
.n1{color:#1976d2}.n2{color:#388e3c}.n3{color:#d32f2f}.n4{color:#303f9f}.n5{color:#8d2a1b}.n6{color:#00838f}.n7{color:#212121}.n8{color:#757575}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button.on{background:#ffd54f;color:#2b2100;border-color:transparent;font-weight:700}
#msg{min-height:1.8em;margin-top:8px;font-weight:700;color:#ffe082;text-align:center}
.hint{font-size:.74rem;opacity:.65;text-align:center;margin-top:4px}
</style>
</head>
<body>
<h1>💣 Minesweeper — مین‌روب</h1>
<div class="bar">
  <select id="lv" aria-label="سطح"><option value="0">آسان ۹×۹</option><option value="1">متوسط ۱۲×۱۲</option><option value="2">سخت ۱۲×۱۸</option></select>
  <button id="new">بازی تازه</button>
</div>
<div class="stat"><div class="chip" id="mc">💣 10</div><button id="face" aria-label="شروع دوباره">🙂</button><div class="chip" id="tm">⏱ 0</div></div>
<div id="bd" role="grid"></div>
<div class="tools"><button id="tg" class="on">⛏ باز کردن</button><button id="tf">🚩 پرچم</button></div>
<div id="msg" aria-live="polite"></div>
<div class="hint">لمس = باز کردن · نگه‌داشتن (یا کلیک راست) = پرچم · لمس عدد با پرچم‌های کافی = باز کردن اطراف</div>
<script>
(function(){
'use strict';
var LV=[[9,9,10],[12,12,24],[12,18,40]];
var R,C,M,g,st,flags,left,timer,t0,flagMode=false,over,first,S;
var GV=(function(m){return m?Math.min(1,+m[1]/100):.8})(location.hash.match(/v(\d+)/));
var ac=null;function snd(f,d,ty,v){try{if(!ac){var X=window.AudioContext||window.webkitAudioContext;ac=new X()}if(ac.state==='suspended')ac.resume();var t=ac.currentTime,o=ac.createOscillator(),q=ac.createGain();o.type=ty||'triangle';o.frequency.value=f;q.gain.setValueAtTime(GV*(v||.15),t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
var $=function(i){return document.getElementById(i)};
function size(){var w=Math.min(window.innerWidth-24,560),h=window.innerHeight-290;S=Math.floor(Math.max(24,Math.min(w/C,h/R,46)));$('bd').style.setProperty('--s',S+'px');$('bd').style.gridTemplateColumns='repeat('+C+','+S+'px)'}
function nb(i,fn){var r=(i/C)|0,c=i%C;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)fn(rr*C+cc)}}
function init(){
  var l=LV[+$('lv').value];R=l[0];C=l[1];M=l[2];
  g=new Array(R*C).fill(0);st=new Array(R*C).fill(0); // st:0 بسته 1 باز 2 پرچم
  window._hit=-1;flags=0;left=R*C-M;over=false;first=true;clearInterval(timer);$('tm').textContent='⏱ 0';$('face').textContent='🙂';$('msg').textContent='';
  var b=$('bd');b.innerHTML='';size();
  for(var i=0;i<R*C;i++){(function(i){var e=document.createElement('button');e.className='c';e.setAttribute('aria-label','خانه');
    var pt=null,long=false;
    e.addEventListener('pointerdown',function(ev){if(ev.button===2)return;long=false;clearTimeout(pt);pt=setTimeout(function(){long=true;flag(i);if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}},380)});
    ['pointerup','pointerleave','pointercancel'].forEach(function(t){e.addEventListener(t,function(){clearTimeout(pt)})});
    e.addEventListener('click',function(){if(long){long=false;return}tap(i)});
    e.addEventListener('contextmenu',function(ev){ev.preventDefault();flag(i)});
    b.appendChild(e)})(i)}
  upd();
}
function place(safe){
  var cand=[];for(var i=0;i<R*C;i++){var bad=i===safe;nb(safe,function(j){if(j===i)bad=true});if(!bad)cand.push(i)}
  for(var k=0;k<M;k++){var p=Math.floor(Math.random()*cand.length);g[cand[p]]=-1;cand.splice(p,1)}
  for(i=0;i<R*C;i++)if(g[i]!==-1){var n=0;nb(i,function(j){if(g[j]===-1)n++});g[i]=n}
}
function flag(i){if(over||st[i]===1)return;if(st[i]===0&&flags>=M){return}st[i]=st[i]===2?0:2;flags+=st[i]===2?1:-1;snd(st[i]?620:420,.06);upd()}
function tap(i){
  if(over)return;
  if(flagMode&&st[i]!==1){flag(i);return}
  if(st[i]===2)return;
  if(st[i]===1){ // chord
    var f=0;nb(i,function(j){if(st[j]===2)f++});
    if(g[i]>0&&f===g[i]){var boom=false;nb(i,function(j){if(st[j]===0){if(open(j))boom=true}});if(boom)lose(-1);else check()}
    upd();return;
  }
  if(first){first=false;place(i);t0=Date.now();timer=setInterval(function(){$('tm').textContent='⏱ '+Math.floor((Date.now()-t0)/1000)},500)}
  if(open(i)){lose(i)}else{snd(500,.05);check()}
  upd();
}
function open(i){ // true اگر مین
  if(st[i]!==0)return false;
  if(g[i]===-1){st[i]=1;return true}
  var q=[i];st[i]=1;left--;
  while(q.length){var k=q.pop();if(g[k]===0)nb(k,function(j){if(st[j]===0){st[j]=1;left--;q.push(j)}else if(st[j]===2&&g[j]!==-1){}})}
  return false;
}
function check(){if(left===0&&!over){over=true;clearInterval(timer);$('face').textContent='😎';$('msg').textContent='بردی! 🎉 زمان: '+Math.floor((Date.now()-t0)/1000)+' ثانیه';snd(784,.2);setTimeout(function(){snd(1175,.3)},150);for(var i=0;i<R*C;i++)if(g[i]===-1&&st[i]!==2){st[i]=2;flags++}upd()}}
function lose(hit){over=true;clearInterval(timer);$('face').textContent='😵';$('msg').textContent='مین! دوباره امتحان کن 💥';snd(110,.5,'sawtooth',.25);if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}
  for(var i=0;i<R*C;i++)if(g[i]===-1&&st[i]!==2)st[i]=1;window._hit=hit;upd()}
function upd(){
  var cs=$('bd').children;
  for(var i=0;i<R*C;i++){
    var e=cs[i],s=st[i],cl='c';
    if(s===1){cl+=' o';if(g[i]===-1)cl+=' m'+(window._hit===i?' x':'');else if(g[i]>0)cl+=' n'+g[i]}
    else if(s===2)cl+=' f';
    e.className=cl;
    e.textContent=(s===1&&g[i]===-1)?'💣':(s===1&&g[i]>0?g[i]:'');
  }
  $('mc').textContent='💣 '+(M-flags);
}
$('lv').onchange=init;$('new').onclick=init;$('face').onclick=init;
$('tg').onclick=function(){flagMode=false;$('tg').classList.add('on');$('tf').classList.remove('on')};
$('tf').onclick=function(){flagMode=true;$('tf').classList.add('on');$('tg').classList.remove('on')};
addEventListener('resize',size);
window._hit=-1;init();
})();
</script>
<script>
/* S Loop — پخش موسیقی پس‌زمینه (فقط وقتی بازی مستقل باز شده؛ داخل index موسیقی از خود صفحه‌ی اصلی پخش می‌شود) */
(function(){
  if(window.top!==window) return;
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

const SAVE=Object.assign({coins:0,stage:1,wOwn:['pistol'],w:'pistol',sOwn:['classic'],sk:'classic',map:'auto'},LS.g('mg-save',{}));const sv=()=>LS.s('mg-save',SAVE);

let W=360,H=640,S=1,ox=0,oy=0;function fit(){const D=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*D;cv.height=innerHeight*D;S=Math.min(innerWidth/360,innerHeight/640);ox=(innerWidth-360*S)/2;oy=(innerHeight-640*S)/2;x.setTransform(D*S,0,0,D*S,D*ox,D*oy)}fit();addEventListener('resize',fit);
let st='menu',cols=[],en=[],bs=[],fx=[],pl={x:62,y:430},ammo=0,t=0,last=0,burstQ=0,burstT=0,flash=0,shots=0,kills=0,earned=0,stars=[];
const gun=()=>({x:pl.x+12,y:pl.y-46});
const ang=()=>Math.sin(t*(2.3+Math.min(1.3,SAVE.stage*.04)))*.95;
function gen(){const stg=SAVE.stage,n=Math.min(7,1+Math.floor((stg+1)/2));for(let tries=0;tries<300;tries++){
  pl.y=380+Math.random()*80;cols=[];for(let k=0;k<4;k++)cols.push({x:122+k*58,w:58,y:Math.max(260,Math.min(560,(cols[k-1]?cols[k-1].y:pl.y-10)+(Math.random()-.5)*130))});
  const types=['grunt'];if(stg>=3)types.push('soldier');if(stg>=4)types.push('runner');if(stg>=5)types.push('shield');if(stg>=6)types.push('drone');if(stg>=7)types.push('heavy');
  en=[];const cnt={};for(let i=0;i<n;i++){const ci=Math.random()*4|0;if((cnt[ci]||0)>=2)continue;cnt[ci]=(cnt[ci]||0)+1;const c=cols[ci],ty=types[Math.random()*types.length|0];en.push(mkE(ty,c,cnt[ci]))}

function mkE(ty,c,idx){const o=idx===2?-14:6,base={ty,c,x:c.x+c.w/2+(idx===1?(Math.random()<.5?-8:8):o),y:c.y,w:22,h:30,hp:1,t:Math.random()*6,dir:1};
  if(ty==='soldier')base.hp=2;if(ty==='heavy')base.hp=4;if(ty==='shield')base.hp=2;if(ty==='drone'){base.y=c.y-60-Math.random()*40;base.hp=1;base.w=26;base.h=18;base.by=base.y}
  if(ty==='boss'){base.hp=8+SAVE.stage;base.mh=base.hp;base.w=40;base.h=54;base.x=c.x+c.w/2}return base}
function parts(e){const h=e.ty==='boss'?22:e.ty==='drone'?0:14;if(e.ty==='drone')return{head:{x:e.x-13,y:e.y-9,w:26,h:18},body:null};return{head:{x:e.x-e.w/2+1,y:e.y-e.h,w:e.w-2,h:h},body:{x:e.x-e.w/2,y:e.y-e.h+h,w:e.w,h:e.h-h}}}
function los(e){const g={x:pl.x+12,y:pl.y-46};const p=parts(e),hx=p.head.x+p.head.w/2,hy=p.head.y+p.head.h/2,a=Math.atan2(hy-g.y,hx-g.x);if(Math.abs(a)>.9)return false;
  for(let s=0;s<1;s+=.01){const px=g.x+(hx-g.x)*s,py=g.y+(hy-g.y)*s;for(const c of cols){if(px>c.x&&px<c.x+c.w&&py>c.y&&!(e.c===c&&px>e.x-12))return false}}return true}
function fire(){if(st!=='play'||ammo<=0||burstQ>0)return;const wp=WP.find(w=>w.id===SAVE.w);ammo--;shots++;flash=.08;ui();beep(wp.pel?120:wp.exp?90:wp.id==='laser'?900:wp.id==='sniper'?200:420,.1,'sawtooth',.06);if(wp.burst){burstQ=wp.burst;burstT=0}else spawn(wp)}
function spawn(wp){const g=gun(),a=ang();const n=wp.pel||1;for(let i=0;i<n;i++){const aa=a+(n>1?(i-(n-1)/2)*wp.spr:0);bs.push({x:g.x+Math.cos(a)*26,y:g.y+Math.sin(a)*26,vx:Math.cos(aa)*wp.sp,vy:Math.sin(aa)*wp.sp,d:wp.dmg,pierce:wp.pierce,exp:wp.exp,life:wp.life||2,hit:new Set(),laser:wp.id==='laser'})}}
function dmg(e,part,b){if(e.ty==='barrel'){explode(e.x,e.y-10,60,2);e.hp=0;return true}
  let d=b.d;const head=part==='head';if(head)d*=2;if(e.ty==='shield'&&part==='body'&&!b.pierce&&!b.exp){beep(900,.04);fx.push({k:'sp',x:b.x,y:b.y,t:.2});return true}
  e.hp-=d;e.hit=.12;if(e.hp<=0){kills++;const c=(e.ty==='boss'?60:5)+(head?5:0);earned+=c;fx.push({k:'txt',x:e.x,y:e.y-e.h,t:.9,s:'+'+c+(head?' HEAD!':'')});for(let i=0;i<10;i++)fx.push({k:'p',x:e.x,y:e.y-e.h/2,vx:(Math.random()-.5)*220,vy:-Math.random()*220,t:.7,c:e.ty==='boss'?'#ab47bc':'#e57373'});beep(300,.15,'triangle',.08)}return true}
function explode(ex,ey,r,d){fx.push({k:'ex',x:ex,y:ey,t:.4,r});beep(80,.4,'sawtooth',.12);en.forEach(e=>{if(e.hp>0&&Math.hypot(e.x-ex,e.y-e.h/2-ey)<r+e.w/2){if(e.ty==='barrel'){e.hp=0;setTimeout(()=>explode(e.x,e.y-10,60,2),120)}else{e.hp-=d*2;e.hit=.15;if(e.hp<=0){kills++;earned+=5;fx.push({k:'txt',x:e.x,y:e.y-e.h,t:.9,s:'+5'})}}}})}
function step(dt){t+=dt;if(flash>0)flash-=dt;
  if(burstQ>0){burstT-=dt;if(burstT<=0){spawn(WP.find(w=>w.id===SAVE.w));burstQ--;burstT=.09}}
  en.forEach(e=>{if(e.hit>0)e.hit-=dt;e.t+=dt;if(e.ty==='runner'){e.x+=e.dir*45*dt;if(e.x>e.c.x+e.c.w-10)e.dir=-1;if(e.x<e.c.x+10)e.dir=1}if(e.ty==='drone'){e.y=e.by+Math.sin(e.t*2)*26}});
  for(const b of bs){const sub=Math.ceil(Math.hypot(b.vx,b.vy)*dt/6);for(let s=0;s<sub&&b.life>0;s++){b.x+=b.vx*dt/sub;b.y+=b.vy*dt/sub;
      if(b.x>370||b.y<-20||b.y>660){b.life=0;break}
      let stop=false;for(const c of cols)if(b.x>c.x&&b.x<c.x+c.w&&b.y>c.y){if(b.exp)explode(b.x,b.y,b.exp,b.d);b.life=0;stop=true;break}if(stop)break;
      for(const e of en){if(e.hp<=0||b.hit.has(e))continue;const p=parts(e);let part=null;
        if(p.head&&b.x>p.head.x&&b.x<p.head.x+p.head.w&&b.y>p.head.y&&b.y<p.head.y+p.head.h)part='head';else if(p.body&&b.x>p.body.x&&b.x<p.body.x+p.body.w&&b.y>p.body.y&&b.y<p.body.y+p.body.h)part='body';
        if(e.ty==='shield'&&!part&&b.x>e.x-18&&b.x<e.x-8&&b.y>e.y-24&&b.y<e.y){part='body'}

function win(){st='win';const bonus=20+SAVE.stage*2+ammo*3;SAVE.coins+=earned+bonus;SAVE.stage++;sv();beep(660,.2,'triangle');setTimeout(()=>beep(990,.3,'triangle'),180);ov('<h2>🏆 مرحله تمام شد!</h2><p>+'+(earned+bonus)+' سکه (پاداش گلوله‌ی باقی‌مانده: '+(ammo*3)+')</p><button id="nx">مرحله‌ی بعد</button><button class="s" id="sp">🛒 فروشگاه</button>');$('nx').onclick=()=>gen_();$('sp').onclick=shop}

function menu(){st='menu';ov('<h2>🔫 Mr Gun Advanced</h2><p>انگشتت را بزن تا شلیک شود؛ زاویه‌ی لوله مدام بالا و پایین می‌رود.<br>شلیک به <b>سر</b> دو برابر آسیب می‌زند. بشکه‌های قرمز منفجر می‌شوند!<br>مرحله‌ی فعلی: '+SAVE.stage+' · سکه: '+SAVE.coins+'</p><button id="pl">▶ شروع</button><button class="s" id="sp">🛒 فروشگاه (اسلحه، اسکین، مپ)</button>');$('pl').onclick=gen_;$('sp').onclick=shop}

    const col={grunt:'#e53935',soldier:'#6d4c41',shield:'#5e35b1',heavy:'#37474f',runner:'#fb8c00',drone:'#78909c',boss:'#8e24aa'}[e.ty],fl=e.hit>0;

    const w=e.w,h=e.h,hh=e.ty==='boss'?22:14;x.fillStyle=fl?'#fff':col;x.fillRect(e.x-w/2,e.y-h+hh,w,h-hh);x.fillStyle=fl?'#fff':'#ffe0b2';x.fillRect(e.x-w/2+1,e.y-h,w-2,hh);

    if(e.ty==='boss'){x.fillStyle='#0008';x.fillRect(e.x-24,e.y-h-14,48,5);x.fillStyle='#f44336';x.fillRect(e.x-24,e.y-h-14,48*e.hp/e.mh,5)}});

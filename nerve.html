<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Nerve Meter</title>
<style>*{margin:0;box-sizing:border-box}body{background:#10182b;color:#fff;font-family:system-ui,sans-serif;text-align:center;touch-action:none;overflow:hidden}
a.b{position:fixed;top:6px;left:6px;background:#0008;color:#fff;padding:5px 10px;border-radius:10px;text-decoration:none;z-index:5}#h{padding:12px;font-weight:700;min-height:44px}canvas{display:block;margin:0 auto;max-width:100vw;max-height:70vh;touch-action:none}
#g{position:fixed;bottom:0;left:0;right:0;padding:8px}#bar{height:14px;border-radius:7px;background:#fff2;overflow:hidden;max-width:420px;margin:4px auto}#bar i{display:block;height:100%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336);width:0}
button{background:#7cf;border:0;padding:10px 22px;border-radius:12px;font-weight:800;margin:4px}</style></head><body>
<a class="b" href="index.html">←</a><div id="h"></div><canvas id="c" width="360" height="480"></canvas><div id="g"><div id="bar"><i id="bi"></i></div><button id="r"></button></div>
<script>
function slRec(id,s,low){try{s=+s;if(!(s>0))return;const o=JSON.parse(localStorage.getItem('sl-lb-mine')||'{}'),c=o[id];if(!c||(low?s<c.s:s>c.s)){o[id]={s};localStorage.setItem('sl-lb-mine',JSON.stringify(o))}}catch(e){}}
const lg=localStorage.getItem('sl-lang')==='en'?'en':'fa',t=(e,f)=>lg==='en'?e:f;
const c=document.getElementById('c'),x=c.getContext('2d'),h=document.getElementById('h'),bi=document.getElementById('bi');
let lvl=1,path,hw,st='idle',hits=0,stress=0,last=null,jit=0,n=0,t0=0,pt={x:0,y:0},inside=false;
function mk(){path=[];const A=40+lvl*4,F=2+lvl*.5,ph=Math.random()*6;for(let i=0;i<=120;i++){const u=i/120;path.push({x:180+Math.sin(u*F*Math.PI*2+ph)*A*(1+u),y:50+u*380})}hw=Math.max(9,26-lvl*3);st='idle';hits=0;stress=0;jit=0;n=0;h.textContent=t('Level '+lvl+': press the green circle, then follow the path without touching the edges','مرحله '+lvl+': روی دایره‌ی سبز بزن و بدون برخورد به لبه‌ها مسیر را برو');draw()}
function dist(p){let m=1e9;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],dx=b.x-a.x,dy=b.y-a.y;let u=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy);u=Math.max(0,Math.min(1,u));m=Math.min(m,Math.hypot(p.x-a.x-u*dx,p.y-a.y-u*dy))}return m}
function draw(){x.fillStyle='#10182b';x.fillRect(0,0,360,480);x.lineCap=x.lineJoin='round';x.strokeStyle=inside||st==='fail'?'#f44':'#3a4a7a';x.lineWidth=hw*2+6;pathLine();x.strokeStyle='#18233f';x.lineWidth=hw*2-2;pathLine();
 x.fillStyle='#4caf50';x.beginPath();x.arc(path[0].x,path[0].y,hw*.9,0,7);x.fill();x.fillStyle='#ffd54f';x.beginPath();x.arc(path[120].x,path[120].y,hw*.9,0,7);x.fill();
 if(st==='run'){x.fillStyle='#fff';x.beginPath();x.arc(pt.x,pt.y,6,0,7);x.fill()}}
function pathLine(){x.beginPath();path.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}
function pos(e){const r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*360/r.width,y:(q.clientY-r.top)*480/r.height}}
function dn(e){e.preventDefault();const p=pos(e);if(st==='idle'&&Math.hypot(p.x-path[0].x,p.y-path[0].y)<hw*1.6){st='run';t0=Date.now();last=p;pt=p;hits=0;h.textContent=t('Stay calm…','آرام باش…')}}
function mvv(e){if(st!=='run')return;e.preventDefault();const p=pos(e);pt=p;const d=Math.hypot(p.x-last.x,p.y-last.y);jit+=d>0?Math.abs(d-Math.hypot(last.x-(last.px||last.x),last.y-(last.py||last.y)))*.2:0;n++;p.px=last.x;p.py=last.y;last=p;
 inside=dist(p)>hw;if(inside){stress=Math.min(100,stress+3);hits++;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}else stress=Math.max(0,stress-.4);bi.style.width=stress+'%';
 if(stress>=100){st='fail';h.textContent=t('💥 Nerves broke! Try again.','💥 اعصابت خرد شد! دوباره.');draw();return}
 if(Math.hypot(p.x-path[120].x,p.y-path[120].y)<hw*1.2&&p.y>400)fin();draw()}
function up(){if(st==='run'){st='idle';h.textContent=t('You lifted your finger. Start again.','انگشتت را برداشتی. دوباره شروع کن.');stress=0;bi.style.width=0;draw()}}
function fin(){st='done';const sec=(Date.now()-t0)/1000,sc=Math.max(0,Math.round(100-hits*1.5-jit/Math.max(n,1)*3));slRec('nerve',sc);const r=sc>85?t('🧊 Nerves of steel','🧊 اعصاب فولادی'):sc>60?t('😌 Calm','😌 آرام'):sc>35?t('😬 A bit shaky','😬 کمی لرزان'):t('🤯 Very jumpy','🤯 خیلی عصبی');
 h.innerHTML=`${r}<br>${t('Nerve score','امتیاز اعصاب')}: ${sc}/100 · ${sec.toFixed(1)}s · ${t('Touches','برخورد')}: ${hits}`;lvl++;draw()}
['mousedown','touchstart'].forEach(k=>c.addEventListener(k,dn,{passive:false}));['mousemove','touchmove'].forEach(k=>c.addEventListener(k,mvv,{passive:false}));['mouseup','touchend','touchcancel'].forEach(k=>c.addEventListener(k,up));
const r=document.getElementById('r');r.textContent=t('New path','مسیر جدید');r.onclick=()=>{if(st==='fail')lvl=Math.max(1,lvl);bi.style.width=0;mk()};mk();
</script></body></html>

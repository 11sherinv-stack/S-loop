<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="Scream Hero — قهرمان را با صدایت کنترل کن، بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scream Hero</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d4a;overscroll-behavior:none}
body{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:56px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none}
.pad{direction:ltr;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;z-index:20}
.pad button{min-width:84px;height:70px;border-radius:18px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.4);color:#fff;font:600 15px Tahoma,sans-serif;touch-action:none;cursor:pointer;padding:0 10px}
.pad button.dn{background:rgba(255,255,255,.4)}
#pl{left:10px}#pr{right:10px}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,10,40,.84);color:#fff;text-align:center;padding:16px}
.ov h2{margin:0;font-size:1.8rem}.ov p{margin:0;line-height:1.9;max-width:430px}
.ov button{font:inherit;border:0;border-radius:12px;padding:12px 26px;background:#ffb300;color:#2a1c00;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sens{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);right:8px;z-index:20;display:flex;gap:4px;align-items:center;color:#fff;font:12px Tahoma,sans-serif}
.sens button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="index.html">&larr; S loop</a>
<div class="sens">🎤 <button id="sm" aria-label="کم کردن حساسیت">−</button><span id="sv">۵</span><button id="sp" aria-label="زیاد کردن حساسیت">+</button></div>
<div class="pad" id="pl"><button id="bW">🗣 راه برو<br><small>نگه دار</small></button></div>
<div class="pad" id="pr"><button id="bS">📢 فریاد<br><small>نگه دار و رها کن</small></button></div>
<div class="ov" id="ov"><h2 id="oh">📢 Scream Hero</h2><p id="op">قهرمان را با صدایت کنترل کن!<br>با صدای معمولی راه می‌رود و با فریاد بلندتر می‌پرد؛ هرچه بلندتر، پرش بلندتر.<br>مانع‌ها و چاله‌ها را رد کن و به پرچم برس.<br><small>اگر میکروفن نداری از دکمه‌های پایین استفاده کن.</small></p><div class="row"><button id="ob">🎤 شروع با میکروفن</button><button id="ob2">🔘 شروع با دکمه‌ها</button></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const GV=(m=>m?Math.min(1,+m[1]/100):.8)(location.hash.match(/v(\d+)/));
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let au;function ac(){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state==='suspended')au.resume()}catch(e){}return au}
function beep(f,d=.06,ty='square',v=.05){try{const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*GV;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
const GRAV=1800,STAGES=5;
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function gen(stage){
  const R=rng(stage*977+5),rnd=(a,b)=>a+R()*(b-a);const segs=[],obs=[],coins=[];let xx=0;
  segs.push({x:-200,w:520});xx=320;
  const n=7+stage*2;let prevGap=false;
  for(let k=0;k<n;k++){
    const gap=k%3===1?rnd(60,70+stage*18):0; // چاله
    xx+=gap;const w=rnd(280,430);segs.push({x:xx,w});
    if(!gap&&!prevGap&&k>0)obs.push({x:xx+w*.5,w:28,h:rnd(26,34+stage*8),t:R()<.3?'wall':'spike'});
    prevGap=gap>0;
    for(let c=0;c<3;c++)coins.push({x:xx+60+c*40,y:-80-Math.sin(c)*20,got:false});
    xx+=w;
  }
  segs.push({x:xx,w:380});obs.push({x:xx+280,flag:true,w:30,h:90});
  return{segs,obs:obs.filter(o=>!(o.t==='wall'&&o.h>70)),coins,end:xx+280};
}
let stage=0,L,hero,vol=0,volRaw=0,floor=.02,sens=5,stream=null,an=null,buf=null,micOn=false,state='menu',cam=0,deaths=0,msg='',msgT=0,btnW=false,btnS=false,chargeT=0,fakeV=0,fakeT=0,score=0,best=0,tm=0,jumpCd=0,jArm=0,jPeak=0;
try{best=+localStorage.getItem('sl-scream-best')||0;sens=+localStorage.getItem('sl-scream-sens')||5}catch(e){}
$('sv').textContent=fa(sens);
function load(s){stage=s;L=gen(s);hero={x:40,y:-40,vx:0,vy:0,on:true,w:26,h:40,face:1};cam=0;score=score||0}
function respawn(){deaths++;hero.x=Math.max(40,hero.x-200);hero.y=-60;hero.vx=hero.vy=0;beep(140,.3,'sawtooth',.08);say('دوباره!')}
function say(t){msg=t;msgT=1.5}
async function startMic(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ac();const src=c.createMediaStreamSource(stream);an=c.createAnalyser();an.fftSize=1024;src.connect(an);buf=new Float32Array(an.fftSize);micOn=true;return true;
  }catch(e){return false}
}
function readMic(){
  if(!micOn||!an)return 0;an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const rms=Math.sqrt(s/buf.length);
  floor=Math.min(floor*1.0005,Math.max(.004,rms));
  return Math.max(0,Math.min(1,(rms-floor*1.4)*(sens*3)));
}
function inputVol(dt){
  let v=readMic();
  if(btnW)v=Math.max(v,.32);
  if(btnS){chargeT=Math.min(1,chargeT+dt/.6)}
  vol+=(Math.max(v,fakeV)-vol)*Math.min(1,18*dt);
  return vol;
}
function step(dt){
  tm+=dt;if(state!=='play'){return}
  fakeT=Math.max(0,fakeT-dt);if(fakeT===0)fakeV=0;jumpCd=Math.max(0,jumpCd-dt);
  const v=inputVol(dt);
  // حرکت
  const walk=v>.12?Math.min(1,(v-.1)/.5):0;
  const tgt=walk*250;hero.vx+=(tgt-hero.vx)*Math.min(1,(hero.on?10:3)*dt);
  // پرش با فریاد
  if(hero.on&&jumpCd<=0&&jArm<=0&&v>.5){jArm=.1;jPeak=v}
  if(jArm>0){jPeak=Math.max(jPeak,v);jArm-=dt;if(jArm<=0&&hero.on){hero.vy=-(420+Math.min(1,(jPeak-.5)/.5)*340);hero.on=false;jumpCd=.35;beep(500+jPeak*400,.1,'triangle',.07)}}
  hero.vy=Math.min(1000,hero.vy+GRAV*dt);
  hero.x+=hero.vx*dt;
  // برخورد با موانع جانبی
  for(const o of L.obs){
    if(o.flag){if(hero.x+hero.w>o.x&&hero.x<o.x+o.w){win();return}continue}
    if(hero.x+hero.w>o.x+3&&hero.x<o.x+o.w-3&&hero.y>-o.h+4){respawn();return}
  }
  hero.y+=hero.vy*dt;hero.on=false;
  let over=false;for(const sg of L.segs){if(hero.x+hero.w*.7>sg.x&&hero.x+hero.w*.3<sg.x+sg.w){over=true;if(hero.y>=0&&hero.y-hero.vy*dt<=6){hero.y=0;hero.vy=0;hero.on=true}}}
  if(hero.y>500){respawn();return}
  L.coins.forEach(c=>{if(!c.got&&Math.abs(c.x-(hero.x+13))<24&&Math.abs(c.y-(hero.y-20))<34){c.got=true;score+=10;beep(1000,.05,'triangle',.05)}});
  cam+=((hero.x-innerWidth*.3)-cam)*Math.min(1,6*dt);msgT=Math.max(0,msgT-dt);
}
function releaseS(){if(chargeT>.05){fakeV=.55+chargeT*.45;fakeT=.12}chargeT=0}
function win(){
  beep(880,.2);
  if(stage+1<STAGES){say('مرحله‌ی '+fa(stage+2));load(stage+1)}
  else{state='over';if(score>best){best=score;try{localStorage.setItem('sl-scream-best',best)}catch(e){}}show('🏆 قهرمان شدی!','امتیاز: '+fa(score)+' · بهترین: '+fa(best),'دوباره')}
}
function show(h,p,b){$('oh').textContent=h;$('op').innerHTML=p;$('ob').textContent=micOn?'🎤 '+b:'🎤 شروع با میکروفن';$('ob2').textContent='🔘 '+b+' با دکمه‌ها';$('ov').style.display='flex'}
/* رسم */
function sc(){return Math.max(.7,Math.min(1.3,innerHeight/520))}
function draw(){
  const W=innerWidth,H=innerHeight,s=sc(),gy=H*.72;
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1d4a');g.addColorStop(.6,'#8b4f9e');g.addColorStop(1,'#f08a5d');x.setTransform(1,0,0,1,0,0);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<10;i++){const bx=((i*230-cam*.3*s)%(W+300)+W+300)%(W+300)-150;x.fillRect(bx,gy-70-(i*37)%90,90,200)}
  x.setTransform(s,0,0,s,-cam*s,gy);
  if(!L)return;
  L.segs.forEach(sg=>{x.fillStyle='#4a2f6b';x.fillRect(sg.x,0,sg.w,600);x.fillStyle='#7bd36b';x.fillRect(sg.x,0,sg.w,10);x.fillStyle='#5aa84e';x.fillRect(sg.x,10,sg.w,5)});
  L.obs.forEach(o=>{
    if(o.flag){x.fillStyle='#ddd';x.fillRect(o.x,-o.h,4,o.h);x.fillStyle='#ffd600';x.beginPath();x.moveTo(o.x+4,-o.h);x.lineTo(o.x+34,-o.h+12);x.lineTo(o.x+4,-o.h+24);x.fill();return}
    if(o.t==='spike'){x.fillStyle='#ccc';const n=Math.max(1,Math.round(o.w/14));for(let i=0;i<n;i++){x.beginPath();x.moveTo(o.x+i*o.w/n,0);x.lineTo(o.x+(i+.5)*o.w/n,-o.h);x.lineTo(o.x+(i+1)*o.w/n,0);x.fill()}}
    else{x.fillStyle='#b5651d';x.fillRect(o.x,-o.h,o.w,o.h);x.fillStyle='rgba(255,255,255,.2)';x.fillRect(o.x,-o.h,o.w,4)}
  });
  L.coins.forEach(c=>{if(!c.got){x.fillStyle='#ffd600';x.beginPath();x.arc(c.x,c.y,8,0,7);x.fill()}});
  // قهرمان
  const h=hero,cx=h.x+h.w/2,by=h.y;
  x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(cx,2,13,4,0,0,7);x.fill();
  const lg=Math.sin(tm*18)*5*(h.on&&h.vx>20?1:0);
  x.fillStyle='#1a237e';x.fillRect(cx-9+lg,by-16,7,16);x.fillRect(cx+2-lg,by-16,7,16);
  x.fillStyle='#e53935';x.fillRect(cx-11,by-32,22,18);x.fillStyle='#ffd600';x.fillRect(cx-3,by-28,6,8);
  x.fillStyle='#e53935';x.fillRect(cx-16,by-30,6,12);x.fillRect(cx+10,by-30,6,12);
  x.fillStyle='#f6c28b';x.fillRect(cx-9,by-48,18,16);
  x.fillStyle='#e53935';x.fillRect(cx-10,by-52,20,7);
  x.fillStyle='#222';x.fillRect(cx+1,by-44,3,4);x.fillRect(cx+6,by-44,3,4);
  const mo=Math.min(1,vol*1.6);x.fillStyle='#7a1010';x.beginPath();x.ellipse(cx+4,by-35,3+mo*3,1+mo*5,0,0,7);x.fill();
  if(vol>.2){x.strokeStyle='rgba(255,255,255,'+Math.min(.8,vol)+')';x.lineWidth=2;for(let i=1;i<=3;i++){x.beginPath();x.arc(cx+12,by-36,6+i*7*vol,-.7,.7);x.stroke()}}
  x.setTransform(1,0,0,1,0,0);
  // نوار صدا
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,34);x.fillStyle='#fff';x.font='bold 14px Tahoma,sans-serif';x.textBaseline='middle';x.textAlign='right';x.fillText('مرحله '+fa(stage+1)+'/'+fa(STAGES)+' · امتیاز '+fa(score),W-10,17);
  x.textAlign='left';x.fillText('💀 '+fa(deaths),104,17);
  x.fillStyle='rgba(255,255,255,.2)';x.fillRect(W/2-70,12,140,10);const vv=Math.min(1,vol);x.fillStyle=vv>.55?'#ff5252':vv>.12?'#7ed957':'#9ccc4f';x.fillRect(W/2-70,12,140*vv,10);x.fillStyle='rgba(255,255,255,.7)';x.fillRect(W/2-70+140*.55,9,2,16);
  if(btnS&&chargeT>0){x.fillStyle='rgba(255,200,0,.9)';x.fillRect(W-120,H-100,100*chargeT,8)}
  if(msgT>0){x.globalAlpha=Math.min(1,msgT);x.textAlign='center';x.font='bold 22px Tahoma,sans-serif';x.fillStyle='#fff';x.fillText(msg,W/2,H*.25);x.globalAlpha=1}
}
function hold(id,on,off){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();ac();on();b.classList.add('dn');try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{if(b.classList.contains('dn'))off();b.classList.remove('dn')}))}
hold('bW',()=>btnW=true,()=>btnW=false);hold('bS',()=>{btnS=true;chargeT=0},()=>{btnS=false;releaseS()});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')btnW=true;if((e.key===' '||e.key==='ArrowUp')&&!btnS){btnS=true;chargeT=0;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key==='d')btnW=false;if((e.key===' '||e.key==='ArrowUp')&&btnS){btnS=false;releaseS()}});
function begin(){$('ov').style.display='none';score=0;deaths=0;load(0);state='play'}
$('ob').onclick=async()=>{ac();if(!micOn){const ok=await startMic();if(!ok){alert('اجازه‌ی میکروفن داده نشد؛ با دکمه‌ها بازی کن.');return}}begin()};
$('ob2').onclick=()=>{ac();begin()};
function setSens(d){sens=Math.max(1,Math.min(10,sens+d));$('sv').textContent=fa(sens);try{localStorage.setItem('sl-scream-sens',sens)}catch(e){}}
$('sm').onclick=()=>setSens(-1);$('sp').onclick=()=>setSens(1);
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',resize);resize();
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}
load(0);requestAnimationFrame(loop);
window.__sh={step,load,gen,get hero(){return hero},get L(){return L},get stage(){return stage},set vol(v){fakeV=v;fakeT=9},begin,get state(){return state},STAGES};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Speed Ball Catch Up</title>
<style>body{margin:0;background:#101820;color:#fff;font:15px system-ui;text-align:center;touch-action:none}canvas{display:block;margin:auto;max-width:100%}button,a{background:#2d8f6f;color:#fff;border:0;border-radius:10px;padding:9px 14px;margin:3px;text-decoration:none;display:inline-block;font:inherit}</style>
<p><a href="index.html" onclick="if(parent!==window){parent.postMessage('sl-close','*');return false}">← S loop</a> <b>Speed Ball Catch Up</b></p>
<canvas id=c width=360 height=520></canvas>
<p>چپ/راست بزن تا خط عوض شود · سبز = سرعت، قرمز = کند · به توپ جلویی برس</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let pl,px,z,v,lz,t,ob,nz,st;
function init(){pl=1;px=180;z=0;v=7.5;lz=520;t=0;ob=[];nz=300;st=1}
function ball(X,Y,r,k){const g=x.createRadialGradient(X-r/3,Y-r/3,r/6,X,Y,r);g.addColorStop(0,'#fff');g.addColorStop(1,k);x.fillStyle=g;x.beginPath();x.arc(X,Y,r,0,7);x.fill()}
const go=d=>{if(st!=1){init();return}pl=Math.max(0,Math.min(2,pl+d))};
c.onpointerdown=e=>{const b=c.getBoundingClientRect();go(e.clientX-b.left<b.width/2?-1:1)};
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(-1);if(e.key=='ArrowRight')go(1)});
init();(function f(){if(st==1){t+=1/60;lz+=6+Math.min(5,t*.08);z+=v;v+=(7.5-v)*.012;px+=(90+pl*90-px)*.25;
while(nz<z+1100){ob.push({l:Math.random()*3|0,z:nz,b:Math.random()<.4});nz+=110+Math.random()*90}
ob=ob.filter(o=>o.z>z-60);ob.forEach(o=>{if(!o.h&&o.l==pl&&Math.abs(o.z-z)<20){o.h=1;if(o.b)v=Math.min(17,v+5);else v=2.5}});
if(lz-z<=0)st=2;if(lz-z>1100)st=3}
const Y=q=>470-(q-z)*.45;x.fillStyle='#16222c';x.fillRect(0,0,360,520);x.fillStyle='#1d2f3d';x.fillRect(45,0,270,520);
x.strokeStyle='#3d5a70';x.setLineDash([20,20]);x.lineDashOffset=z*.45;x.lineWidth=3;[135,225].forEach(a=>{x.beginPath();x.moveTo(a,0);x.lineTo(a,520);x.stroke()});x.setLineDash([]);
ob.forEach(o=>{const y=Y(o.z);if(o.h||y<-20)return;x.fillStyle=o.b?'#2ecc71':'#e74c3c';x.fillRect(90+o.l*90-22,y-10,44,20);x.fillStyle='#fff';x.font='16px sans-serif';x.textAlign='center';x.fillText(o.b?'»':'✕',90+o.l*90,y+6)});
const ly=Y(lz),lx=180+Math.sin(t*1.3)*90;ball(lx,Math.max(30,ly),20,'#e74c3c');if(ly<30){x.fillStyle='#fff';x.fillText('▲',lx,16)}
ball(px,470,20,'#3498db');x.fillStyle='#fff';x.textAlign='left';x.font='14px system-ui';x.fillText('Gap '+Math.max(0,lz-z|0)+'  Speed '+(v*10|0),8,18);
if(st>1){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,200,360,110);x.fillStyle='#fff';x.textAlign='center';x.font='22px system-ui';x.fillText(st==2?'You caught up! '+t.toFixed(1)+'s':'Too far behind',180,250);x.font='14px system-ui';x.fillText('Tap to play again',180,282)}
requestAnimationFrame(f)})();
</script>

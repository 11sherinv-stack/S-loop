<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Speed Ball Catch Up 2</title>
<style>body{margin:0;background:#fff;color:#123;font:15px system-ui;text-align:center;touch-action:none;overscroll-behavior:none}canvas{display:block;margin:auto;max-width:100%;max-height:calc(100vh - 56px);touch-action:none}a{background:#00a2dd;color:#fff;border-radius:10px;padding:7px 12px;margin:6px;text-decoration:none;display:inline-block}</style>
<a href="index.html" onclick="if(parent!==window){parent.postMessage('sl-close','*');return false}">← S loop</a><b>Speed Ball Catch Up 2</b>
<canvas id=c width=360 height=560></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=560,A=.5,TW=300,CX=100,CY=440;
let pf,pl,v,lf,t,gems,lv=+(localStorage.getItem('sb2-lv')||1),ob,nf,st,dir=0;
function init(){pf=0;pl=TW/2;v=5;lf=700+lv*60;t=0;gems=0;ob=[];nf=260;st=1}
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const P=(f,l,z)=>[CX+((f-pf)+(l-pl))*A,CY+(-(f-pf)+(l-pl))*A*.5-z];
function poly(p,col){x.fillStyle=col;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill()}
function box(f0,f1,l0,l1,h,top,R,L){
  poly([P(f0,l1,0),P(f1,l1,0),P(f1,l1,h),P(f0,l1,h)],R);
  poly([P(f0,l0,0),P(f0,l1,0),P(f0,l1,h),P(f0,l0,h)],L);
  poly([P(f0,l0,h),P(f1,l0,h),P(f1,l1,h),P(f0,l1,h)],top)}
function ball(sx,sy,r,c1,c2){
  x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(sx-r*.7,sy+r*.35,r*1.25,r*.45,-.45,0,7);x.fill();
  const g=x.createRadialGradient(sx-r/3,sy-r*1.3,r/8,sx,sy-r,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  x.fillStyle=g;x.beginPath();x.arc(sx,sy-r,r,0,7);x.fill()}
function gem(sx,sy){
  x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.ellipse(sx,sy,14,5,0,0,7);x.fill();
  const b=Math.sin(t*4+sx)*2,y=sy-22+b;
  poly([[sx,y-12],[sx+12,y-4],[sx+12,y+5],[sx,y+13],[sx-12,y+5],[sx-12,y-4]],'#d81b3a');
  poly([[sx,y-12],[sx+12,y-4],[sx,y+1],[sx-12,y-4]],'#ff5a72');
  poly([[sx-12,y+5],[sx,y+13],[sx,y+1]],'#a50f2a')}
const go=d=>{if(st!=1){if(st==2){lv++}init();return}dir=d};
c.onpointerdown=e=>{const b=c.getBoundingClientRect();if(st!=1){go(0);return}dir=(e.clientX-b.left<b.width/2)?-1:1};
addEventListener('pointerup',()=>dir=0);addEventListener('pointercancel',()=>dir=0);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')dir=-1;if(e.key=='ArrowRight')dir=1;if(e.key==' '&&st!=1)go(0)});
addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))dir=0});
function step(){
  t+=1/60;lf+=Math.min(9,5.1+lv*.25+t*.03);
  pl=Math.max(16,Math.min(TW-16,pl+dir*4.5));pf+=v;v+=(5.6-v)*.012;
  while(nf<pf+640){const r=hash(nf);
    if(r<.55)ob.push({f:nf,l:10+hash(nf+9)*220,k:'c'});
    else{const b=40+hash(nf+3)*220;for(let i=0;i<3;i++)ob.push({f:nf+i*55,l:Math.max(24,Math.min(276,b+Math.sin(i*1.7)*34)),k:'g'})}
    nf+=170+hash(nf+1)*120}
  ob=ob.filter(o=>o.f>pf-220);
  for(const o of ob){if(o.d)continue;
    if(o.k=='g'){if(Math.abs(o.f-pf)<26&&Math.abs(o.l-pl)<26){o.d=1;gems++;v=Math.min(11,v+2.2)}}
    else if(Math.abs(o.f+25-pf)<42&&Math.abs(o.l+25-pl)<42&&pf<o.f+25){pf=o.f-17;v=Math.min(v,1.5)}}
  const gap=lf-pf;
  if(gap<=0){st=2;localStorage.setItem('sb2-lv',lv+1)}else if(gap>1400)st=3}
function draw(){
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  poly([P(pf-300,0,0),P(pf+800,0,0),P(pf+800,TW,0),P(pf-300,TW,0)],'#f3f8fb');
  x.strokeStyle='#e3ebf0';x.lineWidth=2;
  for(let f=Math.floor((pf-300)/120)*120;f<pf+800;f+=120){const a=P(f,0,0),b=P(f,TW,0);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
  const D=[];
  for(let i=Math.floor((pf-260)/80);i<(pf+700)/80;i++){
    const f0=i*80,h=hash(i)<.5?70+hash(i+5)*22:34+hash(i+2)*12;
    D.push({k:-(f0+40)-25,d:()=>box(f0,f0+80,-50,0,h,'#0a86b8','#00a2dd','#0a6f9e')});
    D.push({k:-(f0+40)+TW+7,d:()=>box(f0,f0+80,TW,TW+14,14,'#00f0f4','#00d6b8','#00b896')})}
  for(const o of ob){if(o.d)continue;
    if(o.k=='c')D.push({k:-(o.f+25)+o.l+25,d:()=>box(o.f,o.f+50,o.l,o.l+50,42,'#00f5e0','#00d7b2','#00b392')});
    else D.push({k:-o.f+o.l,d:()=>{const p=P(o.f,o.l,0);gem(p[0],p[1])}})}
  D.push({k:-pf+pl,d:()=>ball(CX,CY,17,'#5a5a5a','#0c0c0c')});
  const lane=TW/2+Math.sin(t*1.5)*90,lp=P(lf,lane,0);
  if(lp[0]<W+20)D.push({k:-lf+lane,d:()=>ball(lp[0],lp[1],17,'#ff8a80','#d50000')});
  D.sort((a,b)=>a.k-b.k).forEach(o=>o.d());
  if(lp[0]>=W-14){x.fillStyle='#d50000';x.beginPath();x.moveTo(W-8,Math.max(40,lp[1]));x.lineTo(W-26,Math.max(40,lp[1])-12);x.lineTo(W-26,Math.max(40,lp[1])+12);x.fill()}
  x.fillStyle='#123';x.font='bold 15px system-ui';x.textAlign='left';
  x.fillText('Gap '+Math.max(0,(lf-pf)|0)+'   💎 '+gems+'   Level '+lv,10,24);
  if(st>1){x.fillStyle='rgba(255,255,255,.88)';x.fillRect(0,200,W,130);x.fillStyle='#123';x.textAlign='center';x.font='bold 24px system-ui';
    x.fillText(st==2?'You caught up! ⏱ '+t.toFixed(1)+'s':'Too far behind',W/2,252);x.font='15px system-ui';x.fillText(st==2?'Tap for level '+(lv+1):'Tap to retry',W/2,288)}}
init();
(function f(){if(st==1)step();draw();requestAnimationFrame(f)})();
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="description" content="Subway Dash — دویدن بی‌پایان روی ریل‌ها، بازی آنلاین رایگان از مجموعه‌ی S loop">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Subway Dash</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101a2e;overscroll-behavior:none}
body{font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:56px;z-index:999;background:#586a2bd9;color:#f1f8d0;padding:4px 10px;border-radius:14px;font:12px sans-serif;text-decoration:none}
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,12,28,.82);color:#fff;text-align:center;padding:16px}
.ov h2{margin:0;font-size:1.8rem}.ov p{margin:0;line-height:1.9;max-width:420px}
.ov button{font:inherit;border:0;border-radius:12px;padding:12px 30px;background:#ffb300;color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="index.html">&larr; S loop</a>
<div class="ov" id="ov"><h2 id="oh">🚇 Subway Dash</h2><p id="op">روی ریل‌ها بدو، سکه جمع کن و از قطارها و مانع‌ها جا خالی بده!<br>کشیدن انگشت: ← → عوض کردن خط · ↑ پرش · ↓ سر خوردن<br><small>رایانه: کلیدهای جهت‌دار یا WASD</small></p><button id="ob">شروع</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const GV=(m=>m?Math.min(1,+m[1]/100):.8)(location.hash.match(/v(\d+)/));
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let au;function beep(f,d=.06,ty='square',v=.05){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state==='suspended')au.resume();const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v*GV;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
const LW=1.7,CAMY=2.1,CAMZ=-4.2,ROW=13;
let W,H,F,HZ;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;F=Math.min(W*1.05,H*.62);HZ=H*.36}
const P=(wx,wy,wz)=>{const z=wz-CAMZ;if(z<.25)return null;const s=F/z;return[W/2+wx*s,HZ+(CAMY-wy)*s,s]};
let st,ents,lane,tl,y,vy,slide,speed,dist,coins,best=0,state='menu',safe=1,nextZ,t=0,hit=0;
try{best=+localStorage.getItem('sl-subway-best')||0}catch(e){}
function reset(){lane=1;tl=1;y=0;vy=0;slide=0;speed=11;dist=0;coins=0;ents=[];safe=1;nextZ=26;hit=0;state='play';spawnTo(120)}
function spawnTo(z){
  while(nextZ<z){
    const r=Math.random(),row=[];
    const sf=Math.max(0,Math.min(2,safe+Math.floor(Math.random()*3)-1));
    if(dist<80||r<.25){ // سکه
      const l=Math.floor(Math.random()*3);for(let k=0;k<5;k++)row.push({t:'coin',l,z:nextZ+k*2,h:Math.random()<.2?1.5:.6});
    }else if(r<.5){ // مانع کوتاه (پرش)
      for(let l=0;l<3;l++)if(Math.random()<.55)row.push({t:'low',l,z:nextZ,len:.8});
      if(!row.length)row.push({t:'low',l:Math.floor(Math.random()*3),z:nextZ,len:.8});
    }else if(r<.68){ // نرده‌ی بالا (سر خوردن)
      for(let l=0;l<3;l++)row.push({t:'high',l,z:nextZ,len:.4});
    }else{ // قطار
      for(let l=0;l<3;l++)if(l!==sf&&Math.random()<.8)row.push({t:'train',l,z:nextZ,len:9+Math.random()*8,c:['#d94f4f','#3d7de0','#e0a526'][Math.floor(Math.random()*3)]});
      safe=sf;for(let k=0;k<3;k++)row.push({t:'coin',l:sf,z:nextZ+k*2.4,h:.6});
    }
    row.forEach(e=>ents.push(e));const ml=Math.max(0,...row.filter(e=>e.t==='train').map(e=>e.len));nextZ+=Math.max(ROW,ml+7)+Math.random()*4;
  }
}
function step(dt){
  t+=dt;if(state!=='play')return;
  speed=Math.min(30,11+dist/90);dist+=speed*dt;
  tl+=(lane-tl)*Math.min(1,14*dt);
  if(y>0||vy>0){vy-=34*dt;y+=vy*dt;if(y<=0){y=0;vy=0}}
  if(slide>0)slide-=dt;
  ents.forEach(e=>e.z-=speed*dt);
  ents=ents.filter(e=>e.z+(e.len||0)>-3);nextZ-=speed*dt;spawnTo(120);
  const px=lane;
  for(const e of ents){
    if(e.t==='coin'){if(e.l===lane&&Math.abs(e.z)<.8&&!e.got&&Math.abs((e.h||.6)-(y+.5))<1.1){e.got=true;coins++;beep(900+Math.min(600,coins*8),.05,'triangle',.05)}continue}
    if(e.l!==lane||e.z>.45||e.z+e.len<-.45)continue;
    if(e.t==='train'){crash();return}
    if(e.t==='low'&&y<.65){crash();return}
    if(e.t==='high'&&slide<=0){crash();return}
  }
  hit=Math.max(0,hit-dt);
}
function crash(){state='over';beep(120,.5,'sawtooth',.1);const sc=Math.floor(dist)+coins*10;if(sc>best){best=sc;try{localStorage.setItem('sl-subway-best',best)}catch(e){}}
  setTimeout(()=>{$('oh').textContent='💥 تصادف!';$('op').innerHTML='امتیاز: '+fa(sc)+' · سکه: '+fa(coins)+'<br>بهترین امتیاز: '+fa(best);$('ob').textContent='دوباره';$('ov').style.display='flex'},500)}
/* رسم */
function quad(a,b,c,d,col){if(!a||!b||!c||!d)return;x.fillStyle=col;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c[0],c[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill()}
function box(cx,w,h,z0,z1,col,dark,top){
  const x0=cx-w/2,x1=cx+w/2,fl=P(x0,0,z0),fr=P(x1,0,z0),tl=P(x0,h,z0),tr=P(x1,h,z0),bl=P(x0,h,z1),br=P(x1,h,z1);
  if(!fl)return;
  if(bl&&br)quad(tl,tr,br,bl,top);
  quad(fl,fr,tr,tl,col);
  x.fillStyle='rgba(0,0,0,.18)';if(tl&&tr&&fl&&fr){x.fillRect(tl[0],tl[1]+(fl[1]-tl[1])*.55,tr[0]-tl[0],(fl[1]-tl[1])*.12)}
}
function draw(){
  let g=x.createLinearGradient(0,0,0,HZ+20);g.addColorStop(0,'#1d2b57');g.addColorStop(1,'#f4a261');x.fillStyle=g;x.fillRect(0,0,W,HZ+20);
  // ساختمان‌های دور
  for(let i=0;i<14;i++){const bx=((i*97-dist*6)%(W+120)+W+120)%(W+120)-60,bh=40+(i*53)%90;x.fillStyle='rgba(18,22,48,.75)';x.fillRect(bx,HZ-bh,50,bh+6)}
  x.fillStyle='#262b3d';x.fillRect(0,HZ,W,H-HZ);
  // ریل
  const roadL=P(-3.2,0,-3.5),roadR=P(3.2,0,-3.5),farL=P(-3.2,0,110),farR=P(3.2,0,110);
  quad(roadL,roadR,farR,farL,'#3a3f52');
  for(let l=0;l<3;l++){const cx=(l-1)*LW;quad(P(cx-.7,0,-3.5),P(cx+.7,0,-3.5),P(cx+.7,0,110),P(cx-.7,0,110),'#4b5068')}
  // تراورس
  x.strokeStyle='rgba(20,22,32,.7)';for(let k=0;k<60;k++){const z=((k*2-dist%2)+0);const a=P(-2.7,0,z),b=P(2.7,0,z);if(!a||!b)continue;x.lineWidth=Math.max(1,a[2]*.07);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
  x.strokeStyle='#b9bdc9';for(let l=0;l<3;l++){const cx=(l-1)*LW;[-.45,.45].forEach(o=>{const a=P(cx+o,0,-3.5),b=P(cx+o,0,110);if(a&&b){x.lineWidth=2;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}})}
  // موجودیت‌ها دور → نزدیک
  const list=ents.filter(e=>e.z<115&&e.z+(e.len||0)>-3.5).sort((a,b)=>b.z-a.z);
  const drawP=()=>{ // بازیکن
    const cx=(tl-1)*LW,sl=slide>0,jy=y;const a=P(cx,jy,0),b=P(cx,jy+(sl?.7:1.5),0);if(!a||!b)return;
    const s=a[2],hgt=a[1]-b[1],w=s*.5;
    x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(a[0],P(cx,0,0)[1],w*.8,s*.08,0,0,7);x.fill();
    const ph=Math.sin(t*16)*.5;
    x.fillStyle='#283593';x.fillRect(a[0]-w*.35+ph*w*.2,a[1]-hgt*.4,w*.3,hgt*.4);x.fillRect(a[0]+w*.05-ph*w*.2,a[1]-hgt*.4,w*.3,hgt*.4);
    x.fillStyle='#ff5252';x.fillRect(a[0]-w*.5,a[1]-hgt*.78,w,hgt*.4);
    x.fillStyle='#f6c28b';x.fillRect(a[0]-w*.35,a[1]-hgt,w*.7,hgt*.24);
    x.fillStyle='#ffd23f';x.fillRect(a[0]-w*.4,a[1]-hgt*1.04,w*.8,hgt*.1);
  };
  let drewP=false;
  list.forEach(e=>{
    if(!drewP&&e.z<0){drawP();drewP=true}
    const cx=(e.l-1)*LW,fog=Math.max(0,Math.min(1,(e.z-60)/55));x.globalAlpha=1-fog*.8;
    if(e.t==='coin'){if(e.got){x.globalAlpha=1;return}const p=P(cx,e.h||.6,e.z);if(p){x.fillStyle='#ffd600';x.beginPath();x.ellipse(p[0],p[1],p[2]*.22*Math.abs(Math.cos(t*5+e.z)),p[2]*.22,0,0,7);x.fill();x.strokeStyle='#b8860b';x.lineWidth=1.5;x.stroke()}}
    else if(e.t==='train')box(cx,1.5,2.6,e.z,e.z+e.len,e.c,'#222',shadeC(e.c));
    else if(e.t==='low')box(cx,1.4,.7,e.z,e.z+e.len,'#ff7043','#222','#ffab91');
    else if(e.t==='high'){const a=P(cx-.8,1.05,e.z),b=P(cx+.8,1.05,e.z),c2=P(cx-.8,1.55,e.z),d=P(cx+.8,1.55,e.z);quad(a,b,d,c2,'#fdd835');x.fillStyle='#222';const p1=P(cx-.8,0,e.z),p2=P(cx+.8,0,e.z);if(p1&&c2){x.fillRect(c2[0]-2,c2[1],4,p1[1]-c2[1])}if(p2&&d)x.fillRect(d[0]-2,d[1],4,p2[1]-d[1])}
    x.globalAlpha=1;
  });
  if(!drewP)drawP();
  // HUD
  x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,0,W,34);x.fillStyle='#fff';x.font='bold 15px Tahoma,sans-serif';x.textBaseline='middle';
  x.textAlign='right';x.fillText('امتیاز '+fa(Math.floor(dist)+coins*10),W-10,17);x.textAlign='center';x.fillText('🪙 '+fa(coins),W/2,17);
  x.textAlign='left';x.fillText('بهترین '+fa(best),110,17);
}
function shadeC(c){const n=parseInt(c.slice(1),16);const f=v=>Math.min(255,Math.round(v*1.25));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
/* ورودی */
let sx0=0,sy0=0,sid=null;
cv.addEventListener('pointerdown',e=>{sid=e.pointerId;sx0=e.clientX;sy0=e.clientY});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){act(dx>0?'r':'l');sx0=e.clientX;sy0=e.clientY}
  else if(Math.abs(dy)>28){act(dy<0?'u':'d');sx0=e.clientX;sy0=e.clientY}});
cv.addEventListener('pointerup',()=>sid=null);cv.addEventListener('pointercancel',()=>sid=null);
function act(k){
  if(state!=='play')return;
  if(k==='l'&&lane>0){lane--;beep(300,.04)}else if(k==='r'&&lane<2){lane++;beep(340,.04)}
  else if(k==='u'&&y<=.01){vy=11.5;slide=0;beep(520,.08,'triangle')}
  else if(k==='d'){slide=.7;if(y>0)vy=-14;beep(200,.06)}
}
addEventListener('keydown',e=>{const m={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',' ':'u',ArrowDown:'d',s:'d'}[e.key.length===1?e.key.toLowerCase():e.key];if(m){act(m);e.preventDefault()}});
$('ob').onclick=()=>{$('ov').style.display='none';reset()};
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;step(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',fit);fit();ents=[];lane=1;tl=1;y=0;slide=0;dist=0;coins=0;requestAnimationFrame(loop);
window.__sd={reset,step,act,get ents(){return ents},get lane(){return lane},get state(){return state},get dist(){return dist},draw};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
</body>
</html>

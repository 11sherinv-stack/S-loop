<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Village Farm</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%;font-family:Tahoma,system-ui,sans-serif;color:#2b1d0e;background:#e7d7ae}
body{padding:0 0 70px;transition:background 2s}
body.n{background:#b9b2a0}
#sky{background:linear-gradient(#8fd3ff,#d9f0ff);padding:8px 12px;border-bottom:4px solid #6a8a3a;transition:background 2s}
body.n #sky{background:linear-gradient(#2b2f5c,#5b5f8f);color:#fff}
a.back{color:#5a3a12;text-decoration:none;font-size:14px}body.n a.back{color:#ffd}
#top{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:15px}
#top b{font-size:17px}
#tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#5a3a12;z-index:9}
#tabs button{flex:1;padding:12px 2px;border:0;background:none;color:#f5e6c4;font-size:14px}
#tabs button.on{background:#8a5a22;font-weight:700}
#main{padding:10px;max-width:560px;margin:auto}
.card{background:#fff8e3;border:2px solid #c9a96a;border-radius:12px;padding:10px;margin-bottom:10px}
h3{margin:2px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid #6b4423;background:#8a5a30;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;color:#fff}
.cell.ready{background:#b98a3a;animation:pl 1s infinite}.cell.dry{background:#9a7a55}
@keyframes pl{50%{transform:scale(1.05)}}
.cell small{font-size:11px;position:absolute;bottom:3px}
.bar{position:absolute;left:8%;right:8%;top:5px;height:5px;background:#0005;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#7ddc57}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
button.b{border:0;border-radius:9px;padding:8px 12px;background:#6aa84f;color:#fff;font-size:14px;font-weight:700}
button.b.o{background:#e69138}button.b.g{background:#999}button.b:active{filter:brightness(.85)}
button.sel{outline:3px solid #ffb300}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #d7c28d;font-size:15px}
#toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
#toast.on{opacity:1}
.sm{font-size:12px;color:#6b5230}
</style></head><body>
<div id="sky"><a class="back" href="index.html">← S loop</a><div id="top"></div></div>
<div id="main"></div>
<div id="toast"></div>
<div id="tabs"><button data-t="farm">🌾 مزرعه</button><button data-t="ani">🐄 دامداری</button><button data-t="mkt">🛒 بازار</button><button data-t="vil">🏡 روستا</button></div>
<script>
if(self!==top)document.querySelector('.back').style.display='none';
const $=id=>document.getElementById(id);
const CR={wheat:{n:'گندم',e:'🌾',c:5,t:30,p:12},carrot:{n:'هویج',e:'🥕',c:8,t:40,p:20},tomato:{n:'گوجه',e:'🍅',c:12,t:60,p:34},corn:{n:'ذرت',e:'🌽',c:15,t:70,p:44},melon:{n:'هندوانه',e:'🍉',c:25,t:120,p:90}};
const AN={chicken:{n:'مرغ',e:'🐔',c:40,t:25,o:'egg'},sheep:{n:'گوسفند',e:'🐑',c:120,t:50,o:'wool'},cow:{n:'گاو',e:'🐄',c:250,t:40,o:'milk'}};
const PR={egg:{n:'تخم‌مرغ',e:'🥚',p:8},wool:{n:'پشم',e:'🧶',p:40},milk:{n:'شیر',e:'🥛',p:30}};
const IT=k=>CR[k]||PR[k];
const SEA=[{n:'بهار',e:'🌸',f:1},{n:'تابستان',e:'☀️',f:1.2},{n:'پاییز',e:'🍂',f:.9},{n:'زمستان',e:'❄️',f:.4}];
const WHO=['رضا','مریم','حاج‌اکبر','زهرا','کدخدا','علی‌آقا','نسرین','پیرمرد دهکده'];
let S;try{S=JSON.parse(localStorage.vfarm)}catch(e){}
if(!S||!S.plots)S={coins:80,day:1,clock:0,seed:{wheat:4},feed:6,inv:{},plots:Array(6).fill(null),ani:[],orders:[],sel:'wheat',mk:{},rain:0,cap:6,tab:'farm',tip:0};
const season=()=>Math.floor((S.day-1)/10)%4;
const price=k=>Math.round(IT(k).p*(S.mk[k]||1));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)}
function newDay(){Object.keys({...CR,...PR}).forEach(k=>S.mk[k]=+(0.8+Math.random()*.5).toFixed(2));
 if(Math.random()<.18){S.rain=20;toast('🌧 باران می‌بارد؛ همه‌ی زمین‌ها آبیاری شد')}
 S.orders=S.orders.filter(o=>o.due>=S.day);
 while(S.orders.length<3){const ks=Object.keys({...CR,...PR}),k=ks[Math.random()*ks.length|0],n=2+(Math.random()*5|0);S.orders.push({who:WHO[Math.random()*WHO.length|0],k,n,reward:Math.round(n*IT(k).p*1.45),due:S.day+3+(Math.random()*3|0)})}
 if(S.day%10==1&&S.day>1)toast(SEA[season()].e+' فصل '+SEA[season()].n+' شروع شد')}
if(!S.orders.length||!Object.keys(S.mk).length)newDay();
function tick(){S.clock++;if(S.clock>=60){S.clock=0;S.day++;newDay()}
 const f=SEA[season()].f;
 S.plots.forEach(p=>{if(p&&p.g<CR[p.k].t&&p.w>0){p.g+=f;p.w--}});
 if(S.rain>0){S.rain--;S.plots.forEach(p=>{if(p)p.w=40})}
 S.ani.forEach(a=>{if(a.fed&&!a.rdy){a.p++;if(a.p>=AN[a.k].t)a.rdy=true}});
 save();render()}
function save(){try{localStorage.vfarm=JSON.stringify(S)}catch(e){}}
const inv=k=>S.inv[k]||0;
function act(a,d){
 if(a=='plot'){const i=+d.i,p=S.plots[i];
  if(!p){if((S.seed[S.sel]||0)<1)return toast('بذر '+CR[S.sel].n+' نداری — از بازار بخر');S.seed[S.sel]--;S.plots[i]={k:S.sel,g:0,w:40}}
  else if(p.g>=CR[p.k].t){S.inv[p.k]=inv(p.k)+2;S.plots[i]=null;toast('+۲ '+CR[p.k].e+' برداشت شد')}
  else{p.w=40;toast('💧 آبیاری شد')}}
 else if(a=='sel')S.sel=d.k;
 else if(a=='buyplot'){const c=50*(S.plots.length-4);if(S.plots.length>=24)return toast('بیشتر نمی‌شود');if(S.coins<c)return toast('سکه کم داری');S.coins-=c;S.plots.push(null,null,null)}
 else if(a=='seed'){const c=CR[d.k].c*+d.n;if(S.coins<c)return toast('سکه کم داری');S.coins-=c;S.seed[d.k]=(S.seed[d.k]||0)+ +d.n}
 else if(a=='feed'){const c=3*+d.n;if(S.coins<c)return toast('سکه کم داری');S.coins-=c;S.feed+=+d.n}
 else if(a=='buyani'){if(S.ani.length>=S.cap)return toast('طویله پر است');const c=AN[d.k].c;if(S.coins<c)return toast('سکه کم داری');S.coins-=c;S.ani.push({k:d.k,fed:false,p:0,rdy:false})}
 else if(a=='cap'){const c=200*(S.cap/4-.5|0||1);if(S.coins<c)return toast('سکه کم داری (طویله‌ی بزرگ‌تر '+c+')');S.coins-=c;S.cap+=4}
 else if(a=='ani'){const x=S.ani[+d.i];if(x.rdy){const o=AN[x.k].o;S.inv[o]=inv(o)+1;x.rdy=false;x.fed=false;x.p=0;toast('+۱ '+PR[o].e)}else if(!x.fed){if(S.feed<1)return toast('علوفه نداری — از بازار بخر');S.feed--;x.fed=true;x.p=0}}
 else if(a=='feedall'){let n=0;S.ani.forEach(x=>{if(!x.fed&&!x.rdy&&S.feed>0){S.feed--;x.fed=true;x.p=0;n++}});if(!n)toast('کسی گرسنه نیست یا علوفه نداری')}
 else if(a=='collect'){let n=0;S.ani.forEach(x=>{if(x.rdy){const o=AN[x.k].o;S.inv[o]=inv(o)+1;x.rdy=false;x.fed=false;x.p=0;n++}});if(!n)toast('محصولی آماده نیست')}
 else if(a=='sell'){const q=inv(d.k);if(!q)return;const m=d.all=='1'?q:1;S.coins+=m*price(d.k);S.inv[d.k]-=m}
 else if(a=='deliver'){const o=S.orders[+d.i];if(inv(o.k)<o.n)return toast('هنوز '+(o.n-inv(o.k))+' عدد کم داری');S.inv[o.k]-=o.n;S.coins+=o.reward;toast('🎉 '+o.who+' ممنون شد: +'+o.reward+' سکه');S.orders.splice(+d.i,1)}
 else if(a=='tab')S.tab=d.t;
 render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset)});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>act('tab',{t:b.dataset.t}));
function pctp(p){return Math.min(100,Math.round(p.g/CR[p.k].t*100))}
function render(){
 const sn=SEA[season()],h=S.clock/60;document.body.classList.toggle('n',h>.7||h<.05);
 $('top').innerHTML=`<span>${sn.e} ${sn.n} • روز <b>${S.day}</b> ${h>.7?'🌙':'☀️'}${S.rain>0?' 🌧':''}</span><span>🪙 <b>${S.coins}</b></span>`;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 let o='';
 if(S.tab=='farm'){
  o+='<div class="card"><h3>🌱 بذر انتخابی</h3><div class="row">'+Object.keys(CR).map(k=>`<button class="b o ${S.sel==k?'sel':''}" data-a="sel" data-k="${k}">${CR[k].e} ${S.seed[k]||0}</button>`).join('')+'</div><div class="sm">زمین خالی = کاشت • زمین تشنه = آبیاری (آب ۴۰ ثانیه می‌ماند) • آماده = برداشت (۲ واحد). زمستان رشد کند است.</div></div>';
  o+='<div class="grid">'+S.plots.map((p,i)=>{if(!p)return`<div class="cell" data-a="plot" data-i="${i}">➕<small>خالی</small></div>`;
   const c=CR[p.k],rd=p.g>=c.t;return`<div class="cell ${rd?'ready':p.w<=0?'dry':''}" data-a="plot" data-i="${i}">${rd?'':'<div class="bar"><i style="width:'+pctp(p)+'%"></i></div>'}${rd?c.e:'🌱'}<small>${rd?'برداشت!':p.w>0?'💧 '+pctp(p)+'%':'تشنه 🏜'}</small></div>`}).join('')+'</div>';
  if(S.plots.length<24)o+=`<div class="row" style="margin-top:10px"><button class="b" data-a="buyplot">➕ زمین بیشتر (${50*(S.plots.length-4)} 🪙)</button></div>`}
 if(S.tab=='ani'){
  o+=`<div class="card"><h3>🐄 دامداری (${S.ani.length}/${S.cap})</h3><div class="row"><span>🌿 علوفه: <b>${S.feed}</b></span><button class="b" data-a="feedall">همه را غذا بده</button><button class="b o" data-a="collect">جمع‌آوری همه</button></div></div><div class="grid">`+S.ani.map((x,i)=>{const a=AN[x.k];
   return`<div class="cell ${x.rdy?'ready':''}" data-a="ani" data-i="${i}">${x.rdy?'<div style="position:absolute;top:4px;right:6px;font-size:18px">'+PR[a.o].e+'</div>':''}${a.e}<small>${x.rdy?'بردار!':x.fed?'در حال تولید '+Math.round(x.p/a.t*100)+'%':'گرسنه — غذا بده'}</small></div>`}).join('')+'</div>';
  o+='<div class="card" style="margin-top:10px"><h3>خرید حیوان</h3><div class="row">'+Object.keys(AN).map(k=>`<button class="b" data-a="buyani" data-k="${k}">${AN[k].e} ${AN[k].c}🪙</button>`).join('')+`<button class="b g" data-a="cap">🏠 طویله بزرگ‌تر</button></div><div class="sm">هر حیوان با یک علوفه تولید می‌کند: مرغ→تخم‌مرغ، گوسفند→پشم، گاو→شیر</div></div>`}
 if(S.tab=='mkt'){
  o+='<div class="card"><h3>🛒 خرید</h3>'+Object.keys(CR).map(k=>`<div class="it"><span>${CR[k].e} بذر ${CR[k].n} (${CR[k].c}🪙) <span class="sm">دارم: ${S.seed[k]||0}</span></span><span><button class="b" data-a="seed" data-k="${k}" data-n="1">+۱</button> <button class="b" data-a="seed" data-k="${k}" data-n="5">+۵</button></span></div>`).join('')+`<div class="it"><span>🌿 علوفه (۳🪙) <span class="sm">دارم: ${S.feed}</span></span><span><button class="b" data-a="feed" data-n="5">+۵</button> <button class="b" data-a="feed" data-n="20">+۲۰</button></span></div></div>`;
  const ks=Object.keys(S.inv).filter(k=>S.inv[k]>0);
  o+='<div class="card"><h3>💰 فروش (قیمت امروز)</h3>'+(ks.length?ks.map(k=>`<div class="it"><span>${IT(k).e} ${IT(k).n} × ${S.inv[k]} <span class="sm">${price(k)}🪙 ${S.mk[k]>1.1?'📈':S.mk[k]<.9?'📉':''}</span></span><span><button class="b o" data-a="sell" data-k="${k}">۱</button> <button class="b" data-a="sell" data-k="${k}" data-all="1">همه</button></span></div>`).join(''):'<div class="sm">انبار خالی است. برداشت کن یا از حیوانات محصول بگیر.</div>')+'</div>'}
 if(S.tab=='vil'){
  o+='<div class="card"><h3>🏡 سفارش‌های روستا</h3>'+S.orders.map((q,i)=>`<div class="it"><span>${q.who} می‌خواهد: ${IT(q.k).e} ${IT(q.k).n} × ${q.n}<br><span class="sm">پاداش ${q.reward}🪙 • تا روز ${q.due} • داری: ${inv(q.k)}</span></span><button class="b ${inv(q.k)>=q.n?'':'g'}" data-a="deliver" data-i="${i}">تحویل</button></div>`).join('')+'</div>';
  const tips=['صبح زود آبیاری کن؛ آب ۴۰ ثانیه می‌ماند.','قیمت بازار هر روز عوض می‌شود: وقتی 📈 است بفروش.','مرغ ارزان است و زود تخم می‌دهد؛ برای شروع عالی است.','سفارش‌های روستا ۴۵٪ بیشتر از بازار می‌دهند.','در زمستان همه‌چیز کند است؛ پیش از آن انبار را پر کن.'];
  o+=`<div class="card"><h3>📜 زندگی روستایی</h3><div class="sm" style="font-size:14px;line-height:1.9">${tips[(S.day)%tips.length]}</div><div class="row" style="margin-top:8px"><button class="b g" id="rst">شروع دوباره‌ی مزرعه</button></div></div>`}
 $('main').innerHTML=o;const r=$('rst');if(r)r.onclick=()=>{if(confirm('همه‌چیز پاک شود؟')){localStorage.removeItem('vfarm');location.reload()}}}
render();setInterval(tick,1000);
</script></body></html>

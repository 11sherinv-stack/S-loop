html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}

.top{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.top button{font:inherit;border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
.top button.on{background:var(--btn);color:var(--btnink)}
.top span{font-size:.88rem}
.gridw{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#g{max-width:96vw;max-height:100%;touch-action:none}

.bar{display:flex;gap:10px;margin:2px 0 10px;align-items:center}
.bar button{font:inherit;border:0;background:var(--card);color:var(--ink);border-radius:50%;width:52px;height:52px;font-size:1.4rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bonus{font-size:.8rem;opacity:.85;min-height:1.2em}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
.ov div{background:var(--card);padding:22px 28px;border-radius:16px;text-align:center;line-height:2;max-width:88vw}

</style>
</head>

  const colOf=c=>rtl()?lev.W-1-c:c;
  const cells=new Map();
  lev.words.forEach(([w,r,c,d],wi)=>{for(let i=0;i<w.length;i++){const rr=d==='h'?r:r+i,cc=d==='h'?c+i:c;const k=rr+','+cc;const o=cells.get(k)||{ch:w[i],rev:false};if(found.has(wi)||hinted.has(k))o.rev=true;cells.set(k,o)}});
  gx.font='bold '+Math.floor(cs*.58)+'px Vazirmatn,Tahoma,sans-serif';gx.textAlign='center';gx.textBaseline='middle';
  cells.forEach((o,k)=>{const[r,c]=k.split(',').map(Number),x=2+colOf(c)*cs,y=2+r*cs;
    gx.fillStyle=o.rev?'#ffd54f':'#fff';gx.strokeStyle='#2e7d5b';gx.lineWidth=2;gx.beginPath();gx.roundRect?gx.roundRect(x+1,y+1,cs-2,cs-2,6):gx.rect(x+1,y+1,cs-2,cs-2);gx.fill();gx.stroke();
    if(o.rev){gx.fillStyle='#3b2a00';gx.fillText(lang==='en'?o.ch.toUpperCase():o.ch,x+cs/2,y+cs/2+1)}});
}
/* چرخ حروف */
let WR=120,CX=150,CY=150,LR=26;
function layoutWheel(){const n=letters.length;wheelPos=letters.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[CX+Math.cos(a)*(WR-34),CY+Math.sin(a)*(WR-34)]})}
function drawWheel(){
  wx.clearRect(0,0,300,300);
  wx.fillStyle='rgba(255,255,255,.55)';wx.beginPath();wx.arc(CX,CY,WR,0,7);wx.fill();
  if(sel.length>1){wx.strokeStyle='#2e9e6b';wx.lineWidth=10;wx.lineCap='round';wx.lineJoin='round';wx.beginPath();sel.forEach((i,k)=>{const p=wheelPos[i];k?wx.lineTo(p[0],p[1]):wx.moveTo(p[0],p[1])});if(dragging&&ptr)wx.lineTo(ptr[0],ptr[1]);wx.stroke()}
  wx.font='bold 30px Vazirmatn,Tahoma,sans-serif';wx.textAlign='center';wx.textBaseline='middle';
  letters.forEach((ch,i)=>{const p=wheelPos[i],on=sel.includes(i);wx.fillStyle=on?'#2e9e6b':'#fff';wx.beginPath();wx.arc(p[0],p[1],LR,0,7);wx.fill();wx.strokeStyle='#2e9e6b';wx.lineWidth=2;wx.stroke();wx.fillStyle=on?'#fff':'#16372a';wx.fillText(lang==='en'?ch.toUpperCase():ch,p[0],p[1]+2)});
}
let ptr=null;
function wpos(e){const r=wc.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]}
function hit(p){for(let i=0;i<wheelPos.length;i++)if(Math.hypot(p[0]-wheelPos[i][0],p[1]-wheelPos[i][1])<LR+6)return i;return -1}
function curText(){return sel.map(i=>letters[i]).join('')}
function showCur(){const t=curText();$('cur').innerHTML=t?'<span>'+(lang==='en'?t.toUpperCase():t)+'</span>':''}
wc.addEventListener('pointerdown',e=>{e.preventDefault();ptr=wpos(e);const h=hit(ptr);if(h<0)return;dragging=true;sel=[h];try{wc.setPointerCapture(e.pointerId)}catch(_){}beep(400+h*40,.04);showCur();drawWheel()});
wc.addEventListener('pointermove',e=>{if(!dragging)return;ptr=wpos(e);const h=hit(ptr);
  if(h>=0){const k=sel.indexOf(h);if(k===-1){sel.push(h);beep(400+h*40,.04)}else if(k===sel.length-2){sel.pop()}}
  showCur();drawWheel()});
function endDrag(){if(!dragging)return;dragging=false;ptr=null;const w=curText();sel=[];showCur();drawWheel();if(w.length>=2)submit(w)}
wc.addEventListener('pointerup',endDrag);wc.addEventListener('pointercancel',endDrag);
function submit(w){
  const idx=lev.words.findIndex(x=>x[0]===w);
  if(idx>=0){if(found.has(idx)){say(rtl()?'قبلاً پیدا شده':'Already found');return}found.add(idx);beep(800,.12);drawGrid();coins+=0;save();if(lev.words.every((_,i)=>found.has(i)||false)||allRevealed())return win();return}
  if(lev.extra.includes(w)){if(bonusFound.has(w)){say(rtl()?'قبلاً پیدا شده':'Already found');return}bonusFound.add(w);coins+=2;beep(950,.12);say(rtl()?'کلمه‌ی جایزه! +۲ 🪙':'Bonus word! +2 🪙');upd();save();return}
  beep(150,.12,'sawtooth',.05);say(rtl()?'کلمه‌ی معتبر نیست':'Not a word');
}
function allRevealed(){// همه‌ی خانه‌ها باز شده؟ (با راهنما)
  const need=new Set(),have=new Set();lev.words.forEach(([w,r,c,d],wi)=>{for(let i=0;i<w.length;i++){const k=(d==='h'?r:r+i)+','+(d==='h'?c+i:c);need.add(k);if(found.has(wi)||hinted.has(k))have.add(k)}});
  // سلول‌هایی که از کلمات پیداشده باز شده‌اند
  lev.words.forEach(([w,r,c,d],wi)=>{if(found.has(wi))for(let i=0;i<w.length;i++)have.add((d==='h'?r:r+i)+','+(d==='h'?c+i:c))});
  return need.size===have.size;
}
let sayT=0;function say(t){$('cur').innerHTML='<span style="background:#555;font-size:1rem;letter-spacing:0">'+t+'</span>';clearTimeout(sayT);sayT=setTimeout(()=>{$('cur').innerHTML=''},1200)}
function win(){
  const gain=10+bonusFound.size*2;coins+=gain;prog[lang]++;save();beep(900,.3);
  $('oh').textContent=rtl()?'🎉 آفرین!':'🎉 Great!';$('op').textContent=(rtl()?'مرحله تمام شد · +':'Level complete · +')+gain+' 🪙';$('ob').textContent=rtl()?'مرحله‌ی بعد':'Next level';$('ov').style.display='flex';
}
$('ob').onclick=()=>load();
$('sh').onclick=()=>{for(let i=letters.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}drawWheel();beep(300,.1)};
$('hn').onclick=()=>{if(coins<5){say(rtl()?'سکه‌ی کافی نداری (۵)':'Need 5 coins');return}
  // یک خانه‌ی بسته را باز کن
  const closed=[];lev.words.forEach(([w,r,c,d],wi)=>{if(found.has(wi))return;for(let i=0;i<w.length;i++){const k=(d==='h'?r:r+i)+','+(d==='h'?c+i:c);if(!hinted.has(k))closed.push(k)}});
  if(!closed.length)return;coins-=5;hinted.add(closed[Math.floor(Math.random()*closed.length)]);beep(600,.1);drawGrid();upd();save();
  if(allRevealed())setTimeout(win,400)};
$('lf').onclick=()=>{lang='fa';save();load()};$('le').onclick=()=>{lang='en';save();load()};
addEventListener('resize',()=>{drawGrid()});
if(!gx.roundRect)gx.roundRect=function(a,b,w,h){this.rect(a,b,w,h)};
load();
window.__ws={DATA,get lev(){return lev},submit,get found(){return found},get prog(){return prog},load,set lang(v){lang=v},win};
</script>
<script>
/* S Loop — اعلان‌ها (window.slNotify) و موسیقی پس‌زمینه (فقط برای بازی مستقل؛ داخل index موسیقی از صفحه‌ی اصلی پخش می‌شود) */
(function(){
  var g=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  window.slNotify=function(title,body,tag){
    try{
      if(!g('sl-notif',false)||!('Notification' in window)||Notification.permission!=='granted')return Promise.resolve(false);
      var opt={body:body||'',tag:tag||'sloop',icon:'icon.png',badge:'icon.png',lang:'fa',dir:'rtl',vibrate:[150,80,150]};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)
        return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.showNotification(title,opt).then(function(){return true});new Notification(title,opt);return true}).catch(function(){try{new Notification(title,opt);return true}catch(e){return false}});
      new Notification(title,opt);return Promise.resolve(true);
    }catch(e){return Promise.resolve(false)}
  };
  if(window.top!==window) return;
  var on=g('sl-music',true), vol=Math.max(0,Math.min(1,g('sl-mv',40)/100));
  var a=new Audio('music.mp3'); a.loop=true; a.volume=vol; a.preload='auto';
  var b=document.createElement('button'); b.setAttribute('aria-label','موسیقی');
  b.style.cssText='position:fixed;left:8px;top:8px;z-index:999;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1';
  var paint=function(){b.textContent=on?'🔊':'🔇'};
  var go=function(){if(on&&a.paused){var p=a.play();if(p&&p.catch)p.catch(function(){})}};
  b.addEventListener('click',function(e){e.stopPropagation();on=!on;try{localStorage.setItem('sl-music',JSON.stringify(on))}catch(_){}on?go():a.pause();paint()});
  ['pointerdown','keydown','touchend'].forEach(function(ev){addEventListener(ev,go,{passive:true})});
  document.addEventListener('visibilitychange',function(){document.hidden?a.pause():go()});
  paint(); document.body.appendChild(b); go();
})();
</script>
